modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Capa Deteriorer Evil Saiyan para Forge 1.20.1 con GeckoLib 4.8.1.

v1.5.0: superficie de tela continua de 96x48 con 13x3 paneles curvados,
168 huesos / 235 cubos, caida con retardo de fase y limpieza en runtime de
las losas planas y el detalle boxy. Item 3D plegado con atlas bordado.
Los 72 huesos y las animaciones originales siguen intactos; alfa base y
cobertura emisiva sin cambios. Descarga directa del .jar.
v1.4.0: capa equipada con relieve real (98 huesos / 152 cubos) e item 3D
plegado de 33 huesos con siete pliegues, yugo, cuello, broche y puntas.
Animaciones originales, alfa y glowmask intactos. Descarga directa del .jar.
v1.3.0: modelo 3D plegado de 8 huesos con atlas 128x128 continuo, texturas
procedurales multicapa, aura de brasas propia mucho más tranquila y descarga
directa del .jar desde GitHub Releases.
v1.2.0: modelo 3D en inventario, partículas propias con sprites animados y
compatibilidad opcional con el slot "back" de Curios API.
v1.1.0: atlas de textura mejorado respetando el UV, icono 64x64, animaciones
derivadas de sprint y salto sin alterar el idle/moving original, brillo emisivo
pulsante y correcciones de renderizado.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[4.8.1,)"
ordering="NONE"
side="BOTH"

# Curios es OPCIONAL: sin él la capa se equipa en el pecho como siempre.
[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5.14.1,)"
ordering="AFTER"
side="BOTH"
