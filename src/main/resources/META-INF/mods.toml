modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Mantle of the Blight Star para Forge 1.20.1 con GeckoLib 4.8.1.

v1.67.34: la tela y el halo retoman su transición tras una pausa breve de renderizado.
Se conservan el modelo, las texturas, el halo y los ocho clips.
El icono de referencia pulsa en la hotbar.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[4.8.1,)"
ordering="NONE"
side="BOTH"

# Curios es OPCIONAL: sin él la capa se equipa en el pecho como siempre.
[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5.14.1,)"
ordering="AFTER"
side="BOTH"
