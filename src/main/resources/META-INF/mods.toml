modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Mantle of the Blight Star para Forge 1.20.1 con GeckoLib 4.8.1.

v1.65.0: los dos bordes del cuello asoman apenas por los hombros.
Ocho ciclos de paño refinados, con retardo al girar y ajuste compartido en pecho o Curios (opcional).
Conserva el icono pixel art y la línea de lore localizada.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[4.8.1,)"
ordering="NONE"
side="BOTH"

# Curios es OPCIONAL: sin él la capa se equipa en el pecho como siempre.
[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5.14.1,)"
ordering="AFTER"
side="BOTH"
