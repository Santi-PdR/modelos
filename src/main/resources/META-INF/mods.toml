modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Mantle of the Blight Star para Forge 1.20.1 con GeckoLib 4.8.1.

v1.9.0: combinacion del nombre cosmico anterior con el planeta Blight Star.
El nombre visible queda en ingles en ambos idiomas; el lore sigue traducido.
Icono rehecho desde dos referencias 16x16 (hombreras, cuello alto, broche
calido, feston y ribete luminoso). Anade un motivo de estrella marchita en el
medallon, icono y broche; 4 fragmentos orbitales 3D animados; RELIEVE 3D
notorio (9 nervios en las crestas, 2 cortinas laterales continuas y 5 pesas
de dobladillo); cuello trasero, tirantes y un ARNES DELANTERO con hombreras,
tiras, cadenas, placa, bandas y faldillas animadas con giro/sprint. El item
plegado sube a 36 huesos con dos hombreras y estrena animation.item (bob,
apertura de pliegues, giro y pulso del broche) para GUI/hotbar/mano. Total:
171 huesos / 234 cubos. Segundo tipo de particulas frias en orbita corta,
presupuesto fijo de maximo 4 particulas por tick de emision y aura MUDA: sin
playSound ni SoundEvent propio (solo el equipamiento vanilla). Destellos cian
en los glow layers y brillo pulsante mas rico. Se conserva la tela lisa y
continua de v1.7/v1.8, los 72 huesos originales, el canvas 96x48, el alfa
base y los 1636 texels emisivos. Nombre interno
capatest:capa_deteriorer_evilsaiyan conservado por compatibilidad con mundos,
comandos, tag Curios, geometrias y texturas.
v1.8.0: item plegado reconstruido como bulto 3D con grosor real (34 huesos),
icono y atlas con proporcion correcta (fin del canvas estirado), canvas
redisenado con medallon completo, doble ribete, constelacion, sigilos y
dobladillo de 4 texels, 5 estrellas 3D emisivas, glowmask pulsante del item y
efecto full-sky en mano. Nombre y descripcion neutros, sin referencia Saiyan.
v1.7.0: pliegues anchos coherentes. FOLDS=3 es la unica fuente de verdad:
el sombreado del canvas y el relieve 3D en Z muestrean la misma onda coseno,
con 9 creases geometricas en los valles y 9 lenguetas de feston real.
Medallon con engarces, pespuntes, desgaste sutil y movimiento por pliegue
en bloque. 126 huesos / 180 cubos. Icono, item plegado y capa equipada
siguen compartiendo el canvas 96x48; alfa y emisivos intactos.
v1.6.1: corrige el crash al cargar geo/item/cape_folded.geo.json. El hueso
raiz ya no declara "parent": null (Gson/GeckoLib 4.8.x no tolera JsonNull);
el pipeline y el CI verifican que no quede ningun null en los recursos.
Aspecto identico a v1.6.0.
v1.6.0: UNA sola pieza de tela. Mosaico 9x3 sobre un unico rectangulo global
con canvas 96x48 compartido por la capa equipada, el icono y el item 3D
plegado; sin distorsion por seccion ni costuras pintadas. 61 huesos boxy
originales ocultos en runtime, 123 huesos / 177 cubos, vuelo de campana del
1% y caida progresiva. Se mantiene el fix de crash de v1.5.1: radianes,
cache de huesos, sin getBakedModel() por frame y fail-safe cosmético.
Los 72 huesos y las cuatro animaciones originales siguen intactos; alfa
base y cobertura emisiva sin cambios. Descarga directa del .jar.
v1.5.1: correccion del crash de rotacion de v1.5.0; superficie 13x3 con
168 huesos / 235 cubos. v1.5.0 esta rota, no usar.
v1.4.0: capa equipada con relieve real (98 huesos / 152 cubos) e item 3D
plegado de 33 huesos con siete pliegues, yugo, cuello, broche y puntas.
Animaciones originales, alfa y glowmask intactos. Descarga directa del .jar.
v1.3.0: modelo 3D plegado de 8 huesos con atlas 128x128 continuo, texturas
procedurales multicapa, aura de brasas propia mucho más tranquila y descarga
directa del .jar desde GitHub Releases.
v1.2.0: modelo 3D en inventario, partículas propias con sprites animados y
compatibilidad opcional con el slot "back" de Curios API.
v1.1.0: atlas de textura mejorado respetando el UV, icono 64x64, animaciones
derivadas de sprint y salto sin alterar el idle/moving original, brillo emisivo
pulsante y correcciones de renderizado.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[4.8.1,)"
ordering="NONE"
side="BOTH"

# Curios es OPCIONAL: sin él la capa se equipa en el pecho como siempre.
[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5.14.1,)"
ordering="AFTER"
side="BOTH"
