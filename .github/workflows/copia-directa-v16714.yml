name: Copia directa del JAR verificado v1.67.14

on:
  push:
    branches: [arena/5a9fa51b-modelos]
    paths: [.github/workflows/copia-directa-v16714.yml]

jobs:
  copia:
    if: github.repository == 'Santi-PdR/modelos' && contains(github.event.head_commit.message, '[capa-raw-v16714]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar el JAR del run verificado
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Santi-PdR/modelos
          run-id: '44775572633'
          name: capatest-jar
          path: ${{ runner.temp }}/capa-verified
      - name: Colocar sólo el JAR verificado en la rama de trabajo
        run: |
          set -euo pipefail
          branch=arena/5a9fa51b-modelos
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git branch --show-current)" = "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jar=capatest-1.67.14.jar
          input="$RUNNER_TEMP/capa-verified/$jar"
          (cd "$RUNNER_TEMP/capa-verified" && sha256sum -c "$GITHUB_WORKSPACE/docs/releases/v1.67.14/JAR.sha256")
          test "$(wc -c < "$input")" -eq 740941
          output="entregables/v1.67.14/$jar"
          test ! -e "$output"
          install -D -m 0644 "$input" "$output"
          git add -f -- "$output"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Adjuntar JAR verificado v1.67.14 para descarga directa [skip ci]'
          git push origin "$branch"
