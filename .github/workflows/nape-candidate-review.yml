name: Revisar los ensayos del retorno v1.67.32
on: push
jobs:
  revisar:
    if: github.ref_name == 'arena/5a9fa51b-modelos' && contains(github.event.head_commit.message, '[revisar-retorno-v16732]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: tools
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Examinar las dos tomas de Forge conservadas
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy Pillow
          cd "$GITHUB_WORKSPACE"
          for run in 44964845138 44965004447; do
            out="$RUNNER_TEMP/$run"
            mkdir -p "$out"
            gh run download "$run" -n capatest-jar -n capatest-maniobra-forge -D "$out"
            (cd "$out/capatest-jar" && sha256sum -c SHA256SUMS.txt)
            rc=0
            python3 tools/verify_forge_nape_settle.py "$out/capatest-maniobra-forge" docs/diagnosticos/retorno-v1.67.31/base \
              "$out/evidence" "$out/crops" > "$out/return.log" 2>&1 || rc=$?
            grep -E 'sección media|pelo recuperado|AssertionError|ValueError|FileNotFoundError' "$out/return.log" | tail -n 9 | cut -c1-450 | \
              while IFS= read -r line; do printf '::notice title=Forge %s (retorno %s)::%s\n' "$run" "$rc" "${line//%/%25}"; done
          done
          cmp "$RUNNER_TEMP"/{44964845138,44965004447}/capatest-jar/capatest-1.67.32.jar
      - name: Repetir los límites de postura sobre el primer cliente
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/revision-alex"
          gh run download 44964845138 -n capatest-fx-en-mundo -D "$out"
          rc=0
          python3 tools/verify_forge_postures.py "$out" > "$out/poses.log" 2>&1 || rc=$?
          grep -E '(agachado:|AssertionError|ValueError)' "$out/poses.log" | tail -n 6 | cut -c1-420 | \
              while IFS= read -r line; do printf '::notice title=Posturas repetidas (salida %s)::%s\n' "$rc" "${line//%/%25}"; done
      - name: Leer sólo la causa de los pasos fallidos
        run: |
          set -euo pipefail
          for job in 137031421978 137031916079; do
            gh run view --job "$job" --log-failed | \
              grep -Ei 'AssertionError:|ValueError:|::error|FX smoke: FAIL|expected .*, got' | \
              grep -Eiv 'token|password|session|https?://' | cut -c1-460 | tail -n 4 | \
              while IFS= read -r line; do printf '::notice title=Diagnóstico %s::%s\n' "$job" "${line//%/%25}"; done
          done
