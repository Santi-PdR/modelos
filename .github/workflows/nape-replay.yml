name: Revisar la primera pasada de nuca v1.67.31

on: push

jobs:
  replay:
    if: github.ref_name == 'arena/5a9fa51b-modelos' && contains(github.event.head_commit.message, '[revisar-nuca-v16731]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: '44959981837'
      SOURCE: 077c19bc0fba0e9f9a198b73db99e7f9e5b662b7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Importar las capturas y el JAR exacto de la primera pasada
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE" HEAD -- gradle.properties build.gradle settings.gradle src
          gh run view "$RUN" --json headSha,status,conclusion,jobs > "$RUNNER_TEMP/run.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'run.json').read_text())
          assert r['status']=='completed' and r['headSha']==os.environ['SOURCE']
          steps={s['name']:s['conclusion'] for j in r['jobs'] for s in j['steps']}
          for name in ('Verify jar is reproducible','Probar giro y frenada agachada en Forge (opcional)',
                       'Subir capturas y malla de la maniobra en mundo'):
              assert steps[name]=='success', (name,steps[name])
          PY
          gh run download "$RUN" -n capatest-jar -D "$RUNNER_TEMP/jar"
          echo '12bed4908c8ade27e365757019fb885af19bdf187c5cf96466c4f5c9f9d43862  capatest-1.67.31.jar' | (cd "$RUNNER_TEMP/jar" && sha256sum -c)
          gh run download "$RUN" -n capatest-maniobra-forge -D "$RUNNER_TEMP/shots"
          python3 -m pip install --quiet numpy Pillow
      - name: Conservar el motivo del fallo y las tomas de diagnóstico
        run: |
          set -euo pipefail
          export PYTHONPATH=tools OPENBLAS_NUM_THREADS=1
          base=docs/releases/v1.67.30/maniobra/diagnostico-nuca
          out=docs/diagnosticos/nuca-v1.67.31-pasada-1
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$out"
          for slot in pecho curios; do cp "$shots/maniobra-$slot.tsv" "$out/"; done
          rc=0
          python3 tools/verify_forge_combined.py "$shots" --reference docs/releases/v1.67.28/maniobra/maniobra-forge.tsv > "$out/maniobra.txt" 2>&1 || rc=$?
          echo "Salida de maniobra: $rc" >> "$out/maniobra.txt"
          rc=0
          python3 tools/verify_forge_nape.py "$base" "$out" --shots "$shots" > "$out/nuca.txt" 2>&1 || rc=$?
          echo "Salida de nuca: $rc" >> "$out/nuca.txt"
          for f in maniobra-nuca.tsv maniobra-forge.tsv maniobra-nuca-malla.tsv maniobra-nuca.jpg; do
            if [ -f "$shots/$f" ]; then cp "$shots/$f" "$out/"; fi
          done
          printf '%s\nhttps://github.com/%s/actions/runs/%s\n%s\n' "$SOURCE" "$GITHUB_REPOSITORY" "$RUN" \
             'Diagnóstico, no se adjunta el JAR ni se certifica esta pasada.' > "$out/prueba.txt"
          tail -24 "$out/maniobra.txt"
          tail -24 "$out/nuca.txt"
          grep -E 'AssertionError:|Max absolute difference|Mismatched elements|Salida de' "$out"/*.txt | tail -12 | while IFS= read -r line; do
            printf '::notice title=Repetición de las mediciones::%s\n' "${line//%/%25}"
          done
          git add "$out"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Conservar el diagnóstico de la primera pasada de nuca .31 [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
