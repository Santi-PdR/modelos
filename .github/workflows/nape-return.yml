name: Revisar el retorno de la nuca en ambos sentidos
on: push
jobs:
  return-captures:
    if: github.ref_name == 'arena/5a9fa51b-modelos' && contains(github.event.head_commit.message, '[seguir-nuca]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CAPA_PRUEBA_COMBINADA: '1'
      CAPA_SEGUIR_NUCA: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Reproducir ambos JAR entregados y capturar cada sentido
        run: |
          set -euo pipefail
          for ver in 1.67.30 1.67.31; do
            source=$(head -n 1 "docs/releases/v$ver/compilacion.txt")
            jar=capatest-$ver.jar
            git restore --source "$source" --worktree -- gradle.properties src/main src/test
            grep -qx "mod_version=$ver" gradle.properties
            gradle --no-daemon --console=plain clean build
            cmp "build/libs/$jar" "entregables/v$ver/$jar"
            (cd "entregables/v$ver" && sha256sum -c "../../docs/releases/v$ver/JAR.sha256")
            echo "::notice title=Control v$ver::El build reproduce el JAR de test-1."
            log="$RUNNER_TEMP/retorno-$ver.log"
            mkdir -p build/fx-smoke-run/config
            printf 'earlyWindowControl = false\n' > build/fx-smoke-run/config/fml.toml
            rc=0
            timeout --kill-after=12s 210s xvfb-run -a -s '-screen 0 1280x1024x24 +extension GLX -noreset' \
              gradle -PcapeFxSmoke --no-daemon --console=plain runClient > "$log" 2>&1 || rc=$?
            if [ "$rc" -ne 0 ] || ! grep -Fq 'FX smoke: PASS: maniobra combinada' "$log" ||
              grep -Fq -e 'FX smoke: FAIL' -e 'Blight Star Mantle: respuesta del paño desactivada' -e 'se usa el muestreador de GeckoLib' "$log"; then
              grep -Ei 'exception|assertionerror|\[.*ERROR\]|^> Task .*FAILED|Blight Star Mantle:|GLX|GLFW' "$log" | \
                grep -Eiv 'token|password|session|https?://' | awk '!seen[$0]++' | tail -15 | cut -c1-500 | \
                while IFS= read -r line; do printf '::warning title=Retorno v%s::%s\n' "$ver" "${line//%/%25}"; done
              exit 1
            fi
            mv build/fx-smoke-run/fx-shots "$RUNNER_TEMP/v$ver"
          done
          git restore --source "$GITHUB_SHA" --worktree -- gradle.properties src/main src/test
          git diff --exit-code -- gradle.properties src/main src/test
      - name: Comparar las capturas registradas del retorno
        id: compare
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy Pillow
          out=docs/releases/v1.67.31/maniobra/retorno
          PYTHONPATH=tools python3 tools/verify_forge_nape_return.py "$RUNNER_TEMP/v1.67.30" "$RUNNER_TEMP/v1.67.31" "$out" "$RUNNER_TEMP/recortes-retorno"
          printf 'https://github.com/%s/actions/runs/%s\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$out/prueba.txt"
          git add "$out"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Agregar capturas de seguimiento de la nuca en ambos sentidos [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Conservar cuadros y malla original del retorno
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: retorno-nuca-forge
          path: |
            ${{ runner.temp }}/v1.67.30
            ${{ runner.temp }}/v1.67.31
          if-no-files-found: warn
          retention-days: 30
