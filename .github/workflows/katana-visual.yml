name: Katana real client visual fixture
on:
  push:
    branches: ['arena/a09d390b-modelos']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  client:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[katana-visual]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Prepare test-only client fixture
        run: |
          set -euo pipefail
          python3 katana_stain/tools/preparar_test.py
          cp -R katana_stain/visual_test/java/. build-katana-input/java/
          # Load actual Better Combat clips as test resources without shipping them.
          clips=build-katana-input/resources/assets/bettercombat/attack_animations
          mkdir -p "$clips"
          for clip in two_handed_slash_horizontal_right two_handed_slash_vertical_right two_handed_slash_horizontal_left; do
            curl --fail --location --silent --show-error "https://raw.githubusercontent.com/ZsoltMolnarrr/BetterCombat/8814f0297bb85f4513646e73d604069487ce7322/common/src/main/resources/assets/bettercombat/attack_animations/${clip}.json" -o "$clips/$clip.json"
          done
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Verify animation parser and combat timing
        run: |
          STAIN_BC_TEST_DIR="$PWD/build-katana-input/resources/assets/bettercombat/attack_animations" \
            gradle verifyKatanaAnimations verifyKatanaTimeline verifyKatanaSceneCurve verifyKatanaCombatTuning -PkatanaOnly --no-daemon
      - name: Generate a flat test world with Forge
        run: |
          set -euo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          echo 'tutorialStep:none' > run/options.txt
          printf 'level-type=minecraft:flat\ngamemode=creative\nonline-mode=false\nserver-ip=127.0.0.1\nspawn-protection=0\n' > run/server.properties
          set +e
          printf 'stop\n' | timeout 180s gradle runServer -PkatanaOnly --no-daemon > /tmp/stain-visual-server.log 2>&1
          status=$?
          set -e
          if ! grep -F 'For help, type "help"' /tmp/stain-visual-server.log || [ ! -f run/world/level.dat ]; then
            tail -120 /tmp/stain-visual-server.log
            echo "::error::Server did not complete startup; status=$status"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          mkdir -p run/saves
          cp -R run/world run/saves/KatanaVisual
      - name: Render a real Forge client under Xvfb
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 420s xvfb-run -a -s '-screen 0 1280x720x24' gradle runClient -PkatanaOnly -PkatanaVisual --no-daemon > /tmp/stain-visual-client.log 2>&1 || { tail -160 /tmp/stain-visual-client.log; exit 1; }
          grep -F 'STAIN_VISUAL_FIXTURE_READY' /tmp/stain-visual-client.log
          grep -F 'STAIN_DRAGON_SELECTED' /tmp/stain-visual-client.log
          grep -F 'STAIN_DRAGON_HELD' /tmp/stain-visual-client.log
          grep -F 'STAIN_DRAGON_RELEASED' /tmp/stain-visual-client.log
          grep -F 'STAIN_MULTIPART_RANGE_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_EFFECT_SAMPLES_DONE' /tmp/stain-visual-client.log
          grep -F 'STAIN_VISUAL_FIXTURE_FINISHED' /tmp/stain-visual-client.log
          grep -F 'STAIN_FIXTURE_CLIP=bettercombat' /tmp/stain-visual-client.log
          grep -F 'STAIN_CAMERA_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_VANILLA_COMBO_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_ULTIMATE_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_FINISHER_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_FINISHER_ITEM_SWITCH_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_FINISHER_DAMAGE_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_EMPTY_X_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_LONG_RANGE_C_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_CASTER_PROTECTION_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_CANCELLATION_VERIFIED' /tmp/stain-visual-client.log
          grep -F 'STAIN_LONG_RANGE_Z_VERIFIED' /tmp/stain-visual-client.log
          count=$(find run/stain-visual-test -name '*.png' | wc -l)
          echo "Captured $count frames; software rendering can skip closely-spaced frames."
          test "$count" -ge 10
      - name: Render again without Better Combat resources
        run: |
          set -euo pipefail
          mv run/stain-visual-test run/stain-visual-bettercombat-clips
          rm -rf build-katana-input/resources/assets/bettercombat run/saves/KatanaVisual
          cp -R run/world run/saves/KatanaVisual
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 420s xvfb-run -a -s '-screen 0 1280x720x24' gradle runClient -PkatanaOnly -PkatanaVisual --no-daemon > /tmp/stain-visual-fallback.log 2>&1 || { tail -160 /tmp/stain-visual-fallback.log; exit 1; }
          grep -F 'STAIN_FIXTURE_CLIP=fallback' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_VANILLA_SWING_PLAYING' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_CAMERA_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_VANILLA_COMBO_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_ULTIMATE_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_FINISHER_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_FINISHER_DAMAGE_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_EMPTY_X_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_LONG_RANGE_C_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_CANCELLATION_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_LONG_RANGE_Z_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_DRAGON_SELECTED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_DRAGON_HELD' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_DRAGON_RELEASED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_MULTIPART_RANGE_VERIFIED' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_EFFECT_SAMPLES_DONE' /tmp/stain-visual-fallback.log
          grep -F 'STAIN_VISUAL_FIXTURE_FINISHED' /tmp/stain-visual-fallback.log
          test "$(find run/stain-visual-test -name '*.png' | wc -l)" -ge 10
          mv run/stain-visual-test run/stain-visual-vanilla
      - name: Render with complete Better Combat Forge 1.9.0
        run: |
          set -euo pipefail
          rm -rf run/saves/KatanaVisual
          cp -R run/world run/saves/KatanaVisual
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 420s xvfb-run -a -s '-screen 0 1280x720x24' gradle runClient -PkatanaOnly -PkatanaVisual -PkatanaBetterCombat --no-daemon > /tmp/stain-visual-full-bc.log 2>&1 || { tail -160 /tmp/stain-visual-full-bc.log; exit 1; }
          grep -F 'STAIN_FIXTURE_BETTERCOMBAT=true' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_CAMERA_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_ULTIMATE_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_FINISHER_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_FINISHER_DAMAGE_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_EMPTY_X_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_LONG_RANGE_C_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_CANCELLATION_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_LONG_RANGE_Z_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_DRAGON_SELECTED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_DRAGON_HELD' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_DRAGON_RELEASED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_MULTIPART_RANGE_VERIFIED' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_EFFECT_SAMPLES_DONE' /tmp/stain-visual-full-bc.log
          grep -F 'STAIN_VISUAL_FIXTURE_FINISHED' /tmp/stain-visual-full-bc.log
          test "$(find run/stain-visual-test -name '*.png' | wc -l)" -ge 10
          mv run/stain-visual-test run/stain-visual-full-bc
      - name: Report diagnostic tail
        if: failure()
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          for name in ('/tmp/stain-visual-client.log','/tmp/stain-visual-fallback.log','/tmp/stain-visual-full-bc.log','/tmp/stain-visual-server.log'):
              path=Path(name)
              if path.exists():
                  lines=path.read_text(errors='replace').splitlines()
                  problems=[line for line in lines if any(x in line for x in ('Caused by:', 'Exception', 'Mixin apply failed', 'InvalidInjection', 'InjectionError', 'InvalidMixin'))]
                  markers=[line for line in lines if any(x in line for x in ('STAIN_MULTIPART', 'STAIN_DRAGON_', 'STAIN_VISUAL_FIXTURE_FINISHED'))]
                  for line in problems[-3:] + markers[-4:]:
                      text=line.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:2500]
                      print('::error title='+path.name+'::'+text)
                  tail='\n'.join(lines[-10:]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:2500]
                  print('::error title='+path.name+' tail::'+tail)
          PY2
          echo "::error title=Visual screenshots::$(find run/stain-visual-test -name '*.png' -printf '%f ' 2>/dev/null || true)"
      - name: Upload real client images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katana-client-visual
          path: |
            run/stain-visual-bettercombat-clips/*.png
            run/stain-visual-vanilla/*.png
            run/stain-visual-full-bc/*.png
            /tmp/stain-visual-full-bc.log
            /tmp/stain-visual-fallback.log
            /tmp/stain-visual-client.log
            /tmp/stain-visual-server.log
          if-no-files-found: warn
      - name: Save images in the current branch
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p katana_stain/vistas/client-test
          rm -f katana_stain/vistas/client-test/*.png
          cp run/stain-visual-bettercombat-clips/*.png katana_stain/vistas/client-test/
          mkdir -p katana_stain/vistas/client-vanilla
          rm -f katana_stain/vistas/client-vanilla/*.png
          cp run/stain-visual-vanilla/*.png katana_stain/vistas/client-vanilla/
          mkdir -p katana_stain/vistas/client-full-bc
          rm -f katana_stain/vistas/client-full-bc/*.png
          cp run/stain-visual-full-bc/*.png katana_stain/vistas/client-full-bc/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add katana_stain/vistas/client-test/ katana_stain/vistas/client-vanilla/ katana_stain/vistas/client-full-bc/
          if ! git diff --cached --quiet; then
            git commit -m 'Record Forge client visual fixture'
            git push origin "HEAD:$BRANCH"
          fi
