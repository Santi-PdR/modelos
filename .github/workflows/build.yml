                     for _a in bb['animations'] for _an in _a['animators'].values()
                     for _k in _an['keyframes'] if _k['channel'] == 'rotation')
          # Las 4 animaciones deben tener amplitudes DISTINTAS: antes
          # `deterioro` caia en los valores de `idle` (codigo inalcanzable).
          def _rms(_a):
              _v = [float(_d) for _gid, _an in _a['animators'].items()
                    if _gid != 'effects'
                    for _k in _an['keyframes']
                    for _d in _k['data_points'][0].values()]
              return round((sum(_x * _x for _x in _v) / len(_v)) ** 0.5, 2)
          _states = {_rms(_a) for _a in bb['animations']}
          assert len(_states) == 8, ('estados con la misma amplitud', _states)
          # `preview/` NO se versiona: se valida el VISOR AUTOCONTENIDO,
