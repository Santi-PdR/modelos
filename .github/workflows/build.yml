name: Build Forge 1.20.1 + GeckoLib mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Gradle 8.8 / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Necesario para que gh release pueda crear/actualizar el asset .jar.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # El zip original no trae gradlew, por eso instalamos Gradle 8.8 directamente.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Gradle version
        run: gradle --version

      # Validación barata de assets antes de pagar el costo de ForgeGradle.
      - name: Validate resources
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root = pathlib.Path('.')
          base = root / 'src/main/resources/assets/capatest'

          for p in base.rglob('*.json'):
              json.loads(p.read_text())

          # REGRESIÓN v1.6.0: GeckoLib 4.8.x deserializa `parent` con
          # GsonHelper.getAsString(obj, "parent", null). Un `"parent": null`
          # (JsonNull) hace que Gson llame a JsonNull.getAsString() y lance
          # UnsupportedOperationException -> "Error loading model file".
          # Ningún JSON del pack de recursos puede contener un valor null.
          def json_nulls(value, path=''):
              if value is None:
                  yield path
              elif isinstance(value, dict):
                  for key, item in value.items():
                      yield from json_nulls(item, path + '/' + key)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from json_nulls(item, path + '/' + str(index))

          resource_files = list((root / 'src/main/resources').rglob('*.json'))
          resource_files.append(root / 'src/main/resources/pack.mcmeta')
          for p in resource_files:
              offenders = list(json_nulls(json.loads(p.read_text())))
              assert not offenders, (p, offenders[:5])

          # Modelo y animaciones aprobados: intocables.
          armor_anim_path = base / 'animations/item/armor/capa_deteriorer_evilsaiyan.animation.json'
          assert hashlib.sha256(armor_anim_path.read_bytes()).hexdigest() == \
              'd796ef2c349b2481077ca72f6f4b4920d066058b02119288c10cfc50f8d75dca'
          expected = {'animation.idle', 'animation.moving', 'animation.sprint', 'animation.air'}
          assert expected <= set(json.loads(armor_anim_path.read_text())['animations'])
          orig_geo_path = root / 'tools/originals/capa_deteriorer_evilsaiyan.geo.json'
          assert hashlib.sha256(orig_geo_path.read_bytes()).hexdigest() == \
              'e01e347c5be0678b18907d91452d7a0c405ec430ef3fc751096532c804d43b8c'

          for name in ('armor/capa_deteriorer_evilsaiyan.png',
                       'armor/capa_deteriorer_evilsaiyan_glowmask.png'):
              w, h = struct.unpack('>II', (base / 'textures/item' / name).read_bytes()[16:24])
              assert (w, h) == (128, 128), (name, w, h)
          icon_path = base / 'textures/item/capa_deteriorer_evilsaiyan.png'
          w, h = struct.unpack('>II', icon_path.read_bytes()[16:24])
          assert (w, h) == (64, 64), ('icon', w, h)
          # v1.10.0/v1.11.0: un icono pixel art 16x16 ampliado con NEAREST comprime
          # en menos de 2 KB. El de v1.9.0 (ilustración suave) pesaba ~6.5 KB.
          assert 300 <= icon_path.stat().st_size < 2000, icon_path.stat().st_size
          w, h = struct.unpack('>II', (base / 'textures/item/cape_folded.png').read_bytes()[16:24])
          assert (w, h) == (128, 128), ('folded atlas', w, h)
          for i in range(3):
              p = base / 'textures/particle' / f'capa_ember_{i}.png'
              w, h = struct.unpack('>II', p.read_bytes()[16:24])
              assert (w, h) == (16, 16), (p, w, h)

          particle = json.loads((base / 'particles/capa_ember.json').read_text())
          assert len(particle['textures']) == 3
          for i in range(3):
              p = base / 'textures/particle' / f'capa_blight_mote_{i}.png'
              w, h = struct.unpack('>II', p.read_bytes()[16:24])
              assert (w, h) == (16, 16), (p, w, h)

          blight_particle = json.loads((base / 'particles/capa_blight_mote.json').read_text())
          assert len(blight_particle['textures']) == 3

          # Geo plegado v1.9.0: bulto 3D de 36 huesos con 2 hombreras,
          # atlas 128 y ninguna UV fuera de rango. No es un abanico plano.
          folded = json.loads((base / 'geo/item/cape_folded.geo.json').read_text())['minecraft:geometry'][0]
          desc = folded['description']
          assert desc['identifier'] == 'geometry.cape_folded'
          assert (desc['texture_width'], desc['texture_height']) == (128, 128)
          assert len(folded['bones']) == 36
          folded_names = {b['name'] for b in folded['bones']}
          assert {'fold_0', 'fold_6', 'ridge_0', 'ridge_5', 'hem_0', 'hem_4',
                  'roll_0', 'roll_2', 'strap_L', 'strap_R', 'chain_L', 'chain_R',
                  'yoke', 'collar_center', 'clasp_frame', 'clasp',
                  'pauldron_L', 'pauldron_R'} <= folded_names
          # Raíz sin clave `parent` (NO `"parent": null`) y padres siempre
          # definidos. GeckoLib construye el árbol con `parent == null`.
          assert folded['bones'][0]['name'] == 'cape'
          assert 'parent' not in folded['bones'][0]
          for bone in folded['bones']:
              if 'parent' in bone:
                  assert isinstance(bone['parent'], str), bone['name']
                  assert bone['parent'] in folded_names, (bone['name'], bone['parent'])
          for bone in folded['bones']:
              for cube in bone.get('cubes', []):
                  for face in cube['uv'].values():
                      u, v = face['uv']
                      uw, vh = face['uv_size']
                      assert uw > 0 and vh > 0, (bone['name'], face)
                      assert 0 <= u and 0 <= v and u + uw <= 128 and v + vh <= 128, (bone['name'], face)

          folded_anim = json.loads((base / 'animations/item/cape_folded.animation.json').read_text())
          assert expected <= set(folded_anim['animations'])
          # v1.9.0: animación PROPIA del item en GUI/hotbar/mano.
          assert 'animation.item' in folded_anim['animations']
          assert len(folded_anim['animations']) == 5
          item_anim = folded_anim['animations']['animation.item']
          assert {'cape', 'clasp', 'pauldron_L', 'pauldron_R'} <= set(item_anim['bones'])
          assert 'position' in item_anim['bones']['cape']
          assert 'scale' in item_anim['bones']['clasp']
          for anim_name, spec in folded_anim['animations'].items():
              assert set(spec['bones']) <= folded_names, (anim_name, set(spec['bones']) - folded_names)

          # Geo de armadura v1.9.0: 72 huesos originales byte-idénticos en JSON,
          # más 99 de tela/relieve/arnés/estrellas/órbita => 171 huesos / 234 cubos.
          # Un ÚNICO rectángulo 9x3 sin costuras, con 3 pliegues anchos por fila.
          armor_geo = json.loads((base / 'geo/item/armor/capa_deteriorer_evilsaiyan.geo.json').read_text())['minecraft:geometry'][0]
          orig_bones = json.loads(orig_geo_path.read_text())['minecraft:geometry'][0]['bones']
          assert armor_geo['bones'][:72] == orig_bones
          assert len(armor_geo['bones']) == 171
          assert sum(len(b.get('cubes', [])) for b in armor_geo['bones']) == 234
          new_bones = armor_geo['bones'][72:]
          new_names = {b['name'] for b in new_bones}
          assert {
              'v15_cloth_cape_top_0', 'v15_cloth_cape_mid_8', 'v15_cloth_cape_bottom_6',
              'v15_crease_cape_top_0', 'v15_crease_cape_bottom_2',
              'v15_pipe_cape_top_L', 'v15_pipe_cape_bottom_R',
              'v15_hem_0', 'v15_hem_8', 'v15_shoulder_L', 'v15_shoulder_R',
              'v15_clasp', 'v15_star_0', 'v15_star_4',
              'v15_orbit_0', 'v15_orbit_3',
              'v15_ridge_cape_top_0', 'v15_drape_L', 'v15_drape_R',
              'v15_weight_0', 'v15_weight_4', 'v15_back_collar_0',
              'v15_suspend_L', 'v15_pauldron_L', 'v15_pauldron_R',
              'v15_front_strap_L', 'v15_front_chain_L', 'v15_front_clasp',
              'v15_front_collar_0', 'v15_front_placket',
              'v15_front_band_L', 'v15_front_tassel_L'
          } <= new_names
          assert sum(1 for n in new_names if n.startswith('v15_cloth_')) == 27
          assert sum(1 for n in new_names if n.startswith('v15_crease_')) == 9
          assert sum(1 for n in new_names if n.startswith('v15_hem_')) == 9
          assert sum(1 for n in new_names if n.startswith('v15_star_')) == 5
          assert sum(1 for n in new_names if n.startswith('v15_orbit_')) == 4
          assert sum(1 for n in new_names if n.startswith('v15_ridge_')) == 9
          assert sum(1 for n in new_names if n.startswith('v15_drape_')) == 2
          assert sum(1 for n in new_names if n.startswith('v15_weight_')) == 5
          assert sum(1 for n in new_names if n.startswith('v15_back_collar_')) == 3
          assert sum(1 for n in new_names if n.startswith('v15_suspend_')) == 2
          assert sum(1 for n in new_names if n.startswith('v15_pauldron_')) == 2
          assert sum(1 for n in new_names if n.startswith('v15_front_')) == 13
          # Ningún hueso de tela puede colgar de un detalle que se oculta.
          hidden = set(__import__('re').findall(
              r'"([^"]+)"', (root / 'src/main/java/com/capatest/client/CapaArmorModel.java')
              .read_text().split('HIDDEN_DETAILS = {')[1].split('};')[0]))
          assert len(hidden) == 61
          parent = {b['name']: b.get('parent') for b in armor_geo['bones']}
          for b in new_bones:
              cur, chain = parent.get(b['name']), []
              while cur:
                  chain.append(cur)
                  cur = parent.get(cur)
              assert not (set(chain) & hidden), (b['name'], set(chain) & hidden)
          opaque_rects = (
              (0.0, 0.0, 96.0, 48.0),
              (105.0, 0.0, 109.0, 48.0),
              (120.0, 0.0, 124.0, 48.0),
              (69.0, 109.0, 75.0, 127.0),
              (57.0, 76.0, 71.0, 93.0),
          )
          for bone in new_bones:
              for cube in bone.get('cubes', []):
                  for face in cube['uv'].values():
                      u, v = face['uv']
                      uw, vh = face['uv_size']
                      assert uw > 0 and vh > 0, (bone['name'], face)
                      assert 0 <= u and 0 <= v and u + uw <= 128 and v + vh <= 128, (bone['name'], face)
                      assert any(u >= x0 and v >= y0 and u + uw <= x1 and v + vh <= y1
                                 for x0, y0, x1, y1 in opaque_rects), (bone['name'], face)

          model = json.loads((base / 'models/item/capa_deteriorer_evilsaiyan.json').read_text())
          assert model['parent'] == 'builtin/entity'
          assert {'gui', 'ground', 'fixed', 'firstperson_righthand'} <= set(model['display'])

          # Garantía: capatest NO registra mixins. Un MixinTransformerError
          # en "Initializing game" (p. ej. player_animation_library) nunca
          # puede originarse en este mod.
          assert not list(root.glob('src/main/resources/**/*mixin*.json'))
          for src in (root / 'src/main/java').rglob('*.java'):
              assert 'org.spongepowered.asm.mixin' not in src.read_text(), src
          assert 'Mixin' not in (root / 'src/main/resources/META-INF/mods.toml').read_text()

          java = (root / 'src/main/java/com/capatest/item/CapaDeteriorerItem.java').read_text()
          renderer = (root / 'src/main/java/com/capatest/client/CapaItemRenderer.java').read_text()
          armor_renderer = (root / 'src/main/java/com/capatest/client/CapaArmorRenderer.java').read_text()
          armor_model = (root / 'src/main/java/com/capatest/client/CapaArmorModel.java').read_text()
          for noisy in ('ParticleTypes.PORTAL', 'ParticleTypes.CRIMSON_SPORE',
                        'ParticleTypes.SOUL_FIRE_FLAME'):
              assert noisy not in java, noisy
          assert 'useAlternateGuiLighting' in renderer
          assert 'CapaItemGlowLayer' in renderer
          assert 'LightTexture.FULL_SKY' in renderer
          item_glow = (root / 'src/main/java/com/capatest/client/CapaItemGlowLayer.java').read_text()
          assert 'RenderType.eyes' in item_glow
          assert 'cape_folded_glowmask.png' in item_glow
          assert 'Exception | LinkageError' in item_glow
          assert 'new CapaArmorModel(' in armor_renderer
          for token in ('setHidden(true)', 'setChildrenHidden(false)', 'HIDDEN_DETAILS',
                        'DataTickets.ENTITY', 'getInitialSnapshot', 'v15_cloth_', 'Mth.lerp',
                        'Math.toRadians', 'ConcurrentHashMap', 'CapaTestMod.LOGGER',
                        'Exception | LinkageError', 'private static final int COLUMNS = 9;'):
              assert token in armor_model, token
          # Regresión del crash v1.5.0: nunca grados crudos en setRot*, ni
          # getBakedModel() en el hot path (puede reiniciar los snapshots).
          assert 'panel.setRotX(baseX[i] - bend)' not in armor_model
          assert 'getBakedModel(' not in armor_model
          # v1.9.0: el canvas se ENCAJA con proporción real en icono/atlas
          # plegado (antes se estiraba 96x48 a un cuadrado) y el item tiene
          # glowmask propio. La onda 2D/3D compartida v1.7.0 sigue vigente.
          texture_src = (root / 'tools/texture_pipeline.py').read_text()
          assert 'def cloth_canvas_fitted(' in texture_src
          assert 'def build_icon_artwork(' in texture_src
          assert 'def build_folded_texture(' in texture_src
          # v1.10.0: el icono DEBE ser pixel art 16x16 ampliado con NEAREST,
          # no una ilustración con degradados/AA como la de v1.9.0.
          assert 'ICON_PIXEL_MAP' in texture_src
          assert 'ICON_PALETTE' in texture_src
          assert 'build_icon_artwork(64)' in texture_src
          assert 'Image.NEAREST' in texture_src
          assert 'def stitch(' in texture_src

          # REGRESIÓN v1.11.0: el icono debe tener SILUETA PROPIA, no la
          # forma de las dos referencias (un pico de capucha centrado +
          # hendidura central inferior). Se decodifica el PNG REAL del
          # asset (RGBA8, stdlib puro) y se muestrea la máscara alfa 16x16.
          import re as _re, zlib as _zlib
          def icon_silhouette(path):
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              pos, idat, w, h, bd, ct = 8, b'', 0, 0, 0, 0
              while pos < len(data):
                  ln = struct.unpack('>I', data[pos:pos+4])[0]
                  typ = data[pos+4:pos+8]; chunk = data[pos+8:pos+8+ln]
                  if typ == b'IHDR': w, h, bd, ct = struct.unpack('>IIBB', chunk[:10])
                  elif typ == b'IDAT': idat += chunk
                  elif typ == b'IEND': break
                  pos += 12 + ln
              assert (w, h, bd, ct) == (64, 64, 8, 6)
              raw = _zlib.decompress(idat); bpp = 4; stride = w * bpp
              prev = bytearray(stride); i = 0; rows = []
              for _ in range(h):
                  ft = raw[i]; i += 1
                  scan = bytearray(raw[i:i+stride]); i += stride
                  for x in range(stride):
                      a = scan[x-bpp] if x >= bpp else 0
                      b = prev[x]; c = prev[x-bpp] if x >= bpp else 0
                      if ft == 1: scan[x] = (scan[x] + a) & 255
                      elif ft == 2: scan[x] = (scan[x] + b) & 255
                      elif ft == 3: scan[x] = (scan[x] + ((a+b)//2)) & 255
                      elif ft == 4:
                          p = a+b-c; pa = abs(p-a); pb = abs(p-b); pc = abs(p-c)
                          pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                          scan[x] = (scan[x] + pr) & 255
                      elif ft != 0: raise AssertionError(ft)
                  rows.append(scan); prev = scan
              return [''.join('#' if rows[y*4][x*16+3] > 0 else '.'
                             for x in range(16)) for y in range(16)]
          sil = icon_silhouette(icon_path)
          def runs(row): return len(_re.findall(r'[^.]+', row))
          # Dos picos de cuello separados por un escote en V abierto.
          assert runs(sil[0]) == 2 and sil[0][6:10] == '....', sil[0]
          # Dobladillo de TRES puntas (tridente), no la hendidura central
          # de las referencias, que parte el borde inferior en dos patas.
          assert runs(sil[15]) == 3, sil[15]
          # Centro opaco en el faldón: NO hay split central.
          assert sil[12][7] == '#' and sil[12][8] == '#', sil[12]
          # La silueta coincide exactamente con ICON_PIXEL_MAP del código.
          _m = _re.search(r'ICON_PIXEL_MAP = \((.*?)\)', texture_src, _re.S).group(1)
          _rows = _re.findall(r'"([.A-Z]{16})"', _m)
          assert len(_rows) == 16
          assert sil == [''.join('#' if c != '.' else '.' for c in r) for r in _rows]
          # No es la silueta copiada de v1.10.0 (capucha de un pico).
          assert _rows[0] != '.......HKK......'
          assert 'ICON_PIXEL_MAP' in (root / 'tools/texture_pipeline.py').read_text()
          assert 'cape_folded_glowmask' in texture_src
          assert 'cool_ink' in texture_src
          assert 'def build_blight_sprites(' in texture_src
          assert '--uv-test' in (root / 'tools/preview_cloth.py').read_text()
          fg_bytes = (base / 'textures/item/cape_folded_glowmask.png').read_bytes()
          assert struct.unpack('>II', fg_bytes[16:24]) == (128, 128)
          assert len(fg_bytes) > 100, 'glowmask del item vacío'
          cloth_src = (root / 'tools/cloth_spec.py').read_text()
          assert 'COLUMNS = 9' in cloth_src
          assert 'FOLDS = 3' in cloth_src and 'def fold_wave(' in cloth_src
          # El relieve 3D y el sombreado 2D DEBEN compartir la misma onda.
          assert 'fold_at_column' in (root / 'tools/armor_model_pipeline.py').read_text()
          assert 'fold_phase = u * FOLDS' in texture_src
          assert 'column * 0.030D' in armor_model
          assert 'v15_orbit_' in armor_model
          assert 'v15_pauldron_' in armor_model and 'v15_front_chain_' in armor_model
          assert 'fold_crests' in (root / 'tools/armor_model_pipeline.py').read_text()
          assert 'def build_blight_sprites(' in texture_src
          item_src = (root / 'tools/item_model_pipeline.py').read_text()
          assert 'if parent is not None' in item_src
          assert '"parent": parent' not in item_src
          assert 'JsonNull en el geo' in item_src
          glow_layer = (root / 'src/main/java/com/capatest/client/CapaGlowLayer.java').read_text()
          curio = (root / 'src/main/java/com/capatest/client/CapaCurioRenderer.java').read_text()
          assert 'Exception | LinkageError' in glow_layer
          assert 'if (wearer == null)' in curio
          assert 'mod_version=1.11.0' in (root / 'gradle.properties').read_text()
          assert 'curios_version=5.14.1+1.20.1' in (root / 'gradle.properties').read_text()
          assert 'v1.11.0' in (root / 'src/main/resources/pack.mcmeta').read_text()
          assert '1.11.0' in (root / 'src/main/resources/META-INF/mods.toml').read_text()
          assert 'v1.11.0' in (root / 'README.md').read_text()
          assert 'Mantle of the Blight Star' in (root / 'src/main/resources/assets/capatest/lang/en_us.json').read_text()
          assert 'Mantle of the Blight Star' in (root / 'src/main/resources/assets/capatest/lang/es_es.json').read_text()
          assert 'CAPA_BLIGHT_MOTE' in java
          assert 'animation.item' in java and 'ITEM_ANIM' in java
          assert 'EMBER_INTERVAL_TICKS = 10' in java
          assert 'BLIGHT_INTERVAL_TICKS = 20' in java
          assert 'CapaBlightParticle' in (root / 'src/main/java/com/capatest/client/CapaParticleRegistration.java').read_text()
          # v1.9.0: icono rehecho desde las dos referencias 16x16 del usuario.
          assert 'def build_icon_artwork(' in texture_src
          assert 'pixel art' in (root / 'README.md').read_text()
          assert 'hombreras' in (root / 'README.md').read_text()
          for doc in ('capa_v1110_icon_compare.png', 'capa_v1110_silhouette_compare.png',
                      'capa_v1110_front_rig.png', 'capa_v1110_side_relief.png',
                      'capa_v1110_particles.png'):
              assert (root / 'docs' / doc).is_file(), doc

          # Aura MUDA: ningún playSound ni sonido propio en las partículas /
          # efectos. El único SoundEvents.* permitido es el equipamiento
          # vanilla de ArmorMaterial, que suena una vez al ponerse la capa.
          for java_src in (root / 'src/main/java').rglob('*.java'):
              src_text = java_src.read_text()
              assert 'playSound(' not in src_text, java_src
              if java_src.name != 'CapaArmorMaterial.java':
                  assert 'SoundEvents.' not in src_text, java_src

          data = root / 'src/main/resources/data'
          for p in data.rglob('*.json'):
              json.loads(p.read_text())
          tag = json.loads((data / 'curios/tags/items/back.json').read_text())['values']
          assert 'capatest:capa_deteriorer_evilsaiyan' in tag
          entity = json.loads((data / 'capatest/curios/entities/player.json').read_text())
          assert entity == {'entities': ['player'], 'slots': ['back']}
          print('OK: JSON/PNG sin JsonNull, item 36 huesos + animation.item, 171 huesos / 234 cubos, 27 paneles 9x3, relieve 3D y arnés frontal, 5 estrellas + 4 órbitas, 2 sets de partículas mudas, icono de silueta propia, glowmask del item, UV opacas y Curios back')
          PY

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # Los logs de Actions viven en un host que el sandbox no puede leer;
      # publicamos los errores de javac como anotaciones del run.
      - name: Surface compiler errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E '(error:|FAILURE:|What went wrong|^> |Caused by:|Could not resolve|Execution failed)' /tmp/gradle-build.log | head -80 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: List built jars
        run: ls -lh build/libs

      - name: Verify jar contents (v1.11.0 resources)
        run: |
          set -euo pipefail
          found=0
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            found=1
            echo "== $jar =="
            jar tf "$jar" > /tmp/jar-contents.txt
            grep -qx 'META-INF/mods.toml' /tmp/jar-contents.txt
            grep -qx 'com/capatest/CapaTestMod.class' /tmp/jar-contents.txt
