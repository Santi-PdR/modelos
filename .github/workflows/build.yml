        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E '(error:|FAILURE:|What went wrong|^> |Caused by:|Could not resolve|Execution failed)' /tmp/gradle-build.log | head -80 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: List built jars
        run: ls -lh build/libs

      - name: Verify jar contents (model resources)
        run: |
          set -euo pipefail
          found=0
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            found=1
            echo "== $jar =="
            jar tf "$jar" > /tmp/jar-contents.txt
            grep -qx 'META-INF/mods.toml' /tmp/jar-contents.txt
            grep -qx 'com/capatest/CapaTestMod.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaSparkParticle.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaIconAnimation.class' /tmp/jar-contents.txt
            for i in 1 2 3; do
              grep -qx "assets/capatest/textures/item/capa_deteriorer_evilsaiyan_f${i}.png" /tmp/jar-contents.txt
              grep -qx "assets/capatest/models/item/capa_deteriorer_evilsaiyan_f${i}.json" /tmp/jar-contents.txt
            done
            grep -qx 'com/capatest/client/CapaItemRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaItemGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorModel.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapaDeteriorerItem.class' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/armor/capa_deteriorer_evilsaiyan.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/armor/capa_deteriorer_evilsaiyan.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/cape_folded.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/cape_folded.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/particles/capa_spark.json' /tmp/jar-contents.txt
            for i in 0 1 2; do
              grep -qx "assets/capatest/textures/particle/capa_spark_${i}.png" /tmp/jar-contents.txt
            done
            grep -qx 'data/curios/tags/items/back.json' /tmp/jar-contents.txt
            grep -qx 'data/capatest/curios/entities/player.json' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaCurioRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/compat/CuriosCompat.class' /tmp/jar-contents.txt
            # El artefacto publicado DEBE llevar el geo sin JsonNull.
            unzip -p "$jar" assets/capatest/geo/item/cape_folded.geo.json > /tmp/folded-geo.json
            python3 -c 'import json; b=json.load(open("/tmp/folded-geo.json"))["minecraft:geometry"][0]["bones"]; n={x["name"] for x in b}; assert b[0]["name"]=="cape" and "parent" not in b[0]; assert all(x.get("parent","cape") in n for x in b); print("OK: geo plegado dentro del jar sin parent:null")'
            unzip -p "$jar" assets/capatest/textures/item/cape_folded_glowmask.png > /tmp/folded-glow.png
            python3 -c 'import struct; d=open("/tmp/folded-glow.png","rb").read(); assert struct.unpack(">II", d[16:24]) == (128, 128); print("OK: glowmask del item 128x128 dentro del jar")'
            unzip -p "$jar" assets/capatest/animations/item/cape_folded.animation.json > /tmp/folded-anim.json
            python3 -c 'import json; a=json.load(open("/tmp/folded-anim.json"))["animations"]; assert len(a)==5 and "animation.item" in a; print("OK: 5 animaciones con animation.item dentro del jar")'
            unzip -p "$jar" assets/capatest/geo/item/armor/capa_deteriorer_evilsaiyan.geo.json > /tmp/armor-geo.json
            python3 -c 'import json; b=json.load(open("/tmp/armor-geo.json"))["minecraft:geometry"][0]["bones"]; assert len(b)==222 and sum(len(x.get("cubes",[])) for x in b)==276; print("OK: 222 huesos / 276 cubos dentro del jar")'
            echo "OK: clases, mods.toml, 3D item, animation.item, atlas limpio + glowmask, chispa exclusiva y datos Curios presentes"
          done
          test "$found" -eq 1

      # Entrega directa: un .jar crudo como Release asset, NO un ZIP de artifact.
      # v1.17.1: la version y el TAG salen de gradle.properties, para que el
      # nombre del JAR nunca quede desincronizado. El dispatch manual sigue
      # disponible; ademas, un commit marcado [publicar] permite publicar
      # cuando el token de integracion no tiene permiso actions:write (403).
      - name: Publish direct .jar release
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publicar == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          test -n "$VER"
          TAG="v$VER"
          JAR="build/libs/capatest-$VER.jar"
          test -f "$JAR"
          NOTES=/tmp/release-notes.md
          BBF="docs/CAPA_v$VER.bbmodel"
          BB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/CAPA_v$VER.bbmodel"
          cat > "$NOTES" <<'MD'
          ## Mantle of the Blight Star __TAG__ — build más reciente

          JAR compilado en CI (JDK 17 + Gradle 8.8, Forge 1.20.1-47.3.0).
          Cada entrega sube de versión: `v1.19.0` queda como histórico y
          **no se sobreescribe**.

          **Link directo del .bbmodel (VERSIONADO)**: __BBURL__
          El archivo se llama `CAPA_v__VER__.bbmodel` y su `name`
          interno en Blockbench incluye la versión.

          ### Qué incluye

          - **v1.22.0 — ANIMACIÓN POR ESTADOS**: 8 clips reales (reposo,
            caminar, correr, volar/elytra, caída libre, agacharse, agua y
            deterioro) con silueta propia: al volar la capa se extiende y
            sube, al caer el aire la levanta, al agacharse se recoge. El
            controlador Java elige el estado con 8 ticks de transición y
            el visor tiene un selector para verlos todos.
          - **FX que SÍ se ven, sin lag**: aura de polvo con escala real,
            halo de cuello con transición de color, motas por las tres
            alturas del paño y estela al correr/volar/caer. Techo duro de
            8 partículas por tick de emisión, 2 emisiones por segundo,
            SIN geometría, SIN sonidos y SIN pista `effects` en Blockbench.
          - **Anclaje y paño**: la capa ya no es una lámina a 3-5 unidades
            del cuerpo; nace pegada a los hombros, cae curvada en 3D y las
            solapas del capuchón abrazan el torso (captura de perfil).
            Más tela arriba y jirones secundarios largos: deja de parecer
            una élitra. Capuchón sin agujeros negros, usando el carmesí de
            la propia foto (fidelidad 1.239 intacta).

          - **v1.21.0 — ANIMACIÓN REHECHA**: la onda ya NO se ancla a cero
            en el bucle (antes los 182 huesos se congelaban juntos en f=0
            y f=1). Onda viajera periódica C1 con retardo real por tramo,
            envolvente física, ráfaga/arrastre y DESPLAZAMIENTO ACUMULADO
            que curva cada jirón. GeckoLib recibe `position` con 17 muestras
            lineales; Java deja de pisar la curva y sólo suma la respuesta
            al portador. Visor sin maniquí por defecto. Forma: jirones más
            finos y puntas separadas (silueta 1.08x, fidelidad 1.239).

          - `.bbmodel` con **150 cubos de capa** / 222 grupos, textura 128×128, 8 animaciones / 26208 keyframes (rotación, posición por tramo y escala, tangentes Bézier C1). Sin maniquí, sin armadura vieja, SIN cubos flotantes y SIN pista de efectos: Blockbench abre sin buscar archivos de partículas.
          - Visor 3D autocontenido (sin red, sin servidor ni token) y comparativa
            con tu PNG de Blockbench.
          - **v1.18.0 — CAPA REHECHA DESDE CERO**: el atlas es la imagen
            del usuario limpiada a 96×48 (`tools/reference_canvas.py`) y
            cada tramo 3D muestrea su píxel por UV local (`foto_uv()`).
            Abanico radial `fan_x()` que nace junto y cierra en V, jirones
            finos con huecos negros, capuchón integrado en la foto. Sin
            grano, Bayer, bloom ni paleta sintética. El test de CI exige
            fidelidad píxel a píxel con la referencia.
          - **rev. B — sin cosas volando y animaciones mejoradas**: se
            eliminaron 26 motas/ceniza 3D, 6 tiras de yugo y las 27 anclas
            visibles; el reverso de la bufanda se integró al paño. Las
            partículas ahora se GENERAN en runtime (`spawnAura`) al llevar
            la capa. Una sola curva (`tools/cape_motion.py`) mueve la tela
            en Blockbench, GeckoLib, Java y el visor: retardo por tramo,
            vaivén de paso y barrido al correr.
          - **v1.17.2 — textura rehecha tras las capturas in-game**: el atlas
            ya NO samplea píxeles crudos del recorte (entraban brazo, arnés y
            fondo a cuadros) ni usa dithering Bayer. Paño construido desde la
            paleta medida, pliegues radiales, huecos entre lóbulos y
            cuchilladas diagonales largas en vez de confeti magenta.
          - El **icono 2D ahora se ve en el inventario**: el item usa
            `minecraft:item/generated` con `layer0`; se eliminó el BEWLR 3D
            que lo ocultaba. Motas 3D y partículas con sprites degradados y
            alpha limpio en los bordes (adiós a los bloques flotantes).
          - Capuchón con pliegues radiales y borde rasgado, dobladillo
            deshilachado por textura y alas diagonales de hombro.
          - Autoevaluación medida décima a décima: error global
            **138.96 → 77.20 → 69.47** (cobertura 24.9 pp, energía 19.9 pp,
            color 74, silueta 1.29×).
          - Se conservan: los 72 huesos originales byte-idénticos, alfa prístino,
            1636 emisivos, UV opacas ≤128, 0 `JsonNull`, 0 mixins, `curios:back`,
            222 huesos / 276 cubos y UNA chispa exclusiva en runtime.

          ### Requisitos

          Forge 1.20.1 (47.3.0), Java 17, GeckoLib 4.8.x y Curios 5.14.1+1.20.1.

          ### Descargas de esta Release

          | Archivo | Para qué |
          |---|---|
          | `capatest-__VER__.jar` | El mod compilado |
          | `CAPA_v__VER__.bbmodel` | Proyecto editable de Blockbench (VERSIONADO) |
          | `capa_v1170_visor.html` | Visor 3D offline |
          | `capa_v1170_preview.png` | 6 vistas del render software |
          | `capa_v1170_comparativa.png` | Tu referencia frente al modelo |

          Los previews son render software: la prueba in-game sigue pendiente.
          MD
          sed -i "s/__TAG__/$TAG/g; s/__VER__/$VER/g; s|__BBURL__|$BB_URL|g" "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "Mantle of the Blight Star $TAG" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          # El proyecto Blockbench y el visor offline se entregan TAMBIEN
          # como assets: el sandbox tiene el trafico publico restringido.
          test -f "$BBF"
          test -f docs/capa_v1170_visor.html
          test -f docs/capa_v1170_preview.png
          test -f docs/capa_v1170_comparativa.png
          gh release upload "$TAG" \
            "$BBF" \
            docs/capa_v1170_visor.html \
            docs/capa_v1170_preview.png \
            docs/capa_v1170_comparativa.png \
            --clobber
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -qx "capatest-$VER.jar" <<< "$ASSETS"
          grep -qx "CAPA_v$VER.bbmodel" <<< "$ASSETS"
          grep -qx 'capa_v1170_visor.html' <<< "$ASSETS"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/capatest-$VER.jar"
          echo "### Descarga directa" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[${URL}](${URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Blockbench: CAPA_v$VER.bbmodel]($BB_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Visor offline: capa_v1170_visor.html](https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/capa_v1170_visor.html)" >> "$GITHUB_STEP_SUMMARY"
