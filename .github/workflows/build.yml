name: Build Forge 1.20.1 + GeckoLib mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Gradle 8.8 / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # El zip original no trae gradlew, por eso instalamos Gradle 8.8 directamente.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Gradle version
        run: gradle --version

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: List built jars
        run: ls -lh build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: capatest-1.0.0-forge-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 90
