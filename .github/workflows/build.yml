name: Build Forge 1.20.1 + GeckoLib mod

on:
  push:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el .jar como Release (solo con aprobacion visual)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Gradle 8.8 / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Necesario para que gh release pueda crear/actualizar el asset .jar.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # El zip original no trae gradlew, por eso instalamos Gradle 8.8 directamente.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Gradle version
        run: gradle --version

      # Validación barata de assets antes de pagar el costo de ForgeGradle.
      - name: Validate resources
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root = pathlib.Path('.')
          base = root / 'src/main/resources/assets/capatest'

          for p in base.rglob('*.json'):
              json.loads(p.read_text())

          # REGRESIÓN v1.6.0: GeckoLib 4.8.x deserializa `parent` con
          # GsonHelper.getAsString(obj, "parent", null). Un `"parent": null`
          # (JsonNull) hace que Gson llame a JsonNull.getAsString() y lance
          # UnsupportedOperationException -> "Error loading model file".
          # Ningún JSON del pack de recursos puede contener un valor null.
          def json_nulls(value, path=''):
              if value is None:
                  yield path
              elif isinstance(value, dict):
                  for key, item in value.items():
                      yield from json_nulls(item, path + '/' + key)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from json_nulls(item, path + '/' + str(index))

          resource_files = list((root / 'src/main/resources').rglob('*.json'))
          resource_files.append(root / 'src/main/resources/pack.mcmeta')
          for p in resource_files:
              offenders = list(json_nulls(json.loads(p.read_text())))
              assert not offenders, (p, offenders[:5])

          # rev. B: el animation.json aprobado animaba SOLO huesos de la
          # armadura vieja (ocultos por Java). Los 4 clips DEBEN tener
          # pistas reales de los jirones nuevos, con la curva unica.
          armor_anim_path = base / 'animations/item/armor/capa_deteriorer_evilsaiyan.animation.json'
          armor_anim = json.loads(armor_anim_path.read_text())
          cape_states = {'animation.idle', 'animation.moving', 'animation.sprint',
                         'animation.air', 'animation.fall', 'animation.sneak',
                         'animation.swim', 'animation.deterioro'}
          assert cape_states <= set(armor_anim['animations'])
          for _name, _a in armor_anim['animations'].items():
              _ribs = [_b for _b in _a['bones'] if _b.startswith('v17_ribbon_')]
              assert len(_ribs) == 84, _name
              # v1.21.0: 17 muestras LINEALES. 9 muestras con easeInOutSine
              # paraban la tela en cada keyframe y GeckoLib PERDIA el canal
              # position que si tenia el .bbmodel.
              assert all(len(_a['bones'][_b]['rotation']) >= 17 for _b in _ribs), _name
              assert all('position' in _a['bones'][_b] for _b in _ribs), _name
              assert all(len(_a['bones'][_b]['position']) >= 17 for _b in _ribs), _name
              assert all(_k.get('easing') == 'linear'
                         for _b in _ribs for _k in _a['bones'][_b]['rotation'].values()), _name
          assert (root / 'tools/cape_motion.py').is_file()
          assert (root / 'tools/cape_animation_pipeline.py').is_file()
          orig_geo_path = root / 'tools/originals/capa_deteriorer_evilsaiyan.geo.json'
          assert hashlib.sha256(orig_geo_path.read_bytes()).hexdigest() == \
              'e01e347c5be0678b18907d91452d7a0c405ec430ef3fc751096532c804d43b8c'

          for name in ('armor/capa_deteriorer_evilsaiyan.png',
                       'armor/capa_deteriorer_evilsaiyan_glowmask.png'):
              w, h = struct.unpack('>II', (base / 'textures/item' / name).read_bytes()[16:24])
              assert (w, h) == (128, 128), (name, w, h)
          icon_path = base / 'textures/item/capa_deteriorer_evilsaiyan.png'
          w, h = struct.unpack('>II', icon_path.read_bytes()[16:24])
          assert (w, h) == (64, 64), ('icon', w, h)
          # v1.10.0/v1.17.0: un icono pixel art 16x16 ampliado con NEAREST comprime
          # en menos de 2 KB. El de v1.9.0 (ilustración suave) pesaba ~6.5 KB.
          assert 300 <= icon_path.stat().st_size < 2000, icon_path.stat().st_size
          # v1.24.0: 3 frames extra + overrides por capatest:frame (sin BEWLR).
          for i in (1, 2, 3):
              fp = base / 'textures/item' / f'capa_deteriorer_evilsaiyan_f{i}.png'
              w, h = struct.unpack('>II', fp.read_bytes()[16:24])
              assert (w, h) == (64, 64), (fp, w, h)
          item_root = json.loads((base / 'models/item/capa_deteriorer_evilsaiyan.json').read_text())
          _ovr = item_root.get('overrides') or []
          assert [o['predicate']['capatest:frame'] for o in _ovr] == [0.25, 0.5, 0.75], _ovr
          for i in (1, 2, 3):
              fm = json.loads((base / f'models/item/capa_deteriorer_evilsaiyan_f{i}.json').read_text())
              assert fm['parent'] == 'minecraft:item/generated', fm['parent']
              assert fm['textures']['layer0'] == f'capatest:item/capa_deteriorer_evilsaiyan_f{i}'
              assert fm['display'] == item_root['display'], 'las frames cambian de tamaño'
          _icon_java = (root / 'src/main/java/com/capatest/client/CapaIconAnimation.java').read_text()
          assert 'ItemProperties.register' in _icon_java
          assert 'getGameTime() / 4L' in _icon_java and 'FMLClientSetupEvent' in _icon_java
          w, h = struct.unpack('>II', (base / 'textures/item/cape_folded.png').read_bytes()[16:24])
          assert (w, h) == (128, 128), ('folded atlas', w, h)
          # v1.23.0: UNA partícula EXCLUSIVA, con textura propia. Se
          # retiran brasas/motas/esquirlas y TODAS las partículas vanilla.
          for i in range(3):
              sp = base / 'textures/particle' / f'capa_spark_{i}.png'
              assert sp.is_file(), sp
              with sp.open('rb') as fh:
                  head = fh.read(24)
              assert head[:8] == b'\x89PNG\r\n\x1a\n' \
                  and struct.unpack('>II', head[16:24]) == (16, 16), sp
          spark = json.loads((base / 'particles/capa_spark.json').read_text())
          assert spark['textures'] == ['capatest:capa_spark_0',
                                      'capatest:capa_spark_1',
                                      'capatest:capa_spark_2']
          assert not (base / 'particles/capa_ember.json').exists()
          assert not (base / 'particles/capa_blight_mote.json').exists()
          assert not (base / 'particles/capa_shard.json').exists()
          # (Las comprobaciones a PIXEL de la chispa, el degradado y el
          # glowmask viven en tools/audit_model.py: este paso corre ANTES
          # de instalar numpy/Pillow en CI y sólo usa stdlib.)
          # Java: ni rastro de DustParticleOptions (vanilla).
          _item = (root / 'src/main/java/com/capatest/item/CapaDeteriorerItem.java').read_text()
          assert 'DustParticleOptions' not in _item
          assert 'DustColorTransitionOptions' not in _item
          assert 'CAPA_SPARK' in _item and 'MAX_SPARKS_PER_TICK = 4' in _item
          assert 'SPARK_INTERVAL_TICKS = 6' in _item
          assert '0.12D + 0.30D' in _item, 'chispas no nacen en las puntas'
          _reg = (root / 'src/main/java/com/capatest/client/CapaParticleRegistration.java').read_text()
          assert 'CapaSparkParticle.Provider' in _reg
          _spark_java = (root / 'src/main/java/com/capatest/client/CapaSparkParticle.java').read_text()
          assert 'this.gravity = 0.0F' in _spark_java, 'la chispa tiene gravedad'
          assert 'TextureSheetParticle' in _spark_java
          # rev. B: los JSON de Snowstorm (Bedrock) siguen eliminados.
          assert not (root / 'docs/particles').exists()
          assert not list((root / 'preview/assets/particles').glob('capa_embers*.json'))

          # Geo plegado v1.9.0: bulto 3D de 36 huesos con 2 hombreras,
          # atlas 128 y ninguna UV fuera de rango. No es un abanico plano.
          folded = json.loads((base / 'geo/item/cape_folded.geo.json').read_text())['minecraft:geometry'][0]
          desc = folded['description']
          assert desc['identifier'] == 'geometry.cape_folded'
          assert (desc['texture_width'], desc['texture_height']) == (128, 128)
          assert len(folded['bones']) == 36
          folded_names = {b['name'] for b in folded['bones']}
          assert {'fold_0', 'fold_6', 'ridge_0', 'ridge_5', 'hem_0', 'hem_4',
                  'roll_0', 'roll_2', 'strap_L', 'strap_R', 'chain_L', 'chain_R',
                  'yoke', 'collar_center', 'clasp_frame', 'clasp',
                  'pauldron_L', 'pauldron_R'} <= folded_names
          # Raíz sin clave `parent` (NO `"parent": null`) y padres siempre
          # definidos. GeckoLib construye el árbol con `parent == null`.
          assert folded['bones'][0]['name'] == 'cape'
          assert 'parent' not in folded['bones'][0]
          for bone in folded['bones']:
              if 'parent' in bone:
                  assert isinstance(bone['parent'], str), bone['name']
                  assert bone['parent'] in folded_names, (bone['name'], bone['parent'])
          for bone in folded['bones']:
              for cube in bone.get('cubes', []):
                  for face in cube['uv'].values():
                      u, v = face['uv']
                      uw, vh = face['uv_size']
                      assert uw > 0 and vh > 0, (bone['name'], face)
                      assert 0 <= u and 0 <= v and u + uw <= 128 and v + vh <= 128, (bone['name'], face)

          folded_anim = json.loads((base / 'animations/item/cape_folded.animation.json').read_text())
          # El bulto plegado conserva SUS 4 clips originales; no
          # se le exigen los 8 estados de la capa equipada.
          assert {'animation.idle', 'animation.moving', 'animation.sprint',
                  'animation.air'} <= set(folded_anim['animations'])
          # v1.9.0: animación PROPIA del item en GUI/hotbar/mano.
          assert 'animation.item' in folded_anim['animations']
          assert len(folded_anim['animations']) == 5
          item_anim = folded_anim['animations']['animation.item']
          assert {'cape', 'clasp', 'pauldron_L', 'pauldron_R'} <= set(item_anim['bones'])
          assert 'position' in item_anim['bones']['cape']
          assert 'scale' in item_anim['bones']['clasp']
          for anim_name, spec in folded_anim['animations'].items():
              assert set(spec['bones']) <= folded_names, (anim_name, set(spec['bones']) - folded_names)

          # v1.17.0: la geometría se TRAZA del PNG del usuario. Los 72
          # huesos originales siguen BYTE-IDÉNTICOS; encima, 182 huesos
          # nuevos reconstruyen el ABANICO medido en la referencia.
          profile = json.loads((root / 'tools/reference_profile.json').read_text())
          assert profile['source'].startswith('referencias/REFERENCIA_CAPA.png')
          assert len(profile['silhouette']) >= 25, 'falta envolvente medida'
          assert len(profile['palette']) >= 18, 'falta paleta medida'
          assert len(profile['energy_marks']) >= 40, 'faltan grietas trazadas'
          assert (root / 'referencias/REFERENCIA_CAPA_recorte.png').is_file()
          assert (root / 'docs/referencia_analizada.png').is_file()
          assert 'def nearest_ribbon' in (root / 'tools/cape_shape.py').read_text()
          texture_pipeline = (root / 'tools/texture_pipeline.py').read_text()
          # v1.17.2: el atlas YA NO samplea pixeles crudos del recorte (asi
          # entraban el brazo beige, el arnes gris y el fondo a cuadros).
          # v1.18.0: el atlas ES la foto limpia de la referencia y cada
          # tramo 3D muestrea su propio pixel por UV local.
          assert 'from reference_canvas import canvas as foto' in texture_pipeline
          assert 'def foto_uv(' in (root / 'tools/armor_model_pipeline.py').read_text()
          assert 'def fan_x(' in (root / 'tools/cape_shape.py').read_text()
          assert (root / 'referencias/REFERENCIA_CAPA_atlas96.png').is_file()
          armor_geo = json.loads((base / 'geo/item/armor/capa_deteriorer_evilsaiyan.geo.json').read_text())['minecraft:geometry'][0]
          orig_bones = json.loads(orig_geo_path.read_text())['minecraft:geometry'][0]['bones']
          assert armor_geo['bones'][:72] == orig_bones
          assert len(armor_geo['bones']) == 222
          assert sum(len(b.get('cubes', [])) for b in armor_geo['bones']) == 276
          new_bones = armor_geo['bones'][72:]
          new_names = {b['name'] for b in new_bones}
          assert {
              'v15_cloth_cape_top_0', 'v15_cloth_cape_mid_8',
              'v17_ribbon_0_seg0', 'v17_ribbon_5_seg3', 'v17_ribbon_11_seg6',
              'v17_vein_0', 'v17_vein_9',
              'v17_cowl_front_0', 'v17_cowl_front_6',
              'v17_cowl_tooth_6', 'v17_cowl_back_4',
              'v18_pad_0', 'v18_pad_1', 'v18_chain_0', 'v18_chain_7',
          } <= new_names
          assert sum(1 for n in new_names if n.startswith('v15_cloth_')) == 27
          # v1.23.0: 12 MECHONES anchos x 7 tramos en DOS CAPAS.
          assert sum(1 for n in new_names if n.startswith('v17_ribbon_')) == 84
          assert sum(1 for n in new_names if n.startswith('v17_cowl_front_')) == 7
          assert sum(1 for n in new_names if n.startswith('v17_cowl_tooth_')) == 7
          assert sum(1 for n in new_names if n.startswith('v17_cowl_back_')) == 5
          assert sum(1 for n in new_names if n.startswith('v18_pad_')) == 2
          assert sum(1 for n in new_names if n.startswith('v18_chain_')) == 8
          assert not any(n.startswith(('v17_yoke_', 'v17_mote_', 'v17_ash_',
                                       'v16_mote_', 'v16_ash_', 'v17_shingle_'))
                         for n in new_names), 'vuelven las tiras finas sueltas'
          assert sum(1 for n in new_names if n.startswith('v17_vein_')) == 10
          veins = [b for b in new_bones if b['name'].startswith('v17_vein_')]
          assert all(c['uv']['north']['uv'][0] == 98.0
                     for b in veins for c in b['cubes']), 'grietas sin parche NEON'
          ribbons = [b for b in new_bones if b['name'].startswith('v17_ribbon_')]
          assert all(0.40 <= c['size'][2] <= 0.85
                     and 0.01 <= c.get('inflate', 0) <= 0.05
                     and c['uv']['north']['uv'][0] == c['uv']['south']['uv'][0]
                     for b in ribbons for c in b['cubes']), 'banda UV / espesor'
          # Anclaje + DOS CAPAS con profundidad real.
          _zs = [c['origin'][2] + c['size'][2] / 2
                 for b in ribbons for c in b['cubes']]
          assert min(_zs) < 2.0, ('capa lejos del cuerpo', min(_zs))
          assert max(_zs) - min(_zs) > 1.5, ('capa plana', min(_zs), max(_zs))
          _shape = (root / 'tools/cape_shape.py').read_text()
          assert '1.55 + 1.30 * tt' in _shape, 'falta la curva de profundidad'
          assert 'RIBBONS = 12' in _shape, 'vuelven las 16 tiras de élitra'
          assert 'def layer(k:' in _shape, 'faltan las dos capas'
          assert 'def cowl_uv(' in (root / 'tools/armor_model_pipeline.py').read_text()
          # Mechones anchos: al menos 1.6 unidades en el primer tramo.
          assert all(c['size'][0] >= 1.55 for b in ribbons
                     if b['name'].endswith('seg0') for c in b['cubes']), \
              'mechón demasiado estrecho'
          # Punta AFILADA: el último tramo mide < 0.20 de ancho.
          assert all(c['size'][0] <= 0.20 for b in ribbons
                     if b['name'].endswith('seg6') for c in b['cubes']), \
              'las puntas no son afiladas'
          # V: las alas exteriores mueren ANTES que las centrales.
          def _y(b): return b['cubes'][0]['origin'][1]
          def _bn(name): return next(b for b in ribbons if b['name'] == name)
          assert _y(_bn('v17_ribbon_0_seg6')) > _y(_bn('v17_ribbon_5_seg6')) + 2.0
          assert _y(_bn('v17_ribbon_11_seg6')) > _y(_bn('v17_ribbon_6_seg6')) + 2.0
          # Atlas limpio: sólo comprobaciones de FICHERO aquí (stdib).
          # El degradado, el glowmask y la chispa se miden a pixel en
          # tools/audit_model.py --check (paso con numpy/Pillow instalado).
          assert (base / 'textures/item/armor/capa_deteriorer_evilsaiyan_glowmask.png').is_file()
          assert 'build_clean_atlas' in (root / 'tools/texture_pipeline.py').read_text()

          # REGRESIÓN rev. B: ningún cubo de la capa puede quedar
          # DESPRENDIDO. Se mide la distancia al vecino más cercano.
          import math as _math
          _centres = []
          for _b in new_bones:
              for _c in _b.get('cubes', []):
                  _o, _sz = _c['origin'], _c['size']
                  _centres.append(tuple(_o[i] + _sz[i] / 2 for i in range(3)))
          _worst = 0.0
          for _i, _c0 in enumerate(_centres):
              _best = min(_math.dist(_c0, _c1)
                          for _j, _c1 in enumerate(_centres) if _j != _i)
              _worst = max(_worst, _best)
          assert _worst < 2.2, ('pieza desprendida', _worst)
          # Ningún hueso de tela puede colgar de un detalle que se oculta.
          hidden = set(__import__('re').findall(
              r'"([^"]+)"', (root / 'src/main/java/com/capatest/client/CapaArmorModel.java')
              .read_text().split('HIDDEN_DETAILS = {')[1].split('};')[0]))
          assert len(hidden) == 61
          parent = {b['name']: b.get('parent') for b in armor_geo['bones']}
          for b in new_bones:
              cur, chain = parent.get(b['name']), []
              while cur:
                  chain.append(cur)
                  cur = parent.get(cur)
              assert not (set(chain) & hidden), (b['name'], set(chain) & hidden)
          opaque_rects = (
              (0.0, 0.0, 128.0, 128.0),   # v1.23.0: atlas limpio 100% opaco
              (0.0, 0.0, 96.0, 48.0),
              (105.0, 0.0, 109.0, 48.0),
              (120.0, 0.0, 124.0, 48.0),
              (69.0, 109.0, 75.0, 127.0),
              (57.0, 76.0, 71.0, 93.0),
          )
          for bone in new_bones:
              for cube in bone.get('cubes', []):
                  for face in cube['uv'].values():
                      u, v = face['uv']
                      uw, vh = face['uv_size']
                      assert uw > 0 and vh > 0, (bone['name'], face)
                      assert 0 <= u and 0 <= v and u + uw <= 128 and v + vh <= 128, (bone['name'], face)
                      assert any(u >= x0 and v >= y0 and u + uw <= x1 and v + vh <= y1
                                 for x0, y0, x1, y1 in opaque_rects), (bone['name'], face)

          model = json.loads((base / 'models/item/capa_deteriorer_evilsaiyan.json').read_text())
          # v1.17.2: el BEWLR 3D tapaba el icono 2D en el inventario.
          # El item DEBE usar el modelo plano con layer0 = icono.
          assert model['parent'] == 'minecraft:item/generated', model['parent']
          assert model['textures']['layer0'] == 'capatest:item/capa_deteriorer_evilsaiyan'
          assert {'gui', 'ground', 'fixed', 'firstperson_righthand'} <= set(model['display'])
          icon_bytes = (base / 'textures/item/capa_deteriorer_evilsaiyan.png').read_bytes()
          assert icon_bytes[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', icon_bytes[16:24]) == (64, 64)
          assert len(icon_bytes) > 800
          item_java = (root / 'src/main/java/com/capatest/item/CapaDeteriorerItem.java').read_text()
          assert 'getCustomRenderer' not in item_java, 'el BEWLR vuelve a ocultar el icono'

          # Garantía: capatest NO registra mixins. Un MixinTransformerError
          # en "Initializing game" (p. ej. player_animation_library) nunca
          # puede originarse en este mod.
          assert not list(root.glob('src/main/resources/**/*mixin*.json'))
          for src in (root / 'src/main/java').rglob('*.java'):
              assert 'org.spongepowered.asm.mixin' not in src.read_text(), src
          assert 'Mixin' not in (root / 'src/main/resources/META-INF/mods.toml').read_text()

          java = (root / 'src/main/java/com/capatest/item/CapaDeteriorerItem.java').read_text()
          renderer = (root / 'src/main/java/com/capatest/client/CapaItemRenderer.java').read_text()
          armor_renderer = (root / 'src/main/java/com/capatest/client/CapaArmorRenderer.java').read_text()
          armor_model = (root / 'src/main/java/com/capatest/client/CapaArmorModel.java').read_text()
          for noisy in ('ParticleTypes.PORTAL', 'ParticleTypes.CRIMSON_SPORE',
                        'ParticleTypes.SOUL_FIRE_FLAME'):
              assert noisy not in java, noisy
          assert 'useAlternateGuiLighting' in renderer
          assert 'CapaItemGlowLayer' in renderer
          assert 'LightTexture.FULL_SKY' in renderer
          item_glow = (root / 'src/main/java/com/capatest/client/CapaItemGlowLayer.java').read_text()
          assert 'RenderType.eyes' in item_glow
          assert 'cape_folded_glowmask.png' in item_glow
          assert 'Exception | LinkageError' in item_glow
          assert 'new CapaArmorModel(' in armor_renderer
          for token in ('setHidden(true)', 'setChildrenHidden(false)', 'HIDDEN_DETAILS',
                        'DataTickets.ENTITY', 'getInitialSnapshot', 'v15_cloth_', 'Mth.lerp',
                        'Math.toRadians', 'ConcurrentHashMap', 'CapaTestMod.LOGGER',
                        'Exception | LinkageError', 'private static final int COLUMNS = 9;'):
              assert token in armor_model, token
          # Regresión del crash v1.5.0: nunca grados crudos en setRot*, ni
          # getBakedModel() en el hot path (puede reiniciar los snapshots).
          assert 'panel.setRotX(baseX[i] - bend)' not in armor_model
          assert 'getBakedModel(' not in armor_model
          # v1.9.0: el canvas se ENCAJA con proporción real en icono/atlas
          # plegado (antes se estiraba 96x48 a un cuadrado) y el item tiene
          # glowmask propio. La onda 2D/3D compartida v1.7.0 sigue vigente.
          texture_src = (root / 'tools/texture_pipeline.py').read_text()
          assert 'def cloth_canvas_fitted(' in texture_src
          assert 'def build_icon_artwork(' in texture_src
          assert 'def build_folded_texture(' in texture_src
          # v1.10.0: el icono DEBE ser pixel art 16x16 ampliado con NEAREST,
          # no una ilustración con degradados/AA como la de v1.9.0.
          assert 'ICON_PIXEL_MAP' in texture_src
          assert 'ICON_PALETTE' in texture_src
          assert 'build_icon_artwork(64)' in texture_src
          assert 'Image.NEAREST' in texture_src
          assert 'def build_armor_cloth_canvas(' in texture_src
          assert 'energy_ramp' in (root / 'tools/cloth_spec.py').read_text()
