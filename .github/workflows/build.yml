name: Build Forge mod
on:
  push:
    branches: [arena/76d4b082-modelos]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resource regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build reobfuscated Forge JAR
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: holo-relic-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Deliver requested JAR on this branch
        if: github.ref == 'refs/heads/arena/76d4b082-modelos'
        shell: bash
        run: |
          mkdir -p deliverables
          cp build/libs/holo-relic-1.20.1-1.0.0.jar deliverables/
          sha256sum deliverables/*.jar > deliverables/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/
          if ! git diff --cached --quiet; then
            git commit -m "Deliver compiled holographic relic JAR [skip ci]"
            git push origin HEAD:arena/76d4b082-modelos
          fi
