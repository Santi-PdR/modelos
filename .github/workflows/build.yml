name: Build Forge 1.20.1 + GeckoLib mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Gradle 8.8 / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Necesario para que gh release pueda crear/actualizar el asset .jar.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # El zip original no trae gradlew, por eso instalamos Gradle 8.8 directamente.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Gradle version
        run: gradle --version

      # Validación barata de assets antes de pagar el costo de ForgeGradle.
      - name: Validate resources
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root = pathlib.Path('.')
          base = root / 'src/main/resources/assets/capatest'

          for p in base.rglob('*.json'):
              json.loads(p.read_text())

          # REGRESIÓN v1.6.0: GeckoLib 4.8.x deserializa `parent` con
          # GsonHelper.getAsString(obj, "parent", null). Un `"parent": null`
          # (JsonNull) hace que Gson llame a JsonNull.getAsString() y lance
          # UnsupportedOperationException -> "Error loading model file".
          # Ningún JSON del pack de recursos puede contener un valor null.
          def json_nulls(value, path=''):
              if value is None:
                  yield path
              elif isinstance(value, dict):
                  for key, item in value.items():
                      yield from json_nulls(item, path + '/' + key)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from json_nulls(item, path + '/' + str(index))

          resource_files = list((root / 'src/main/resources').rglob('*.json'))
          resource_files.append(root / 'src/main/resources/pack.mcmeta')
          for p in resource_files:
              offenders = list(json_nulls(json.loads(p.read_text())))
              assert not offenders, (p, offenders[:5])

          # Modelo y animaciones aprobados: intocables.
          armor_anim_path = base / 'animations/item/armor/capa_deteriorer_evilsaiyan.animation.json'
          assert hashlib.sha256(armor_anim_path.read_bytes()).hexdigest() == \
              'd796ef2c349b2481077ca72f6f4b4920d066058b02119288c10cfc50f8d75dca'
          expected = {'animation.idle', 'animation.moving', 'animation.sprint', 'animation.air'}
          assert expected <= set(json.loads(armor_anim_path.read_text())['animations'])
          orig_geo_path = root / 'tools/originals/capa_deteriorer_evilsaiyan.geo.json'
          assert hashlib.sha256(orig_geo_path.read_bytes()).hexdigest() == \
              'e01e347c5be0678b18907d91452d7a0c405ec430ef3fc751096532c804d43b8c'

          for name in ('armor/capa_deteriorer_evilsaiyan.png',
                       'armor/capa_deteriorer_evilsaiyan_glowmask.png'):
              w, h = struct.unpack('>II', (base / 'textures/item' / name).read_bytes()[16:24])
              assert (w, h) == (128, 128), (name, w, h)
          w, h = struct.unpack('>II', (base / 'textures/item/capa_deteriorer_evilsaiyan.png').read_bytes()[16:24])
          assert (w, h) == (64, 64), ('icon', w, h)
          w, h = struct.unpack('>II', (base / 'textures/item/cape_folded.png').read_bytes()[16:24])
          assert (w, h) == (128, 128), ('folded atlas', w, h)
          for i in range(3):
              p = base / 'textures/particle' / f'capa_ember_{i}.png'
              w, h = struct.unpack('>II', p.read_bytes()[16:24])
              assert (w, h) == (16, 16), (p, w, h)

          particle = json.loads((base / 'particles/capa_ember.json').read_text())
          assert len(particle['textures']) == 3

          # Geo plegado v1.8.0: bulto 3D de 34 huesos, atlas 128 y ninguna UV
          # fuera de rango. Ya no es un abanico plano de 7 láminas.
          folded = json.loads((base / 'geo/item/cape_folded.geo.json').read_text())['minecraft:geometry'][0]
          desc = folded['description']
          assert desc['identifier'] == 'geometry.cape_folded'
          assert (desc['texture_width'], desc['texture_height']) == (128, 128)
          assert len(folded['bones']) == 34
          folded_names = {b['name'] for b in folded['bones']}
          assert {'fold_0', 'fold_6', 'ridge_0', 'ridge_5', 'hem_0', 'hem_4',
                  'roll_0', 'roll_2', 'strap_L', 'strap_R', 'chain_L', 'chain_R',
                  'yoke', 'collar_center', 'clasp_frame', 'clasp'} <= folded_names
          # Raíz sin clave `parent` (NO `"parent": null`) y padres siempre
          # definidos. GeckoLib construye el árbol con `parent == null`.
          assert folded['bones'][0]['name'] == 'cape'
          assert 'parent' not in folded['bones'][0]
          for bone in folded['bones']:
              if 'parent' in bone:
                  assert isinstance(bone['parent'], str), bone['name']
                  assert bone['parent'] in folded_names, (bone['name'], bone['parent'])
          for bone in folded['bones']:
              for cube in bone.get('cubes', []):
                  for face in cube['uv'].values():
                      u, v = face['uv']
                      uw, vh = face['uv_size']
                      assert uw > 0 and vh > 0, (bone['name'], face)
                      assert 0 <= u and 0 <= v and u + uw <= 128 and v + vh <= 128, (bone['name'], face)

          folded_anim = json.loads((base / 'animations/item/cape_folded.animation.json').read_text())
          assert expected <= set(folded_anim['animations'])
          for anim_name, spec in folded_anim['animations'].items():
              assert set(spec['bones']) <= folded_names, (anim_name, set(spec['bones']) - folded_names)

          # Geo de armadura v1.8.0: 72 huesos originales byte-idénticos en JSON,
          # más 59 huesos de tela/relieve/estrellas => 131 huesos / 185 cubos.
          # Un ÚNICO rectángulo 9x3 sin costuras, con 3 pliegues anchos por fila.
          armor_geo = json.loads((base / 'geo/item/armor/capa_deteriorer_evilsaiyan.geo.json').read_text())['minecraft:geometry'][0]
          orig_bones = json.loads(orig_geo_path.read_text())['minecraft:geometry'][0]['bones']
          assert armor_geo['bones'][:72] == orig_bones
          assert len(armor_geo['bones']) == 131
          assert sum(len(b.get('cubes', [])) for b in armor_geo['bones']) == 185
          new_bones = armor_geo['bones'][72:]
          new_names = {b['name'] for b in new_bones}
          assert {
              'v15_cloth_cape_top_0', 'v15_cloth_cape_mid_8', 'v15_cloth_cape_bottom_6',
              'v15_crease_cape_top_0', 'v15_crease_cape_bottom_2',
              'v15_pipe_cape_top_L', 'v15_pipe_cape_bottom_R',
              'v15_hem_0', 'v15_hem_8', 'v15_shoulder_L', 'v15_shoulder_R',
              'v15_clasp', 'v15_star_0', 'v15_star_4'
          } <= new_names
          assert sum(1 for n in new_names if n.startswith('v15_cloth_')) == 27
          assert sum(1 for n in new_names if n.startswith('v15_crease_')) == 9
          assert sum(1 for n in new_names if n.startswith('v15_hem_')) == 9
          assert sum(1 for n in new_names if n.startswith('v15_star_')) == 5
          # Ningún hueso de tela puede colgar de un detalle que se oculta.
          hidden = set(__import__('re').findall(
              r'"([^"]+)"', (root / 'src/main/java/com/capatest/client/CapaArmorModel.java')
              .read_text().split('HIDDEN_DETAILS = {')[1].split('};')[0]))
          assert len(hidden) == 61
          parent = {b['name']: b.get('parent') for b in armor_geo['bones']}
          for b in new_bones:
              cur, chain = parent.get(b['name']), []
              while cur:
                  chain.append(cur)
                  cur = parent.get(cur)
              assert not (set(chain) & hidden), (b['name'], set(chain) & hidden)
          opaque_rects = (
              (0.0, 0.0, 96.0, 48.0),
              (105.0, 0.0, 109.0, 48.0),
              (120.0, 0.0, 124.0, 48.0),
              (69.0, 109.0, 75.0, 127.0),
              (57.0, 76.0, 71.0, 93.0),
          )
          for bone in new_bones:
              for cube in bone.get('cubes', []):
                  for face in cube['uv'].values():
                      u, v = face['uv']
                      uw, vh = face['uv_size']
                      assert uw > 0 and vh > 0, (bone['name'], face)
                      assert 0 <= u and 0 <= v and u + uw <= 128 and v + vh <= 128, (bone['name'], face)
                      assert any(u >= x0 and v >= y0 and u + uw <= x1 and v + vh <= y1
                                 for x0, y0, x1, y1 in opaque_rects), (bone['name'], face)

          model = json.loads((base / 'models/item/capa_deteriorer_evilsaiyan.json').read_text())
          assert model['parent'] == 'builtin/entity'
          assert {'gui', 'ground', 'fixed', 'firstperson_righthand'} <= set(model['display'])

          # Garantía: capatest NO registra mixins. Un MixinTransformerError
          # en "Initializing game" (p. ej. player_animation_library) nunca
          # puede originarse en este mod.
          assert not list(root.glob('src/main/resources/**/*mixin*.json'))
          for src in (root / 'src/main/java').rglob('*.java'):
              assert 'org.spongepowered.asm.mixin' not in src.read_text(), src
          assert 'Mixin' not in (root / 'src/main/resources/META-INF/mods.toml').read_text()

          java = (root / 'src/main/java/com/capatest/item/CapaDeteriorerItem.java').read_text()
          renderer = (root / 'src/main/java/com/capatest/client/CapaItemRenderer.java').read_text()
          armor_renderer = (root / 'src/main/java/com/capatest/client/CapaArmorRenderer.java').read_text()
          armor_model = (root / 'src/main/java/com/capatest/client/CapaArmorModel.java').read_text()
          for noisy in ('ParticleTypes.PORTAL', 'ParticleTypes.CRIMSON_SPORE',
                        'ParticleTypes.SOUL_FIRE_FLAME'):
              assert noisy not in java, noisy
          assert 'useAlternateGuiLighting' in renderer
          assert 'CapaItemGlowLayer' in renderer
          assert 'LightTexture.FULL_SKY' in renderer
          item_glow = (root / 'src/main/java/com/capatest/client/CapaItemGlowLayer.java').read_text()
          assert 'RenderType.eyes' in item_glow
          assert 'cape_folded_glowmask.png' in item_glow
          assert 'Exception | LinkageError' in item_glow
          assert 'new CapaArmorModel(' in armor_renderer
          for token in ('setHidden(true)', 'setChildrenHidden(false)', 'HIDDEN_DETAILS',
                        'DataTickets.ENTITY', 'getInitialSnapshot', 'v15_cloth_', 'Mth.lerp',
                        'Math.toRadians', 'ConcurrentHashMap', 'CapaTestMod.LOGGER',
                        'Exception | LinkageError', 'private static final int COLUMNS = 9;'):
              assert token in armor_model, token
          # Regresión del crash v1.5.0: nunca grados crudos en setRot*, ni
          # getBakedModel() en el hot path (puede reiniciar los snapshots).
          assert 'panel.setRotX(baseX[i] - bend)' not in armor_model
          assert 'getBakedModel(' not in armor_model
          # v1.8.0: el canvas se ENCAJA con proporción real en icono/atlas
          # plegado (antes se estiraba 96x48 a un cuadrado) y el item tiene
          # glowmask propio. La onda 2D/3D compartida v1.7.0 sigue vigente.
          texture_src = (root / 'tools/texture_pipeline.py').read_text()
          assert 'def cloth_canvas_fitted(' in texture_src
          assert 'def build_icon_artwork(' in texture_src
          assert 'def build_folded_texture(' in texture_src
          assert 'cape_folded_glowmask' in texture_src
          assert '--uv-test' in (root / 'tools/preview_cloth.py').read_text()
          fg_bytes = (base / 'textures/item/cape_folded_glowmask.png').read_bytes()
          assert struct.unpack('>II', fg_bytes[16:24]) == (128, 128)
          assert len(fg_bytes) > 100, 'glowmask del item vacío'
          cloth_src = (root / 'tools/cloth_spec.py').read_text()
          assert 'COLUMNS = 9' in cloth_src
          assert 'FOLDS = 3' in cloth_src and 'def fold_wave(' in cloth_src
          # El relieve 3D y el sombreado 2D DEBEN compartir la misma onda.
          assert 'fold_at_column' in (root / 'tools/armor_model_pipeline.py').read_text()
          assert 'fold_phase = u * FOLDS' in texture_src
          assert 'column * 0.030D' in armor_model
          item_src = (root / 'tools/item_model_pipeline.py').read_text()
          assert 'if parent is not None' in item_src
          assert '"parent": parent' not in item_src
          assert 'JsonNull en el geo' in item_src
          glow_layer = (root / 'src/main/java/com/capatest/client/CapaGlowLayer.java').read_text()
          curio = (root / 'src/main/java/com/capatest/client/CapaCurioRenderer.java').read_text()
          assert 'Exception | LinkageError' in glow_layer
          assert 'if (wearer == null)' in curio
          assert 'mod_version=1.8.0' in (root / 'gradle.properties').read_text()
          assert 'curios_version=5.14.1+1.20.1' in (root / 'gradle.properties').read_text()
          assert 'v1.8.0' in (root / 'src/main/resources/pack.mcmeta').read_text()
          assert '1.8.0' in (root / 'src/main/resources/META-INF/mods.toml').read_text()
          assert 'v1.8.0' in (root / 'README.md').read_text()
          assert 'Dying Star Mantle' in (root / 'src/main/resources/assets/capatest/lang/en_us.json').read_text()
          assert 'Manto de la Estrella Moribunda' in (root / 'src/main/resources/assets/capatest/lang/es_es.json').read_text()

          data = root / 'src/main/resources/data'
          for p in data.rglob('*.json'):
              json.loads(p.read_text())
          tag = json.loads((data / 'curios/tags/items/back.json').read_text())['values']
          assert 'capatest:capa_deteriorer_evilsaiyan' in tag
          entity = json.loads((data / 'capatest/curios/entities/player.json').read_text())
          assert entity == {'entities': ['player'], 'slots': ['back']}
          print('OK: JSON/PNG sin JsonNull, bulto 34 huesos, 131 huesos / 185 cubos, 27 paneles 9x3, 5 estrellas 3D, icono proporcionado, glowmask del item, UV opacas y Curios back')
          PY

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # Los logs de Actions viven en un host que el sandbox no puede leer;
      # publicamos los errores de javac como anotaciones del run.
      - name: Surface compiler errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E '(error:|FAILURE:|What went wrong|^> |Caused by:|Could not resolve|Execution failed)' /tmp/gradle-build.log | head -80 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: List built jars
        run: ls -lh build/libs

      - name: Verify jar contents (v1.8.0 resources)
        run: |
          set -euo pipefail
          found=0
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            found=1
            echo "== $jar =="
            jar tf "$jar" > /tmp/jar-contents.txt
            grep -qx 'META-INF/mods.toml' /tmp/jar-contents.txt
            grep -qx 'com/capatest/CapaTestMod.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaEmberParticle.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaItemRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaItemGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorModel.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapaDeteriorerItem.class' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/armor/capa_deteriorer_evilsaiyan.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/armor/capa_deteriorer_evilsaiyan.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/cape_folded.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/cape_folded.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/particles/capa_ember.json' /tmp/jar-contents.txt
            for i in 0 1 2; do
              grep -qx "assets/capatest/textures/particle/capa_ember_${i}.png" /tmp/jar-contents.txt
            done
            grep -qx 'data/curios/tags/items/back.json' /tmp/jar-contents.txt
            grep -qx 'data/capatest/curios/entities/player.json' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaCurioRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/compat/CuriosCompat.class' /tmp/jar-contents.txt
            # El artefacto publicado DEBE llevar el geo sin JsonNull.
            unzip -p "$jar" assets/capatest/geo/item/cape_folded.geo.json > /tmp/folded-geo.json
            python3 -c 'import json; b=json.load(open("/tmp/folded-geo.json"))["minecraft:geometry"][0]["bones"]; n={x["name"] for x in b}; assert b[0]["name"]=="cape" and "parent" not in b[0]; assert all(x.get("parent","cape") in n for x in b); print("OK: geo plegado dentro del jar sin parent:null")'
            unzip -p "$jar" assets/capatest/textures/item/cape_folded_glowmask.png > /tmp/folded-glow.png
            python3 -c 'import struct; d=open("/tmp/folded-glow.png","rb").read(); assert struct.unpack(">II", d[16:24]) == (128, 128); print("OK: glowmask del item 128x128 dentro del jar")'
            echo "OK: clases, mods.toml, 3D item, glowmask, partículas y datos Curios presentes"
          done
          test "$found" -eq 1

      # Entrega directa: un .jar crudo como Release asset, NO un ZIP de artifact.
      - name: Publish direct .jar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="build/libs/capatest-1.8.0.jar"
          test -f "$JAR"
          NOTES=/tmp/release-notes.md
          cat > "$NOTES" <<'MD'
          ## Manto de la Estrella Moribunda v1.8.0 — item, nombre y material

          Prioridad: **que la capa se vea bien en la mano, en el slot y equipada**.

          ### Item en mano / slot, rehecho

          El abanico plano de 7 láminas parecía una tabla oscura. Ahora es un
          **bulto de capa doblada con grosor real**: bloque de forro, 7 franjas
          delanteras con relieve en Z, yugo, cuello levantado, broche de
          diamante, cadenas, tiras, 3 rollos de tela y 5 puntas de dobladillo
          (**34 huesos**). Las 7 caras siguen reconstruyendo una sola
          ilustración, pero con volumen y pliegues horizontales.
          - `CapaItemRenderer` fuerza `LightTexture.FULL_SKY` fuera de la GUI:
            en las capturas nocturnas el item ya no se ve casi negro.
          - `CapaItemGlowLayer` re-renderiza `cape_folded_glowmask.png` con
            `RenderType.eyes` y un pulso suave de 2.6 s. No modifica el atlas
            base, así que un fallo del efecto no deja huecos.
          - Display transforms ajustados para que el bulto mire a la cámara en
            GUI, primera y tercera persona.

          ### Fin del "mal recortado"

          El icono 64×64 y el atlas plegado **estiraban** el canvas 96×48 a un
          cuadrado: el medallón se deformaba y la silueta parecía cortada.
          v1.8.0 los encaja con la proporción real (`cloth_canvas_fitted`) y
          dibuja un icono propio de capa doblada (`build_icon_artwork`) con
          doble ribete, halo, medallón completo, filigrana, constelación y
          chevron. El atlas plegado añade gema de diamante legible, yugo y
          dobladillo sobrios, y columnas reservadas más discretas.

          ### Más detalles y efectos en la capa equipada

          - **Medallón completo**: antes lo tapaba el yugo (centro en v=14);
            ahora está en v=18.5 con tres anillos, diamante, engarces y núcleo.
          - **Doble ribete perimetral**, sigilos laterales, campo de estrellas,
            constelación y filigrana bordada. Sin líneas de costura entre
            paneles.
          - **Dobladillo de 4 texels** (antes 2) con chevron y pespuntes, para
            que el festón no se corte.
          - **5 estrellas 3D** (`v15_star_*`) en los puntos de la constelación;
            usan la zona emisiva ya existente, así que `CapaGlowLayer` las hace
            latir **sin ampliar la cobertura del glowmask** (1636 texels).
          - **Geometría**: 131 huesos / 185 cubos (27 paneles 9×3, 9 creases,
            6 ribetes, 9 lengüetas, 5 estrellas, 2 alas, 1 broche).

          Se mantienen: onda compartida `FOLDS=3` entre sombreado 2D y relieve
          3D, canvas 96×48 continuo, 61 huesos boxy ocultos, alfa base
          byte-idéntico, 1636 emisivos, 354 caras UV nuevas en zonas opacas,
          radianes, caché, fail-safes, cero `JsonNull`, cero mixins, Curios
          `back` opcional y aura serena.

          ### Nombre y descripción

          Nuevo nombre neutro, sin la referencia Saiyan: **Dying Star Mantle** /
          **Manto de la Estrella Moribunda**, con lore de sarga violeta,
          constelaciones y brasas serenas. El ID interno
          `capatest:capa_deteriorer_evilsaiyan` se conserva para no romper
          mundos, comandos ni el tag de Curios. El README trae otras opciones
          de nombre por si prefieres cambiarlo.

          ## Histórico v1.7.0 — pliegues anchos coherentes 2D/3D

          `cloth_spec.FOLDS = 3` pasó a ser la única fuente de verdad: el
          sombreado (`fold_wave`) y el relieve en Z de `panel_z()` muestrean la
          misma onda coseno. 3 pliegues anchos, 9 creases 3D en los valles,
          festón real, medallón con tercer anillo, pespuntes, desgaste discreto
          y movimiento por pliegue en bloque. 126 huesos / 180 cubos.

          ## Histórico v1.6.1 — corrige el crash al cargar el geo

          **Fix del crash reportado in-game**: `GeckoLibException:
          capatest:geo/item/cape_folded.geo.json: Error loading model file`
          (juego cerrado mientras `Rendering overlay`). Esta vez **sí era
          nuestro mod**.

          - **Causa**: `tools/item_model_pipeline.py` escribía
            `"parent": null` en el hueso raíz `cape` del geo plegado.
            GeckoLib 4.8.x deserializa ese campo con
            `GsonHelper.getAsString(obj, "parent", null)`. Como la clave está
            presente, Gson obtiene un `JsonNull` y llama a `getAsString()`,
            que lanza `UnsupportedOperationException`; GeckoLib lo envuelve
            como "Error loading model file" durante el reload de recursos,
            antes de poder renderizar el item en el inventario.
          - **Corrección**: los huesos raíz **omiten** la clave `parent`, que
            es el formato Bedrock correcto y lo que ya hacía el geo original
            aprobado en sus 8 raíces. `GeometryTree.fromModel` sigue tratando
            `parent == null` como raíz, así que la geometría no cambia en nada.
          - **Defensa**: el pipeline ahora falla si el geo contiene cualquier
            `null` o un padre inexistente; el CI escanea **todos** los JSON del
            pack de recursos en busca de `JsonNull` y verifica que la raíz del
            geo plegado no declare `parent`. El aspecto de la capa es idéntico
            a v1.6.0.

          Era un defecto latente desde v1.4.0 que no se había podido detectar:
          el arranque anterior se caía antes por un conflicto de mixins ajeno
          al mod, por lo que el juego nunca llegaba a cargar los recursos.

          ## Base v1.6.0 — una sola pieza de tela

          Prioridad de esa versión: **apariencia y calidad de la capa**.

          - **Superficie realmente continua.** v1.5.1 calculaba los límites por
            sección y repartía 13 columnas sobre cada una: la ilustración se
            estiraba de forma distinta arriba, en el centro y abajo, y partía el
            medallón. Ahora las tres secciones comparten **un único rectángulo
            global** y el canvas 96×48 se divide en un mosaico **9×3** con
            exactamente la misma escala en las 27 caras. Sin líneas de costura
            pintadas: los pliegues son sombreado y un relieve suave en Z.
          - **Menos cajas, más paño.** Se ocultan en runtime los **61 huesos
            originales con cubos** que no pertenecen a la cadena
            `chestplate → cape_top/mid/bottom` (placas, dedos, jirones,
            faldones, hombreras y tiras). El geo prístino sigue byte-idéntico y
            sus animaciones siguen accionando a los huesos padres; el aspecto
            de "cajas apiladas" desaparece.
          - **Geometría más ligera:** 123 huesos / 177 cubos frente a 168 / 235
            de v1.5.1. 27 paneles, 6 creases, 6 ribetes laterales, 9 lengüetas
            de dobladillo, 2 alas de cuello y un broche en diamante girado 45°.
            Vuelo de campana del 1% y caída progresiva hacia atrás, sin romper
            la línea continua del borde.
          - **Mismo diseño en todas partes.** El icono de inventario y el item
            3D plegado (7 pliegues) muestrean ahora el **mismo canvas** que la
            capa equipada: un único medallón, la misma filigrana y el mismo
            dobladillo. Antes llevaban una ilustración aparte con dos
            medallones. Material algo más claro para que se lea en la espalda
            con la luz del juego.
          - **Herramienta de validación visual versionada.**
            `tools/preview_cloth.py` genera previews de frente/3-4/espalda, tela
            sola, detalle original y canvas; `--uv-test` pinta franjas de
            colores para comprobar que el orden UV del mosaico es correcto y
            que las filas quedan alineadas.

          Garantías que se mantienen:

          - **Estabilidad v1.5.1**: todos los ángulos se convierten con
            `Math.toRadians` antes de `setRot*`; sin `getBakedModel()` en el hot
            path; huesos resueltos una vez con caché; fail-safe cosmético que
            registra el error y deja la capa estática en vez de tumbar el juego.
          - **Movimiento**: onda con retardo de fase de hombros a dobladillo,
            viento, giro, salto, agua, sigilo y sprint; animaciones
            `idle/moving/sprint/air` intactas. Inspirado en WaveyCapes, Finery
            y GlowberryClient #102/#106, sin portar código incompatible.
          - **Assets**: alfa base byte-idéntico, cobertura emisiva de 1636
            texels sin cambios, todas las UV nuevas en zonas ya opacas,
            glowmask 128×128, icono 64×64, 3 sprites de 16×16, aura serena.
          - Curios `5.14.1+1.20.1` opcional con slot `back`; sin Curios se
            equipa en pecho y se ve en F5. Rarity EPIC, `fireResistant`, foil,
            lore en_us/es_es y `/give @s capatest:capa_deteriorer_evilsaiyan`.

          ### Si el juego no arranca con `MixinTransformerError`

          Ese error **no lo causa este mod** y es distinto del
          `GeckoLibException: Error loading model file` que corrigió v1.6.1.

          `player_animation_library.mixins.json:firstPerson.ItemInHandRendererMixin`
          pertenece a **Player Animation Library**, no a `capatest`. Su método
          `cancelItemRender` es un `@Inject` sobre
          `ItemInHandRenderer#renderItem` en el punto `INVOKE` de
          `ItemRenderer.renderStatic(LivingEntity, ItemStack,
          ItemDisplayContext, boolean, PoseStack, MultiBufferSource, Level,
          int, int, int)`. Sirve para ocultar el item de la mano cuando una
          animación dibuja el modelo en tercera persona.

          `(0/1) succeeded. Scanned 1 target(s)` significa que Mixin **encontró
          el método** `renderItem` pero **no encontró esa llamada concreta**
          dentro de él, así que no pudo aplicar ni una inyección. Causas
          típicas: otro mixin ya reescribió `renderItem` o cambió la firma de
          `renderStatic`, o el `refmap` no coincide con el mapping SRG de este
          Forge. Ocurre en `Initializing game` porque la transformación de
          clases sucede al arrancar, cuando `Minecraft.<init>` construye el
          `EntityRenderDispatcher` y se carga `ItemInHandRenderer` — antes de
          cualquier mundo y de que exista una capa equipada. En el stack no
          aparece ni una clase `com.capatest.*`: el mod no registra mixins
          (verificado en CI).

          **Cómo desatascarlo** (nombres del pack reportado):
          1. Quitar `ImmediatelyFast-Forge-1.5.5+1.20.4.jar`: es una build de
             **1.20.4 corriendo en 1.20.1** y toca precisamente el render de
             items. Sustituirla por la build 1.20.1.
          2. Quitar los snapshots `TRansition-1.0.21-...` y `TRender-1.0.15-...`,
             que transforman el render de primera persona.
          3. Actualizar `PlayerAnimationLibForge-1.2.8+1.20.1-all.jar` a una
             build 1.20.1 compatible, o quitarlo **junto con sus dependientes**
             (`fiskheroes`, `TRender`/`TRansition`).
          4. Probar primero con Forge + GeckoLib + Curios + `capatest` y añadir
             el resto por grupos. Quitar `capatest` no arregla este arranque.

          El README trae el procedimiento completo y el enlace al código del
          mixin.

          Requiere Forge 1.20.1 (47.3.0), Java 17 y GeckoLib 4.8.1 (4.8.x).
          **Descarga: el `.jar` directo de este Release**, no un ZIP de
          artifact. Compilado y validado en CI. Los previews son software y no
          sustituyen una prueba in-game; si algo falla, el mod registra
          `Manto de la Estrella Moribunda: ... desactivada` en el log en vez de propagarlo.
          MD
          if gh release view v1.8.0 >/dev/null 2>&1; then
            gh release upload v1.8.0 "$JAR" --clobber
          else
            gh release create v1.8.0 "$JAR" \
              --title "Manto de la Estrella Moribunda v1.8.0" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          ASSETS="$(gh release view v1.8.0 --json assets --jq '.assets[].name')"
          grep -qx 'capatest-1.8.0.jar' <<< "$ASSETS"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.8.0/capatest-1.8.0.jar"
          echo "### Descarga directa" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[${URL}](${URL})" >> "$GITHUB_STEP_SUMMARY"
