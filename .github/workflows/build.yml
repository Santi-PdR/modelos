          assert f'CAPA_v{ver}.bbmodel' in _index, 'docs/index.html con bbmodel viejo'
          assert f'releases/tag/v{ver}' in _index, 'docs/index.html con release vieja'
          assert f'{ver}' in _index, 'docs/index.html sin la version vigente'
          assert len(ver.split('.')) == 3 and all(x.isdigit() for x in ver.split('.')), ver
          assert f'mod_version={ver}' in (root / 'gradle.properties').read_text()
          assert 'curios_version=5.14.1+1.20.1' in (root / 'gradle.properties').read_text()
          assert f'v{ver}' in (root / 'src/main/resources/pack.mcmeta').read_text()
          assert ver in (root / 'src/main/resources/META-INF/mods.toml').read_text()
          assert f'v{ver}' in (root / 'README.md').read_text()
          assert 'Mantle of the Blight Star' in (root / 'src/main/resources/assets/capatest/lang/en_us.json').read_text()
          assert 'Mantle of the Blight Star' in (root / 'src/main/resources/assets/capatest/lang/es_es.json').read_text()
          assert 'CAPA_SPARK' in java
          assert 'animation.item' in java and 'ITEM_ANIM' in java
          assert 'SPARK_INTERVAL_TICKS = 8' in java
          assert spark_budget(java) == (8, 3), spark_budget(java)
          assert 'CapaSparkParticle.Provider' in (root / 'src/main/java/com/capatest/client/CapaParticleRegistration.java').read_text()
          # v1.9.0: icono rehecho desde las dos referencias 16x16 del usuario.
          assert 'def build_icon_artwork(' in texture_src
          assert 'pixel art' in (root / 'README.md').read_text()
          assert 'hombreras' in (root / 'README.md').read_text()
          for doc in ('capa_v1170_preview.png', 'capa_v1170_icon.png',
                      'capa_v1170_icon_compare.png', 'capa_v1170_silhouette_compare.png',
                      'capa_v1170_side_relief.png', 'capa_v1170_front_rig.png',
                      'capa_v1170_item_glowmask.png', 'capa_v1170_particles.png',
                      'capa_v1170_uv_test.png',
                      'capa_v1170_visor.html'):
              assert (root / 'docs' / doc).is_file(), doc

          # Aura MUDA: ningún playSound ni sonido propio en las partículas /
