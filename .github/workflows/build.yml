              src_text = java_src.read_text()
              assert 'playSound(' not in src_text, java_src
              if java_src.name != 'CapaArmorMaterial.java':
                  assert 'SoundEvents.' not in src_text, java_src

          data = root / 'src/main/resources/data'
          for p in data.rglob('*.json'):
              json.loads(p.read_text())
          tag = json.loads((data / 'curios/tags/items/back.json').read_text())['values']
          assert 'capatest:capa_deteriorer_evilsaiyan' in tag
          entity = json.loads((data / 'capatest/curios/entities/player.json').read_text())
          assert entity == {'entities': ['player'], 'slots': ['back']}
          stand = (root / 'docs/capa_v1170_visor.html').read_text()
          assert 'fetch(' not in stand and 'assets/' not in stand, 'visor no autocontenido'
          assert 'INLINE_GEO' in stand
          assert f'download="CAPA_v{ver}.bbmodel"' in stand, 'visor sin version'

          assert 'spawnAura(Level level, Player player, boolean deterioro)' in java
          assert 'spawnAura(player.level(), player, deterioro)' in (root / 'src/main/java/com/capatest/compat/CuriosCompat.java').read_text()
          assert (root / 'tools/audit_model.py').is_file()
          assert '--check' in (root / 'tools/audit_model.py').read_text()
          assert 'tools/audit_model.py --check' in (root / '.github/workflows/build.yml').read_text()
          # v1.27.1: la descarga del JAR PUBLICADO tiene que ser
          # REPRODUCIBLE y VERIFICABLE, no un `curl` a mano. El script
          # baja la rama de artefactos (codeload), que es la unica via
          # que responde cuando el CDN de releases esta bloqueado, y
          # comprueba el SHA-256 contra el digest que devuelve la API.
          # v1.27.1: el .jar tiene que ser REPRODUCIBLE (mismo codigo ->
          # mismo binario), para que el SHA-256 publicado sirva para
          # verificar la descarga. Sin preserveFileTimestamps=false el ZIP
          # guarda la fecha de cada entrada y el digest cambia en cada
          # republicacion.
          _bg = (root / 'build.gradle').read_text()
          assert 'preserveFileTimestamps = false' in _bg, \
              'el .jar no es reproducible (timestamps del ZIP)'
          assert 'reproducibleFileOrder = true' in _bg, \
              'el orden de entradas del .jar no es reproducible'
          assert 'Verify jar is reproducible' in \
              (root / '.github/workflows/build.yml').read_text(), \
              'la CI no comprueba que el .jar sea reproducible'
          _fetch = (root / 'tools/fetch_published_jar.py').read_text()
          assert 'codeload.github.com' in _fetch, 'la descarga no usa codeload'
          assert 'published_digest' in _fetch, 'no verifica contra la API'
          assert 'SHA256SUMS.txt' in _fetch, 'no comprueba el SHA256SUMS'
          assert 'capatest-{ver}.jar' in _fetch
          print(f'OK: v{ver}, geometria rehecha (12 mechones anchos en 2 capas), '
                'cuello alto + hombreras + cadena, atlas limpio con glowmask '
                'fullbright, chispa EXCLUSIVA sin particulas vanilla, icono PREFERIDO revertido con backup byte-identico y sin lag')
          PY

      # v1220: la autoevaluacion MEDIDA se ejecuta AQUI, en GitHub Actions,
      # no solo en el sandbox. Instala numpy/Pillow y falla el build si la
      # capa se aleja de la referencia del usuario.
      - name: Autoevaluacion visual contra la referencia
        run: |
          python3 -m pip install --quiet numpy Pillow
          PYTHONPATH=tools python3 tools/audit_model.py --check
          # v1240: el calibrador de energia es un lazo cerrado Jacobi; se
          # comprueba que siga siendo importable y que el perfil medido
          # (10 bandas) siga apuntando a la referencia del usuario.
          python3 -m py_compile tools/energy_calibration.py
          PYTHONPATH=tools python3 -c "import energy_calibration as E; t=E.target(); g=E.read_gains(); assert len(t)==10 and len(g)==12 and min(t)>0; print('OK: objetivo de energia por banda', [round(x,1) for x in t])"

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # v1.27.1: EL JAR TIENE QUE SER REPRODUCIBLE. Sin esto, dos builds
      # del mismo codigo dan .jar distintos (el ZIP guarda timestamps) y el
      # SHA-256 publicado cambia en cada republicacion, con lo que no
      # sirve para verificar nada. Se reconstruye el .jar y se compara.
      #
      # Va ANTES de publicar: solo se sube a la release y a la rama de
      # artefactos un .jar ya verificado como reproducible.
      - name: Verify jar is reproducible
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/capatest-$VER.jar"
          test -f "$JAR"
          SHA1="$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "sha256 del primer build : $SHA1"
          # Se borra SOLO el .jar y se vuelve a empaquetar: las clases ya
          # compiladas se reutilizan, asi que el segundo build es rapido.
          rm -f "$JAR"
          gradle jar reobfJar --no-daemon --console=plain 2>&1 | tail -5
          test -f "$JAR"
          SHA2="$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "sha256 del segundo build: $SHA2"
          if [ "$SHA1" != "$SHA2" ]; then
            echo "::error::el .jar NO es reproducible ($SHA1 != $SHA2)"
            exit 1
          fi
          echo "OK: el .jar es byte-identico entre builds (sha256:$SHA1)"

      # Los logs de Actions viven en un host que el sandbox no puede leer;
      # publicamos los errores de javac como anotaciones del run.
      - name: Surface compiler errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E '(error:|FAILURE:|What went wrong|^> |Caused by:|Could not resolve|Execution failed)' /tmp/gradle-build.log | head -80 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: List built jars
        run: ls -lh build/libs

      # v1.27.0: El JAR tambien se sube como ARTIFACT de Actions. La
      # descarga del asset de Release rebota a release-assets.github.com,
      # que esta bloqueado en el sandbox; el artifact se sirve por la API,
      # que si es accesible. Ademas permite bajar el .jar exacto del run.
      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capatest-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Verify jar contents (model resources)
        run: |
          set -euo pipefail
          found=0
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            found=1
            echo "== $jar =="
            jar tf "$jar" > /tmp/jar-contents.txt
            grep -qx 'META-INF/mods.toml' /tmp/jar-contents.txt
            grep -qx 'com/capatest/CapaTestMod.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaSparkParticle.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaItemRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaItemGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorModel.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapaDeteriorerItem.class' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/armor/capa_deteriorer_evilsaiyan.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/armor/capa_deteriorer_evilsaiyan.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/cape_folded.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/cape_folded.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/particles/capa_spark.json' /tmp/jar-contents.txt
            for i in 0 1 2; do
              grep -qx "assets/capatest/textures/particle/capa_spark_${i}.png" /tmp/jar-contents.txt
            done
            grep -qx 'data/curios/tags/items/back.json' /tmp/jar-contents.txt
            grep -qx 'data/capatest/curios/entities/player.json' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaCurioRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/compat/CuriosCompat.class' /tmp/jar-contents.txt
            # El artefacto publicado DEBE llevar el geo sin JsonNull.
            unzip -p "$jar" assets/capatest/geo/item/cape_folded.geo.json > /tmp/folded-geo.json
            python3 -c 'import json; b=json.load(open("/tmp/folded-geo.json"))["minecraft:geometry"][0]["bones"]; n={x["name"] for x in b}; assert b[0]["name"]=="cape" and "parent" not in b[0]; assert all(x.get("parent","cape") in n for x in b); print("OK: geo plegado dentro del jar sin parent:null")'
            unzip -p "$jar" assets/capatest/textures/item/cape_folded_glowmask.png > /tmp/folded-glow.png
            python3 -c 'import struct; d=open("/tmp/folded-glow.png","rb").read(); assert struct.unpack(">II", d[16:24]) == (128, 128); print("OK: glowmask del item 128x128 dentro del jar")'
            unzip -p "$jar" assets/capatest/animations/item/cape_folded.animation.json > /tmp/folded-anim.json
            python3 -c 'import json; a=json.load(open("/tmp/folded-anim.json"))["animations"]; assert len(a)==5 and "animation.item" in a; print("OK: 5 animaciones con animation.item dentro del jar")'
            unzip -p "$jar" assets/capatest/geo/item/armor/capa_deteriorer_evilsaiyan.geo.json > /tmp/armor-geo.json
            python3 -c 'import json; b=json.load(open("/tmp/armor-geo.json"))["minecraft:geometry"][0]["bones"]; assert len(b)==225 and sum(len(x.get("cubes",[])) for x in b)==270; print("OK: 225 huesos / 270 cubos (losas sin cubos + cuellito) dentro del jar")'
            echo "OK: clases, mods.toml, 3D item, animation.item, atlas limpio + glowmask, chispa exclusiva y datos Curios presentes"
          done
          test "$found" -eq 1

      # Entrega directa: un .jar crudo como Release asset, NO un ZIP de artifact.
      # v1.17.1: la version y el TAG salen de gradle.properties, para que el
      # nombre del JAR nunca quede desincronizado. El dispatch manual sigue
      # disponible; ademas, un commit marcado [publicar] permite publicar
      # cuando el token de integracion no tiene permiso actions:write (403).
      - name: Publish direct .jar release
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publicar == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          test -n "$VER"
          TAG="v$VER"
          JAR="build/libs/capatest-$VER.jar"
          test -f "$JAR"
          NOTES=/tmp/release-notes.md
          BBF="docs/CAPA_v$VER.bbmodel"
          BB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/CAPA_v$VER.bbmodel"
          cat > "$NOTES" <<'MD'
          ## Mantle of the Blight Star __TAG__ — build más reciente

          JAR compilado en CI (JDK 17 + Gradle 8.8, Forge 1.20.1-47.3.0).
          Cada entrega sube de versión: `v1.19.0` queda como histórico y
          **no se sobreescribe**.

          **Link directo del .bbmodel (VERSIONADO)**: __BBURL__
          El archivo se llama `CAPA_v__VER__.bbmodel` y su `name`
          interno en Blockbench incluye la versión.

          ### Qué incluye

          - **v1.37.0 — DECIMO ARMONICO, SEPTIMO SHIMMER Y SEPTIMO PARPADEO**:
            seguir mejorando el modelo en todos sus aspectos. (1)
            ANIMACION: la onda viajante suma un DECIMO armonico
            (`k=10`, amplitud `0.01`, fase `10.9*φ`) sobre el noveno de la
            v1.36.0: el destello de los hilos mas finos al viento se
            vuelve mas fino, sin romper la periodicidad ni la costura C1
            (lo comprueba el self-test de `cape_motion.py`). (2) EFECTOS:
            el SHIMMER emisivo suma un SEPTIMO componente a mayor
