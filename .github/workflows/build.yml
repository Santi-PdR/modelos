          ### Requisitos

          Forge 1.20.1 (47.3.0), Java 17, GeckoLib 4.8.x y Curios 5.14.1+1.20.1.

          ### Verificar la descarga

          El SHA-256 del `.jar` va en el resumen del build y en el README.
          La CI lo compara con el JAR recién compilado: lo publicado es
          byte a byte lo que se compiló.

          ### Descargas de esta Release

          | Archivo | Para qué |
          |---|---|
          | `capatest-__VER__.jar` | El mod compilado |
          | `CAPA_v__VER__.bbmodel` | Proyecto editable de Blockbench (VERSIONADO) |
          | `capa_v1170_visor.html` | Visor 3D offline |
          | `capa_v1170_preview.png` | 6 vistas del render software |
          | `capa_v1170_comparativa.png` | Tu referencia frente al modelo |

          Los previews son render software: la prueba in-game sigue pendiente.
          MD
          sed -i "s/__TAG__/$TAG/g; s/__VER__/$VER/g; s|__BBURL__|$BB_URL|g" "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "Mantle of the Blight Star $TAG" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          # El proyecto Blockbench y el visor offline se entregan TAMBIEN
          # como assets: el sandbox tiene el trafico publico restringido.
          test -f "$BBF"
          test -f docs/capa_v1170_visor.html
          test -f docs/capa_v1170_preview.png
          test -f docs/capa_v1170_comparativa.png
          gh release upload "$TAG" \
            "$BBF" \
            docs/capa_v1170_visor.html \
            docs/capa_v1170_preview.png \
            docs/capa_v1170_comparativa.png \
            --clobber
          # v1.27.0: VERIFICAR QUE LO PUBLICADO ES LO COMPILADO. La API
          # de GitHub devuelve el SHA-256 de cada asset: se compara con el
          # del JAR recién compilado. Si el upload se corrompiese o subiese
          # un binario viejo, aqui se ve.
          LOCAL_SHA="$(sha256sum "$JAR" | cut -d' ' -f1)"
          API_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="capatest-'"$VER"'.jar") | .digest' \
            | sed 's/^sha256://')"
          test -n "$API_SHA"
          test "$LOCAL_SHA" = "$API_SHA" || {
            echo "::error::el JAR publicado (sha256:$API_SHA) NO es el compilado (sha256:$LOCAL_SHA)"
            exit 1
          }
          echo "OK: el JAR publicado es byte-identico al compilado (sha256:$LOCAL_SHA)"
          echo "sha256 del JAR: $LOCAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -qx "capatest-$VER.jar" <<< "$ASSETS"
          grep -qx "CAPA_v$VER.bbmodel" <<< "$ASSETS"
          grep -qx 'capa_v1170_visor.html' <<< "$ASSETS"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/capatest-$VER.jar"
          echo "### Descarga directa" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[${URL}](${URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Blockbench: CAPA_v$VER.bbmodel]($BB_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Visor offline: capa_v1170_visor.html](https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/capa_v1170_visor.html)" >> "$GITHUB_STEP_SUMMARY"

      # v1.27.1: COPIA DEL JAR EN UNA RAMA DE ARTEFACTOS.
      # El CDN de assets de release (release-assets.githubusercontent.com) y
      # el de artifacts (blob.core.windows.net) no son accesibles desde
      # algunos entornos; una RAMA del repo si se baja por
      # codeload.github.com. La rama lleva el .jar EXACTO del build y su
      # SHA256SUMS.txt, para poder verificar el binario entregado.
      #
      # El commit se construye en un DIRECTORIO TEMPORAL: el arbol de
      # trabajo del checkout NO se toca, asi que este paso no puede romper
      # la publicacion de la release.
      - name: Publish jar to artifacts branch
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publicar == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/capatest-$VER.jar"
          test -f "$JAR"
          BRANCH="artifacts/v$VER"
          SHA="$(sha256sum "$JAR" | cut -d' ' -f1)"
          TMP="$(mktemp -d)"
          cp "$JAR" "$TMP/artifact.jar"
          cd "$TMP"
          git init -q -b tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p build/libs
          mv artifact.jar "build/libs/capatest-$VER.jar"
          printf '%s\n' "$SHA" > "build/libs/SHA256SUMS.txt"
          git add -A
          git commit -q -m "artefacto v$VER: capatest-$VER.jar (sha256:$SHA)"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push -f "https://github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          echo "::notice::JAR publicado en la rama $BRANCH (sha256:$SHA)"

      # v1.28.0: RESCATE DEL JAR EXACTO DE LA v1.27.0.
      # La release v1.27.0 publico su .jar como asset y como artifact de
      # Actions, pero los CDN de assets (release-assets.githubusercontent.com)
      # y de artifacts (blob.core.windows.net) no son accesibles desde todos
      # los entornos. Se baja el artifact HISTORICO 14057282072 (el build
      # de la v1.27.0), se comprueba su SHA-256 contra el digest que publica
      # la API de la release y se deja en artifacts/v1.27.0 con su
      # SHA256SUMS.txt: asi el binario exacto de la v1.27.0 se puede
      # descargar por codeload y verificar donde el CDN no responde.
      - name: Materialize v1.27.0 jar on its artifacts branch
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publicar == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/materialize_published_jar.py \
            --version 1.27.0 --artifact 14057282072 --out /tmp/art1270
          SHA="$(cut -d' ' -f1 /tmp/art1270/SHA256SUMS.txt)"
          test -n "$SHA"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/build/libs"
          cp /tmp/art1270/capatest-1.27.0.jar "$TMP/build/libs/"
          cp /tmp/art1270/SHA256SUMS.txt "$TMP/build/libs/"
          cd "$TMP"
          git init -q -b tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "artefacto v1.27.0: capatest-1.27.0.jar (sha256:$SHA)"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push -f "https://github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/artifacts/v1.27.0"
          echo "::notice::JAR v1.27.0 publicado en artifacts/v1.27.0 (sha256:$SHA)"
