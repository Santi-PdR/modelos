      # no solo en el sandbox. Instala numpy/Pillow y falla el build si la
      # capa se aleja de la referencia del usuario.
      - name: Autoevaluacion visual contra la referencia
        run: |
          python3 -m pip install --quiet numpy Pillow
          PYTHONPATH=tools python3 tools/audit_model.py --check
          if grep -qx 'mod_version=1.56.0' gradle.properties; then
            python3 tools/verify_v1560.py
          elif grep -qx 'mod_version=1.57.0' gradle.properties; then
            python3 tools/verify_v1570.py
          elif grep -qx 'mod_version=1.58.0' gradle.properties; then
            python3 tools/verify_v1580.py
          elif grep -qx 'mod_version=1.59.0' gradle.properties; then
            python3 tools/cape_motion.py
            python3 tools/verify_v1590.py
          elif grep -qx 'mod_version=1.60.0' gradle.properties; then
            python3 tools/cape_motion.py
            python3 tools/verify_v1600.py
          elif grep -qx 'mod_version=1.61.0' gradle.properties; then
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1610.py
          elif grep -qx 'mod_version=1.62.0' gradle.properties; then
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1620.py
          elif grep -qx 'mod_version=1.63.0' gradle.properties; then
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1630.py
          elif grep -qx 'mod_version=1.64.0' gradle.properties; then
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1640.py
          elif grep -q '^mod_version=1\.67\.' gradle.properties; then
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1650.py --fit-only
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_cape_mount.py
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_cape_backing.py
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_cape_seat.py
            PYTHONPATH=tools python3 -c 'import cape_icon; cape_icon.verify()'
          else
            OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1650.py
            if grep -qx 'mod_version=1.66.0' gradle.properties; then
              OPENBLAS_NUM_THREADS=1 python3 tools/verify_v1660.py
            fi
          fi
          # v1240: el calibrador de energia es un lazo cerrado Jacobi; se
          # comprueba que siga siendo importable y que el perfil medido
          # (10 bandas) siga apuntando a la referencia del usuario.
          python3 -m py_compile tools/energy_calibration.py
          PYTHONPATH=tools python3 -c "import energy_calibration as E; t=E.target(); g=E.read_gains(); assert len(t)==10 and len(g)==12 and min(t)>0; print('OK: objetivo de energia por banda', [round(x,1) for x in t])"

      - name: Test worn-state and cosmetic profiles
        run: |
          CLASSES="$RUNNER_TEMP/cape-state-test"
          mkdir -p "$CLASSES"
          javac --release 17 -d "$CLASSES" src/main/java/com/capatest/item/{CapeState,CapePlayback,CapeSparkFrame}.java \
            src/main/java/com/capatest/client/{CapeResponse,CapeTravel,CapeFit,CapeBacking,CapePlateFit,CapeStride,CapeTint,CapeEmber,CapeNocturne,CapeWingFit,CapeWornMotion}.java \
            src/test/java/com/capatest/item/{CapeStateTest,CapeSparkFrameTest}.java \
            src/test/java/com/capatest/client/{CapeFitTest,CapeRuntimeTest,CapeEmberTest,CapeNocturneTest,CapeSettleTest,CapeSwayTest,CapeWingFitTest,CapeWornMotionTest}.java
          java -cp "$CLASSES" com.capatest.client.CapeWornMotionTest
          java -cp "$CLASSES" com.capatest.client.CapeWingFitTest
          java -cp "$CLASSES" com.capatest.client.CapeWingFitTest --samples > "$CLASSES/wings.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/verify_cape_wings.py "$CLASSES/wings.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeSwayTest
          java -cp "$CLASSES" com.capatest.client.CapeSwayTest --samples > "$CLASSES/sway.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/verify_cape_sway.py "$CLASSES/sway.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeNocturneTest
          java -cp "$CLASSES" com.capatest.client.CapeNocturneTest --samples > "$CLASSES/nocturne.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/verify_v1670.py --nocturne-samples "$CLASSES/nocturne.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeSettleTest
          java -cp "$CLASSES" com.capatest.client.CapeSettleTest --samples > "$CLASSES/settle.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/verify_cape_settle.py "$CLASSES/settle.tsv"
          java -cp "$CLASSES" com.capatest.item.CapeSparkFrameTest
          java -cp "$CLASSES" com.capatest.item.CapeSparkFrameTest --samples > "$CLASSES/spark-frames.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/verify_cape_spark_fit.py "$CLASSES/spark-frames.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeEmberTest
          java -cp "$CLASSES" com.capatest.client.CapeEmberTest --samples > "$CLASSES/embers.tsv"
          java -cp "$CLASSES" com.capatest.item.CapeStateTest
          java -cp "$CLASSES" com.capatest.client.CapeFitTest
          java -cp "$CLASSES" com.capatest.client.CapeRuntimeTest
          java -cp "$CLASSES" com.capatest.client.CapeRuntimeTest --stride-samples > "$CLASSES/stride.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/verify_v1660.py --parity-only --java-samples "$CLASSES/stride.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeFitTest --samples > "$CLASSES/fit.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeFitTest --shoulders > "$CLASSES/shoulders.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeFitTest --backing > "$CLASSES/backing.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeFitTest --seating > "$CLASSES/seating.tsv"
          java -cp "$CLASSES" com.capatest.client.CapeFitTest --plates > "$CLASSES/plates.tsv"
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=tools python3 tools/check_cape_fit.py "$CLASSES/fit.tsv" "$CLASSES/shoulders.tsv" "$CLASSES/backing.tsv" "$CLASSES/seating.tsv" "$CLASSES/plates.tsv"
          java -cp "$CLASSES" com.capatest.item.CapeStateTest --spark-samples > "$CLASSES/sparks.tsv"
          PYTHONPATH=tools python3 -c 'import cape_aura as a,json; print(json.dumps(a.profile()))' | \
            node tools/check_viewer_embers.js "$CLASSES/sparks.tsv" "$CLASSES/embers.tsv"

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # v1.27.1: EL JAR TIENE QUE SER REPRODUCIBLE. Sin esto, dos builds
      # del mismo codigo dan .jar distintos (el ZIP guarda timestamps) y el
      # SHA-256 publicado cambia en cada republicacion, con lo que no
      # sirve para verificar nada. Se reconstruye el .jar y se compara.
      #
      # Sólo se adjunta al borrador un .jar ya verificado como reproducible.
      - name: Verify jar is reproducible
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/capatest-$VER.jar"
          test -f "$JAR"
          SHA1="$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "sha256 del primer build : $SHA1"
          # Se borra SOLO el .jar y se vuelve a empaquetar: las clases ya
          # compiladas se reutilizan, asi que el segundo build es rapido.
          rm -f "$JAR"
          gradle jar reobfJar --no-daemon --console=plain 2>&1 | tail -5
          test -f "$JAR"
          SHA2="$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "sha256 del segundo build: $SHA2"
          if [ "$SHA1" != "$SHA2" ]; then
            echo "::error::el .jar NO es reproducible ($SHA1 != $SHA2)"
            exit 1
          fi
          echo "OK: el .jar es byte-identico entre builds (sha256:$SHA1)"

      # Los logs de Actions viven en un host que el sandbox no puede leer;
      # publicamos los errores de javac como anotaciones del run.
      - name: Surface compiler errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E '(error:|FAILURE:|What went wrong|^> |Caused by:|Could not resolve|Execution failed)' /tmp/gradle-build.log | head -80 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: List built jars
        run: ls -lh build/libs

      - name: Verify jar contents (model resources)
        run: |
          set -euo pipefail
          found=0
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            found=1
            echo "== $jar =="
            jar tf "$jar" > /tmp/jar-contents.txt
            grep -qx 'META-INF/mods.toml' /tmp/jar-contents.txt
            grep -qx 'com/capatest/CapaTestMod.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaSparkParticle.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapeSparkFrame.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapeSparkPath.class' /tmp/jar-contents.txt
            if grep -Eq '^(com/capatest/client/(CapeFxSmoke|CapeWalkProbe|CapeLookSweep|CapePlateProbe)|assets/capatest/geo/test/)' /tmp/jar-contents.txt; then
              echo '::error::El JAR de distribución incluye código de la prueba de cliente.'
              exit 1
            fi
            grep -qx 'com/capatest/client/CapaItemRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaItemGlowLayer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorModel.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeWornMotion.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeWornClips.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeResponse.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeTravel.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeWingFit.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeFit.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeBacking.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeStride.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeTint.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeBloom.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeNocturne.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapeEmber.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapePlayback.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaArmorRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapaDeteriorerItem.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/item/CapeState.class' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/armor/capa_deteriorer_evilsaiyan.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/armor/capa_deteriorer_evilsaiyan.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/armor/capa_deteriorer_evilsaiyan_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/capa_deteriorer_evilsaiyan.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/geo/item/cape_folded.geo.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/animations/item/cape_folded.animation.json' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/textures/item/cape_folded_glowmask.png' /tmp/jar-contents.txt
            grep -qx 'assets/capatest/particles/capa_spark.json' /tmp/jar-contents.txt
            for i in 0 1 2; do
              grep -qx "assets/capatest/textures/particle/capa_spark_${i}.png" /tmp/jar-contents.txt
            done
            # Comprueba el contenido, no sólo el nombre: el JAR debe usar
            # el mismo atlas equipado que validaron los renders y el .bbmodel.
            for asset in \
              textures/item/armor/capa_deteriorer_evilsaiyan{,_glowmask,_halo}.png \
              shaders/core/cape_bloom.{json,vsh,fsh} \
              textures/item/capa_deteriorer_evilsaiyan.png{,.mcmeta} \
              textures/item/cape_folded{,_glowmask}.png \
              textures/particle/capa_spark_{0,1,2}.png particles/capa_spark.json \
              geo/item/cape_folded.geo.json animations/item/cape_folded.animation.json \
              geo/item/armor/capa_deteriorer_evilsaiyan.geo.json \
              animations/item/armor/capa_deteriorer_evilsaiyan.animation.json; do
              asset="assets/capatest/$asset"
              unzip -p "$jar" "$asset" | cmp - "src/main/resources/$asset"
            done
            for locale in src/main/resources/assets/capatest/lang/*.json; do
              unzip -p "$jar" "${locale#src/main/resources/}" | cmp - "$locale"
            done
            echo "OK: atlas equipado, glowmask, icono, geometría, clips y traducciones byte a byte dentro del jar"
            grep -qx 'data/curios/tags/items/back.json' /tmp/jar-contents.txt
            grep -qx 'data/capatest/curios/entities/player.json' /tmp/jar-contents.txt
            grep -qx 'com/capatest/client/CapaCurioRenderer.class' /tmp/jar-contents.txt
            grep -qx 'com/capatest/compat/CuriosCompat.class' /tmp/jar-contents.txt
            # El artefacto publicado DEBE llevar el geo sin JsonNull.
            unzip -p "$jar" assets/capatest/geo/item/cape_folded.geo.json > /tmp/folded-geo.json
            python3 -c 'import json; b=json.load(open("/tmp/folded-geo.json"))["minecraft:geometry"][0]["bones"]; n={x["name"] for x in b}; assert b[0]["name"]=="cape" and "parent" not in b[0]; assert all(x.get("parent","cape") in n for x in b); print("OK: geo plegado dentro del jar sin parent:null")'
            unzip -p "$jar" assets/capatest/textures/item/cape_folded_glowmask.png > /tmp/folded-glow.png
            python3 -c 'import struct; d=open("/tmp/folded-glow.png","rb").read(); assert struct.unpack(">II", d[16:24]) == (128, 128); print("OK: glowmask del item 128x128 dentro del jar")'
            unzip -p "$jar" assets/capatest/animations/item/cape_folded.animation.json > /tmp/folded-anim.json
            python3 -c 'import json; a=json.load(open("/tmp/folded-anim.json"))["animations"]; assert len(a)==5 and "animation.item" in a; print("OK: 5 animaciones con animation.item dentro del jar")'
            echo "OK: clases, mods.toml, 3D item, animation.item, atlas limpio + glowmask, chispa exclusiva y datos Curios presentes"
          done
          test "$found" -eq 1

      - name: Prepare artifact hash
        run: |
          cd build/libs
          VER="$(sed -n 's/^mod_version=//p' ../../gradle.properties | tr -d '[:space:]')"
          sha256sum "capatest-$VER.jar" > SHA256SUMS.txt
          printf '::notice title=SHA-256 del JAR Forge verificado::%s\n' "$(cat SHA256SUMS.txt)"

      - name: Upload verified jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capatest-jar
          path: |
            build/libs/capatest-*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Cliente real en mundo desechable. Se prueba aparte del JAR:
      # el código de diagnóstico y Curios nunca se empaquetan en él.
      - name: Probar FX y equipo en Forge (opcional)
        id: fx-smoke
        if: >-
          (github.event_name == 'push' && (contains(github.event.head_commit.message, '[probar-halo]') ||
          contains(github.event.head_commit.message, '[publicar]'))) ||
          (github.event_name == 'workflow_dispatch' && (inputs.probar_halo == true || inputs.publicar == true))
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          log="$RUNNER_TEMP/forge-client.log"
          rc=0
          timeout --kill-after=12s 300s xvfb-run -a gradle -PcapeFxSmoke --no-daemon --console=plain runClient > "$log" 2>&1 || rc=$?
          awk 'sub(/.*FX smoke: /, "")' "$log" | tail -n 5 | while IFS= read -r line; do
            printf '::notice title=FX en Forge::%s\n' "$line"
          done
          awk 'sub(/.*FX smoke: Recorrido de mirada /, "")' "$log" | while IFS= read -r line; do
            printf '::notice title=Recorrido de mirada en Forge::%s\n' "${line//%/%25}"
          done
          if [ "$rc" -ne 0 ] || ! grep -Fq 'FX smoke: PASS:' "$log" ||
             grep -Fq -e 'FX smoke: FAIL' -e 'Blight Star Mantle: respuesta del paño desactivada' -e 'se usa el muestreador de GeckoLib' "$log" ||
             [ "$(grep -Fc 'Blight Star Mantle: falló el pase' "$log")" -ne 2 ]; then
            echo "::error title=FX en Forge::No se completó la prueba (salida $rc)."
            grep -Ei 'exception|assertionerror|\[.*ERROR\]|(failed|could not|error):? |^> Task .*FAILED|Blight Star Mantle:' "$log" | \
              grep -Eiv 'token|password|session|https?://|intentional FX smoke' | tail -n 8 | cut -c1-340 | \
              while IFS= read -r line; do printf '::warning title=Diagnóstico de cliente::%s\n' "${line//%/%25}"; done
            exit 1
          fi

      - name: Comparar v1.67.11 y las nuevas hombreras en F5 cenital
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_plates.py build/fx-smoke-run/fx-shots --gallery

      - name: Medir el borde de las placas contra las mangas en F5
        if: steps.fx-smoke.outcome == 'success'
        run: |
          set -o pipefail
          python3 tools/verify_forge_plates.py build/fx-smoke-run/fx-shots 2>&1 | while IFS= read -r line; do
            case "$line" in
              'A 89,5°,'*) printf '::notice title=Manga y placa en Forge::%s\n' "$line" ;;
              'AssertionError:'*) printf '::error title=Diagnóstico de hombreras::%s\n' "$line" ;;
              *) printf '%s\n' "$line" ;;
            esac
          done

      - name: Medir ciclos y transiciones reales al caminar en F5
        if: ${{ !cancelled() && steps.fx-smoke.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 tools/verify_forge_walk.py build/fx-smoke-run/fx-shots | while IFS= read -r line; do
            printf '::notice title=Marcha en Forge::%s\n' "${line//%/%25}"
          done

      - name: Verificar el desplazamiento visible del cuello y las dos hombreras en F5
        if: ${{ !cancelled() && steps.fx-smoke.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 tools/verify_forge_seat.py build/fx-smoke-run/fx-shots | while IFS= read -r line; do
            if [[ "$line" == '::error '* ]]; then
              printf '%s\n' "$line"
            else
              printf '::notice title=Ajuste visible en Forge::%s\n' "${line//%/%25}"
            fi
          done

      - name: Verificar la unión y el icono en el framebuffer de Forge
        if: ${{ !cancelled() && steps.fx-smoke.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots | while IFS= read -r line; do
            if [[ "$line" == '::error '* ]]; then
              printf '%s\n' "$line"
            else
              printf '::notice title=Anclaje y ranura en Forge::%s\n' "${line//%/%25}"
            fi
          done

      - name: Comparar el canto de la camiseta en F5 cenital
        if: always() && steps.fx-smoke.outcome == 'success'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery union-cenital

      - name: Comparar el canto de la camiseta en F5 oblicuo
        if: always() && steps.fx-smoke.outcome == 'success'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery union-oblicua

      - name: Comparar el canto de la camiseta a media inclinación
        if: always() && steps.fx-smoke.outcome == 'success'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery union-ajuste-medio

      - name: Fotogramas de marcha en pecho
        if: always() && steps.fx-smoke.outcome == 'success'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery paso-pecho

      - name: Fotogramas de marcha en Curios
        if: always() && steps.fx-smoke.outcome == 'success'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery paso-curios

      - name: Vista F5 de inclinación media, v1.67.9 frente a ajuste nuevo
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery ajuste-medio

      - name: Fotogramas del giro y la inclinación en pecho
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery mirada-pecho

      - name: Fotogramas del giro y la inclinación en Curios
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery mirada-curios

      - name: Recorte comparativo F5 del ajuste de cuello y hombreras
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery ajuste

      - name: Recorte F5 con mangas finas
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery ajuste-fino

      - name: Recorte en ángulo oblicuo
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery oblicua

      - name: Recorte lateral de la unión al torso
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: python3 tools/verify_forge_mount.py build/fx-smoke-run/fx-shots --gallery perfil

      - name: Recorte del ciclo de la hotbar
        if: always() && steps.fx-smoke.outcome != 'skipped'
        run: |
          shots=build/fx-smoke-run/fx-shots
          if [ -f "$shots/hotbar-31.png" ]; then
            python3 tools/verify_forge_mount.py "$shots" --gallery hotbar
          fi

      - name: Subir capturas de la prueba en mundo
        if: always() && steps.fx-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: capatest-fx-en-mundo
          path: |
            build/fx-smoke-run/fx-shots/*.png
            build/fx-smoke-run/fx-shots/*.tsv
            build/fx-smoke-run/fx-shots/hotbar-ciclo.gif
          if-no-files-found: error
          retention-days: 30

      # [publicar] prepara una release verificable sin escribir a otras
      # ramas. Hacerla pública sólo después de que el run esté en SUCCESS.
      - name: Stage verified release (draft)
        if: >-
          steps.fx-smoke.outcome == 'success' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publicar == true))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          test -n "$VER"
          TAG="v$VER"
          JAR="build/libs/capatest-$VER.jar"
          test -f "$JAR"
          NOTES="$RUNNER_TEMP/release-notes.md"
          BBF="docs/CAPA_v$VER.bbmodel"
          BB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/CAPA_v$VER.bbmodel"
          COMPARISON="docs/capa_v${VER//./}_antes_despues.png"
          REGISTER="docs/capa_v${VER//./}_registro.png"
          cat > "$NOTES" <<'MD'
          ## Mantle of the Blight Star __TAG__ — build más reciente

          JAR compilado en CI (JDK 17 + Gradle 8.8, Forge 1.20.1-47.3.0).
          Las versiones anteriores quedan como histórico y no se sobrescriben.

          **Link directo del .bbmodel (VERSIONADO)**: __BBURL__
          El archivo se llama `CAPA_v__VER__.bbmodel` y su `name`
          interno en Blockbench incluye la versión.

          ### Qué incluye

          - **Silueta equipada**: cuello granate alto, costura en U,
            hombreras de carbón y doce jirones a alturas escalonadas.
            Comparativa registrada con la misma cámara que la imagen original.
          - **Sujeción**: la base se apoya en el torso y el fuelle sigue unido
            al cuello y las placas. Pecho y Curios:back comparten el ajuste;
            el pecho tiene prioridad si hay dos capas equipadas.
          - **Ocho clips**: las piezas rígidas no se hinchan ni bailan. El
            paño se flexiona desde las raíces cosidas hacia las puntas.
            Atlas, grietas emisivas, plegado y chispas conservados.
          - **Inventario**: pixel art de la referencia con un pulso rosa en
            las grietas, sin glint forzado. «✦ La noche arde en sus costuras.»
            en español, con traducción a inglés. ID, slot y atributos no cambian.

          ### Descargas de esta Release

          | Archivo | Para qué |
          |---|---|
          | `capatest-__VER__.jar` | El mod compilado |
          | `CAPA_v__VER__.bbmodel` | Proyecto editable de Blockbench (VERSIONADO) |
          | `capa_v1170_visor.html` | Visor 3D offline |
          | `capa_v1170_preview.png` | 6 vistas del render software |
          | `capa_v1170_comparativa.png` | Referencia frente al modelo |
          | `capa_v1170_estados.png` | 8 poses con la misma cámara |
          | `capa_v1170_animaciones.gif` | 4 ciclos sincronizados por fase |
          MD
          if [ -f "$COMPARISON" ]; then
            printf '| `%s` | Antes/después del modelo equipado con la misma cámara |\n' \
              "$(basename "$COMPARISON")" >> "$NOTES"
          fi
          if [ -f "$REGISTER" ]; then
            printf '| `%s` | Diferencias de la silueta respecto de la referencia |\n' "$(basename "$REGISTER")" >> "$NOTES"
          fi
          printf '\nLos previews de esta tabla son renders software; las pruebas en Forge se informan por separado en Actions.\n' >> "$NOTES"
          sed -i "s/__TAG__/$TAG/g; s/__VER__/$VER/g; s|__BBURL__|$BB_URL|g" "$NOTES"
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json"; then
            # Reintentos del mismo SHA sí; nunca escribir sobre lo publicado.
            jq -e --arg commit "$GITHUB_SHA" \
              '.isDraft and .targetCommitish == $commit' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --draft \
              --title "Mantle of the Blight Star $TAG" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi

          SUMS="$RUNNER_TEMP/SHA256SUMS.txt"
          for ASSET in "$JAR" "$BBF"; do
            printf '%s  %s\n' "$(sha256sum "$ASSET" | cut -d' ' -f1)" "$(basename "$ASSET")"
          done > "$SUMS"
          ASSETS=("$JAR" "$BBF" "$SUMS" docs/capa_v1170_visor.html
                  docs/capa_v1170_preview.png docs/capa_v1170_comparativa.png
                  docs/capa_v1170_estados.png docs/capa_v1170_animaciones.gif docs/capa_v1170_icon_compare.png)
          if [ -f "$COMPARISON" ]; then ASSETS+=("$COMPARISON"); fi
          if [ -f "$REGISTER" ]; then ASSETS+=("$REGISTER"); fi
          for EVIDENCE in "docs/capa_v${VER//./}_"{hombros_forge.png,espalda_forge.png,inclinacion_forge.png,hotbar.gif}; do
            if [ -f "$EVIDENCE" ]; then ASSETS+=("$EVIDENCE"); fi
          done
          for view in detalles luz ajuste; do
            IMAGE="docs/capa_v${VER//./}_$view.png"
            if [ -f "$IMAGE" ]; then ASSETS+=("$IMAGE"); fi
          done
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

          # Un borrador aún no tiene tag disponible para consultas anónimas.
          DRAFT_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft and .tag_name == "'"$TAG"'" and .target_commitish == "'"$GITHUB_SHA"'") | .id')"
          test -n "$DRAFT_ID"
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID/assets" > "$RUNNER_TEMP/assets.json"
          for ASSET in "${ASSETS[@]}"; do
            LOCAL_SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
            API_DIGEST="$(jq -er --arg name "$(basename "$ASSET")" \
              '.[] | select(.name == $name and .state == "uploaded").digest' "$RUNNER_TEMP/assets.json")"
            if [ "sha256:$LOCAL_SHA" != "$API_DIGEST" ]; then
              echo "::error::Digest distinto del compilado: $ASSET ($API_DIGEST)"
              exit 1
            fi
          done
          echo "### Borrador $TAG verificado (publicar después de CI SUCCESS)" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMS" >> "$GITHUB_STEP_SUMMARY"
