name: Study Ultimate Battle reference
on:
  push:
    branches: ['arena/a09d390b-modelos']
permissions:
  contents: write
jobs:
  reference:
    if: ${{ contains(github.event.head_commit.message, '[study-ultimate-battle]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download only for local inspection
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://www.cursemaven.com/curse/maven/ultimate-battle-1761123/9385647/ultimate-battle-1761123-9385647.jar' -o /tmp/ultimate-battle.jar
          python3 katana_stain/tools/estudiar_ultimate_battle.py /tmp/ultimate-battle.jar
      - name: Save metadata summary, not the mod or its effects
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add katana_stain/referencias/ultimate_battle_auditoria.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Document Ultimate Battle reference inspection'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
