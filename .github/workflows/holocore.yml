                          'RelicSounds.sleep(this.wearer)'):
              assert llamada in animatable, f'el sonido no esta conectado: {llamada}'
          assert 'KeyMapping MOOD' in teclas, 'falta la tecla de los estados de brillo'
          assert 'event.register(RelicKeys.MOOD)' in eventos, 'la tecla M no se registra'
          assert 'RelicKeys.MOOD.consumeClick()' in eventos, 'la tecla M no se consume'
          assert 'displayClientMessage(aviso, true)' in eventos, \
              'el aviso de la tecla M no va a la barra de accion'
          assert 'event.register(RelicKeys.PULSE)' in eventos, 'la tecla del pulso no se registra'
          assert 'RelicKeys.PULSE.consumeClick()' in eventos, 'la tecla del pulso no se consume'
          for idioma in ('en_us', 'es_es'):
              lang = json.loads(pathlib.Path(
