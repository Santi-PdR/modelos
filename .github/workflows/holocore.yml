name: Build Holographic Core (Forge 1.20.1)

on:
  push:
    paths:
      - 'relic-hologram/**'
      - '.github/workflows/holocore.yml'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el .jar como Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Gradle 8.8 / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # ------------------------------------------------------------------
      # Los assets del modelo NO se tocan: se compara su SHA-256 con el zip
      # entregado (reliquia_holografica_para_mod_v19.zip, en la raiz).
      # ------------------------------------------------------------------
      - name: Validate assets unchanged
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile

          archive = pathlib.Path('reliquia_holografica_para_mod_v19.zip')
          base = pathlib.Path('relic-hologram/src/main/resources/assets/holocore')
          pairs = {
              'reliquia_holografica/export/geo/relic_hologram_centered.geo.json':
                  'geo/relic_hologram_centered.geo.json',
              'reliquia_holografica/export/geo/relic_hologram_lite_centered.geo.json':
                  'geo/relic_hologram_lite_centered.geo.json',
              'reliquia_holografica/export/animations/relic_hologram.animation.json':
                  'animations/relic_hologram.animation.json',
              'reliquia_holografica/export/animations/relic_hologram.animation.linear.json':
                  'animations/relic_hologram.animation.linear.json',
              'reliquia_holografica/textures/relic_hologram.png':
                  'textures/relic/relic_hologram.png',
              'reliquia_holografica/textures/relic_hologram_glowing.png':
                  'textures/relic/relic_hologram_glowing.png',
          }
          with zipfile.ZipFile(archive) as z:
              for source, target in pairs.items():
                  expected = hashlib.sha256(z.read(source)).hexdigest()
                  actual = hashlib.sha256((base / target).read_bytes()).hexdigest()
                  assert expected == actual, f'ASSET MODIFICADO: {target}'
                  print(f'OK sin cambios: {target} ({actual[:12]}...)')
          PY

      # ------------------------------------------------------------------
      # JSON validos, sin nulls (GeckoLib 4.8 deserializa `parent` con
      # getAsString y un JsonNull lanza UnsupportedOperationException), las 20
      # animaciones presentes, capas solo sobre relic_react y geo coherente.
      # ------------------------------------------------------------------
      - name: Validate resources
        run: |
          python3 - <<'PY'
          import json, pathlib, struct

          res = pathlib.Path('relic-hologram/src/main/resources')
          for path in list(res.rglob('*.json')) + [res / 'pack.mcmeta']:
              json.loads(path.read_text(encoding='utf-8'))

          def nulls(value, where=''):
              if value is None:
                  yield where
              elif isinstance(value, dict):
                  for key, item in value.items():
                      yield from nulls(item, where + '/' + key)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from nulls(item, where + '/' + str(index))

          for path in list(res.rglob('*.json')) + [res / 'pack.mcmeta']:
              offenders = list(nulls(json.loads(path.read_text(encoding='utf-8'))))
              assert not offenders, (path, offenders[:5])

          base = res / 'assets/holocore'
          anims = json.loads((base / 'animations/relic_hologram.animation.json').read_text())
          manifest = json.loads(pathlib.Path('relic-hologram/tools/relic_manifest.json').read_text())

          names = {a['name'] for a in manifest['animations']}
          assert len(names) == 20, len(names)
          assert names <= set(anims['animations']), names - set(anims['animations'])
          loom = json.loads((base / 'animations/relic_hologram.animation.linear.json').read_text())
          assert set(anims['animations']) == set(loom['animations'])

          geo = json.loads((base / 'geo/relic_hologram_centered.geo.json').read_text())
          lite = json.loads((base / 'geo/relic_hologram_lite_centered.geo.json').read_text())
          full_desc = geo['minecraft:geometry'][0]['description']
          lite_desc = lite['minecraft:geometry'][0]['description']
          assert full_desc['identifier'] == 'geometry.relic_hologram_centered'
          assert lite_desc['identifier'] == 'geometry.relic_hologram_lite_centered'

          for doc in (geo, lite):
              for bone in doc['minecraft:geometry'][0]['bones']:
                  assert bone.get('name'), 'hueso sin nombre'
                  assert len(bone.get('pivot', [])) == 3, bone['name']
                  for cube in bone.get('cubes', []):
                      assert len(cube['origin']) == 3 and len(cube['size']) == 3, bone['name']
                      assert 'uv' in cube or 'uv' in bone, bone['name']
              assert doc['minecraft:geometry'][0]['description']['texture_width'] == 64
              assert doc['minecraft:geometry'][0]['description']['texture_height'] == 96

          full_bones = {b['name'] for b in geo['minecraft:geometry'][0]['bones']}
          lite_bones = {b['name'] for b in lite['minecraft:geometry'][0]['bones']}
          assert full_bones == lite_bones, full_bones ^ lite_bones
          assert {'relic_react', 'relic_root', 'core', 'ring_spin_1', 'flash'} <= full_bones

          for layer in ('animation.relic.layer_hit', 'animation.relic.layer_bump',
                        'animation.relic.layer_shake'):
              assert list(anims['animations'][layer]['bones']) == ['relic_react'], layer

          for texture in (base / 'textures/relic/relic_hologram.png',
                          base / 'textures/relic/relic_hologram_glowing.png'):
              width, height = struct.unpack('>II', texture.read_bytes()[16:24])
              assert (width, height) == (64, 96), (texture, width, height)
          icon = base / 'textures/item/holographic_core.png'
          assert struct.unpack('>II', icon.read_bytes()[16:24]) == (16, 16)
          print('Recursos OK: 20 animaciones, 98 huesos, 977/751 cubos, texturas 64x96.')
          PY

      # ------------------------------------------------------------------
      # Deriva silenciosa de documentacion: cada clave de la config tiene que
      # estar en la tabla del README, y la textura del aura tiene que tener el
      # tamano que espera el codigo.
      # ------------------------------------------------------------------
      - name: Validate docs and config coherence
        run: |
          python3 - <<'PY'
          import pathlib, re, struct

          root = pathlib.Path('relic-hologram')
          source = (root / 'src/main/java/com/santipdr/holocore/config/RelicConfig.java').read_text()
          readme = (root / 'README.md').read_text()

          keys, section = [], ''
          for line in source.splitlines():
              push = re.search(r'\.push\("([A-Za-z]+)"\)', line)
              if push:
                  section = push.group(1)
              if re.search(r'\.pop\(\)', line):
                  section = ''
              define = re.search(r'\.define(?:Enum|InRange)?\("([A-Za-z0-9_]+)"', line)
              if define:
                  name = define.group(1)
                  keys.append(f'{section}.{name}' if section else name)

          assert keys, 'no se encontro ninguna clave en RelicConfig'
          # Vale tanto `seccion.clave` como la clave suelta: la tabla del README
          # agrupa las dos claves de glitch en una sola fila.
          missing = [k for k in keys
                     if f'`{k}`' not in readme and f'`{k.split(".")[-1]}`' not in readme]
          assert not missing, f'claves de config sin documentar en README.md: {missing}'

          for name in ('relic_aura.png', 'relic_ring.png'):
              data = (root / 'src/main/resources/assets/holocore/textures/relic' / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name} no es un PNG'
              width, height, depth, color_type = (*struct.unpack('>II', data[16:24]), data[24], data[25])
              assert (width, height, depth, color_type) == (64, 64, 8, 6), (name, width, height, depth, color_type)

          # Dos secciones "## Brillo y shaders" convivieron hasta 1.0.16: la segunda
          # era la de antes de 1.0.12 y seguia diciendo "dos pases" y "~11 700
          # quads". Un encabezado repetido es la senal mas barata de ese desague.
          secciones = re.findall(r'^## (.+)$', readme, re.M)
          repetidas = sorted({x for x in secciones if secciones.count(x) > 1})
          assert not repetidas, f'README.md con secciones repetidas: {repetidas}'

          print(f'Docs OK: {len(keys)} claves de config documentadas; aura y anillo 64x64 RGBA;'
                f' {len(secciones)} secciones de README sin repetir.')
          PY

      # ------------------------------------------------------------------
      # Shader propio: ficheros en assets/minecraft/shaders/core (ahi los busca
      # ShaderInstance) y coherencia del JSON con el formato de vertice.
      # ------------------------------------------------------------------
      - name: Validate shader resources
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          base = pathlib.Path('relic-hologram/src/main/resources/assets/minecraft/shaders/core')
          for ext in ('.json', '.vsh', '.fsh'):
              assert (base / f'holocore_relic_glow{ext}').is_file(), f'falta holocore_relic_glow{ext}'

          doc = json.loads((base / 'holocore_relic_glow.json').read_text())
          assert doc['vertex'] == 'holocore_relic_glow', doc['vertex']
          assert doc['fragment'] == 'holocore_relic_glow', doc['fragment']
          blend = doc['blend']
          assert (blend['func'], blend['srcrgb'], blend['dstrgb']) == ('add', 'srcalpha', 'one'), blend

          uniforms = {u['name']: u for u in doc['uniforms']}
          for name in ('ModelViewMat', 'ProjMat', 'ColorModulator', 'HoloTime', 'HoloGlitch', 'HoloTint'):
              assert name in uniforms, name
          for uniform in uniforms.values():
              assert len(uniform['values']) == uniform['count'], uniform['name']

          feed = {'Position', 'Color', 'UV0', 'UV1', 'UV2', 'Normal'}
          assert set(doc['attributes']) <= feed, set(doc['attributes']) - feed
          assert [s['name'] for s in doc['samplers']] == ['Sampler0'], doc['samplers']

          for src in ('holocore_relic_glow.vsh', 'holocore_relic_glow.fsh'):
              text = (base / src).read_text()
              assert text.lstrip().startswith('#version 150'), src
              assert 'void main()' in text, src
          # UV2 es ivec2 en las shaders de entidad: declararlo vec2 rompe el enlace.
          vsh = (base / 'holocore_relic_glow.vsh').read_text()
          fsh = (base / 'holocore_relic_glow.fsh').read_text()
          assert 'in vec2 UV2' not in vsh
          # El barrido y la rejilla van en espacio de vista: con UV0 salian cuatro
          # bandas por cara en vez de una que recorre la reliquia (1.0.28).
          assert 'out float viewY' in vsh and 'viewY = viewPos.y' in vsh, \
              'el vertex shader no pasa la altura en espacio de vista'
          assert 'viewY * 0.9' in fsh, 'el barrido no usa el espacio de vista'
          # Dos bordes por multiplicacion en vez de dos pow: mas barato y mas limpio.
          assert 'rimTight' in fsh and 'pow(' not in fsh, \
              'el fragment shader volvio a usar pow para los dos bordes'
          # El glitch se paga solo cuando hay evento: rama sobre el uniform.
          assert 'HoloGlitch > 0.01' in fsh, 'el glitch del shader no esta condicionado'
          assert 'HoloTint.rgb' in fsh, 'el tinte por estado no llega al borde del shader'
          # 1.0.41: el barrido ancho se leia como el anillo de un planeta. Ahora es
          # una linea fina con halo, pesada por texAlpha (solo sobre el cuerpo).
          assert 'smoothstep(0.40, 0.62' not in fsh, 'volvio la banda ancha del barrido'
          assert 'readLine' in fsh and 'readHalo' in fsh, 'falta la linea de lectura'
          assert 'float readNear = min(readPos, 1.0 - readPos);' in fsh, \
              'la linea de lectura no esta centrada en su fase'
          assert '(readLine * 0.05 + readHalo * 0.03) * texAlpha' in fsh, \
              'la linea no se pesa por texAlpha: vuelve a dibujar un aro en la silueta'
          # Alpha una sola vez: el blend es (srcalpha, one) y el rgb se premultiplicaba.
          assert 'fragColor = vec4(rgb * ColorModulator.rgb, alpha);' in fsh, \
              'el rgb vuelve a premultiplicarse: alpha^2 y borde debil'
          # Dither solo de suma: la mitad negativa la recortaba el framebuffer.
          assert '(hash(texCoord * 613.0) - 0.5)' not in fsh, 'el dither vuelve a restar luz'
          assert 'hash(texCoord * 613.0) * 0.015' in fsh, 'falta el dither de suma'

          # El apendice A del documento tiene que ser copia literal de estos
          # ficheros: es la unica forma de que el GLSL explicado no se quede
          # atras cuando se toca el de verdad (paso en 1.0.7).
          md = pathlib.Path('relic-hologram/docs/BRILLO-Y-SHADERS.md').read_text(encoding='utf-8')
          appendix = md[md.index('## Apéndice A'):]
          blocks = re.findall(r'```(json|glsl)\n(.*?)```', appendix, re.S)
          assert [lang for lang, _ in blocks[:3]] == ['json', 'glsl', 'glsl'], [b[0] for b in blocks]
          assert json.loads(blocks[0][1]) == doc, 'el JSON del apendice no coincide: corre python3 tools/sync_shader_doc.py'
          for (_, text), name in zip(blocks[1:3], ('holocore_relic_glow.vsh', 'holocore_relic_glow.fsh')):
              esperado = (base / name).read_text(encoding='utf-8').strip('\n')
              assert text.strip('\n') == esperado, f'el bloque GLSL de {name} no coincide: corre python3 tools/sync_shader_doc.py'
          print('Shader OK: aditivo, uniforms, atributos y apendice sincronizado.')
          PY

      # El aura es aditiva y sobre nieve se quemaba a blanco. Este paso compone
      # las dos pasadas con los numeros del codigo y falla si se blanquea.
      - name: Validate aura math
        working-directory: relic-hologram
        run: python3 tools/check_aura_math.py

      # Un texto nuevo en un idioma y no en el otro sale como clave cruda en el
      # chat. Es barato comprobarlo aqui.
      - name: Validate lang parity
        run: |
          python3 - <<'PY'
          import json, pathlib

          base = pathlib.Path('relic-hologram/src/main/resources/assets/holocore/lang')
          idiomas = {p.stem: json.loads(p.read_text(encoding='utf-8')) for p in base.glob('*.json')}
          assert 'en_us' in idiomas, sorted(idiomas)
          referencia = set(idiomas['en_us'])
          for nombre, claves in idiomas.items():
              faltan = referencia - set(claves)
              sobran = set(claves) - referencia
              assert not faltan, f'{nombre} sin traducir: {sorted(faltan)[:5]}'
              assert not sobran, f'{nombre} con claves que en_us no tiene: {sorted(sobran)[:5]}'
          print(f'Idiomas OK: {sorted(idiomas)} con {len(referencia)} claves cada uno.')
          PY

      # String.format sin Locale coge el idioma del sistema: con el juego en
      # espanol, "%.2f" da 6,00 y esos numeros se copian al toml, donde la coma
      # rompe el valor. Ya paso en /relic info hasta 1.0.24.
      - name: Validate number formatting and reset
        run: |
          python3 - <<'PY'
          import pathlib, re

          malas, total = [], 0
          for ruta in sorted(pathlib.Path('relic-hologram/src/main/java').rglob('*.java')):
              for numero, linea in enumerate(ruta.read_text(encoding='utf-8').splitlines(), 1):
                  if 'String.format(' not in linea:
                      continue
                  total += 1
                  if 'Locale.' not in linea:
                      malas.append(f'{ruta}:{numero}')
          assert not malas, (
              'String.format sin Locale explicito (en espanol daria "6,00"): ' + ', '.join(malas))

          comandos = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java'
          ).read_text(encoding='utf-8')
          assert 'String.format(Locale.ROOT, "%.2f", RelicConfig.OFFSET_X.get())' in comandos, (
              'la primera linea de /relic info vuelve a usar el locale del sistema')
          # El aviso "sin guardar" tiene que ir dentro del if: si vuelve a marcarse
          # siempre, /relic reset deja 24 cambios fantasma.
          assert re.search(r'if \(tweak\.restoreDefault\(\)\) \{\s*'
                           r'markUnsaved\(tweak\.key\(\)\);\s*cambios\+\+;', comandos), (
              '/relic reset cuenta y marca como sin guardar claves que no cambian')
          print(f'Formato OK: {total} String.format, todos con Locale explicito;'
                ' /relic info con punto decimal y /relic reset contando solo cambios reales.')
          PY

      # /relic reset <clave> es el deshacer de un ajuste suelto, y el asterisco de
      # /relic set es la unica forma de saber que claves se van a perder al cerrar.
      # Las dos cosas son faciles de perder en un refactor, asi que se comprueban.
      - name: Validate reset variants and unsaved marks
        run: |
          python3 - <<'PY'
          import pathlib

          comandos = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java'
          ).read_text(encoding='utf-8')

          assert 'private static int resetOne(' in comandos, (
              'falta /relic reset <clave>: no existe resetOne()')
          assert 'resetOne(ctx.getSource()' in comandos, (
              '/relic reset no tiene la variante con clave')
          cuerpo = comandos.split('private static int resetOne(')[1].split('private static')[0]
          assert 'restoreDefault()' in cuerpo, (
              '/relic reset <clave> no vuelve al defecto')
          assert 'markUnsaved' in cuerpo, (
              '/relic reset <clave> no marca la clave como sin guardar')

          cuerpo_lista = comandos.split('private static int setList(')[1].split('private static')[0]
          assert 'UNSAVED.contains(' in cuerpo_lista, (
              '/relic set no marca con * las claves sin guardar')

          readme = pathlib.Path('relic-hologram/README.md').read_text(encoding='utf-8')
          assert '/relic reset <clave>' in readme, (
              'el README no documenta /relic reset <clave>')
          print('Reset OK: variante por clave con marca de sin guardar, asterisco en /relic set'
                ' y ambos en el README.')
          PY

      # Los estados de brillo (herido, tormenta, resonancia) y los VFX nuevos son
      # justo lo que un refactor se lleva por delante sin que falle nada: el aura
      # se queda de un color y nadie sabe por que.
      - name: Validate moods and vfx
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          base = pathlib.Path('relic-hologram/src/main/java/com/santipdr/holocore/client')
          animatable = (base / 'RelicAnimatable.java').read_text(encoding='utf-8')
          glow = (base / 'RelicGlowState.java').read_text(encoding='utf-8')
          aura = (base / 'RelicAura.java').read_text(encoding='utf-8')
          comandos = (base / 'RelicClientCommands.java').read_text(encoding='utf-8')
          geo = (base / 'RelicGeoRenderer.java').read_text(encoding='utf-8')
          curio = (base / 'RelicCurioRenderer.java').read_text(encoding='utf-8')
          eventos = (base / 'RelicClientEvents.java').read_text(encoding='utf-8')
          configuracion = (base.parent / 'config' / 'RelicConfig.java').read_text(encoding='utf-8')

          enum = animatable.split('enum Mood {', 1)[1].split('}', 1)[0]
          moods = re.findall(r'^\s*([A-Z][A-Z_]*)\s*,?$', enum, re.M)
          esperados = ['NEUTRAL', 'RESONANT', 'STORM', 'WOUNDED', 'DARK', 'RAIN', 'NIGHT',
                       'SUBMERGED', 'PORTAL', 'BURNING', 'FREEZING', 'NETHER', 'END']
          assert moods == esperados, moods
          assert 'public Mood mood()' in animatable, 'falta el accessor de Mood'
          assert 'isThundering()' in animatable, 'la tormenta no alimenta ningun estado'
          assert 'WOUNDED_HEALTH' in animatable and 'getMaxHealth()' in animatable, \
              'la vida del portador no alimenta ningun estado'
          # La oscuridad exige cielo tapado: a cielo abierto de noche no es una cueva,
          # es el estado NIGHT (si no, NIGHT no se alcanzaria nunca).
          assert 'DARK_SKY' in animatable and 'LightLayer.SKY' in animatable, \
              'la oscuridad no mira la luz del cielo'
          assert 'isNight()' in animatable, 'la noche despejada no se detecta'
          assert 'isEyeInFluid(FluidTags.WATER)' in animatable, 'el agua no es un estado'
          assert 'import net.minecraft.tags.FluidTags;' in animatable, \
              'falta el import de FluidTags para el estado sumergido'
          # El portal se escanea cacheado y con posicion reutilizable: 486 bloques
          # por tick y portador no lo paga nadie, y crear un BlockPos por bloque
          # escaneado seria asignar objetos en el camino de tick.
          assert 'Blocks.NETHER_PORTAL' in animatable, 'el portal del Nether no es un estado'
          assert 'Blocks.END_PORTAL' in animatable and 'Blocks.END_GATEWAY' in animatable, \
              'faltan el portal del End y la puerta de salida'
          assert 'new BlockPos.MutableBlockPos()' in animatable, \
              'el escaneo de portal asigna una posicion por bloque'
          assert 'PORTAL_SCAN_TICKS' in animatable and 'PORTAL_RADIUS' in animatable, \
              'el escaneo de portal no esta cacheado'
          assert 'if (portalNear(player)) {' in animatable, \
              'el escaneo de portal existe pero no alimenta ningun estado'
          # 1.0.51: dimension. No es clima, es el sitio, y va antes que la luz y el
          # tiempo: en el Nether no llueve y en el End la luz del cielo no dice nada.
          assert 'import net.minecraft.world.level.Level;' in animatable, \
              'falta el import de Level para los estados de dimension'
          assert 'player.level().dimension() == Level.NETHER' in animatable, \
              'el Nether no es un estado'
          assert 'player.level().dimension() == Level.END' in animatable, \
              'el End no es un estado'
          assert 'case NETHER -> 1.14D;' in animatable and 'case END -> 0.82D;' in animatable, \
              'los estados de dimension no tienen ritmo propio'
          assert 'case NETHER -> 1.25F;' in aura and 'case END -> 0.70F;' in aura, \
              'los estados de dimension no cambian el vaiven'
          assert 'case NETHER -> 1.02F;' in geo and 'case END -> 0.88F;' in geo, \
              'los estados de dimension no mueven el tinte del shader'
          assert 'NETHER_RED' in glow and 'END_RED' in glow, \
              'los estados de dimension no tienen color'
          assert 'if (mood == RelicAnimatable.Mood.NETHER) {' in aura, \
              'el Nether no tiene brasas de forja'
          assert 'if (mood == RelicAnimatable.Mood.END) {' in aura, \
              'el End no tiene polvo del vacio'
          # 1.0.52: las motas del vacio son su propio VFX (los copos caen, y en el
          # End no cae nada). Tinte debajo del aditivo, como los otros tres pases.
          assert 'private static void drawMotes(' in aura, 'faltan las motas del vacio'
          assert 'drawMotes(bufferSource, frame, time, glow, amount, motion);' in aura, \
              'las motas del vacio no se dibujan nunca'
          assert 'MOTE_COUNT' in aura and 'MOTE_SPEED' in aura and 'MOTE_RADIUS' in aura, \
              'faltan las constantes de las motas'
          motas = aura.split('private static void drawMotes(', 1)[1] \
              .split('private static void drawFlakes(', 1)[0]
          assert 'VertexConsumer tint = RelicConfig.AURA_TINT.get()' in motas, \
              'las motas no llevan tinte debajo'
          assert motas.count('billboardAt(') == 2, \
              'las motas tienen que dibujarse dos veces: tinte y aditivo'
          assert 'MOTE_TINT_BOOST' in motas and 'MOTE_ADDITIVE' in motas, \
              'las motas no usan sus constantes de composicion'
