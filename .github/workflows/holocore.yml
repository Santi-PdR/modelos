          # Cada switch sobre Mood tiene que cubrir los siete estados. javac lo
          # exige, pero descubrirlo cuesta un build entero (en 1.0.32 pasó dos
          # veces: NIGHT sin tinte de shader y sin energia de flotado). Los switch
          # con `default` son sentencias y no se tocan.
          def cuerpo_switch(texto, desde):
              hondo = 0
              for i in range(desde, len(texto)):
                  if texto[i] == '{':
                      hondo += 1
                  elif texto[i] == '}':
                      hondo -= 1
                      if hondo == 0:
                          return texto[desde:i]
              return texto[desde:]

