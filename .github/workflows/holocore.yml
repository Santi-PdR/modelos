name: Build Holographic Core (Forge 1.20.1)

on:
  push:
    paths:
      - 'relic-hologram/**'
      - '.github/workflows/holocore.yml'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el .jar como Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Gradle 8.8 / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # ------------------------------------------------------------------
      # Los assets del modelo NO se tocan: se compara su SHA-256 con el zip
      # entregado (reliquia_holografica_para_mod_v19.zip, en la raiz).
      # ------------------------------------------------------------------
      - name: Validate assets unchanged
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile

          archive = pathlib.Path('reliquia_holografica_para_mod_v19.zip')
          base = pathlib.Path('relic-hologram/src/main/resources/assets/holocore')
          pairs = {
              'reliquia_holografica/export/geo/relic_hologram_centered.geo.json':
                  'geo/relic_hologram_centered.geo.json',
              'reliquia_holografica/export/geo/relic_hologram_lite_centered.geo.json':
                  'geo/relic_hologram_lite_centered.geo.json',
              'reliquia_holografica/export/animations/relic_hologram.animation.json':
                  'animations/relic_hologram.animation.json',
              'reliquia_holografica/export/animations/relic_hologram.animation.linear.json':
                  'animations/relic_hologram.animation.linear.json',
              'reliquia_holografica/textures/relic_hologram.png':
                  'textures/relic/relic_hologram.png',
              'reliquia_holografica/textures/relic_hologram_glowing.png':
                  'textures/relic/relic_hologram_glowing.png',
          }
          with zipfile.ZipFile(archive) as z:
              for source, target in pairs.items():
                  expected = hashlib.sha256(z.read(source)).hexdigest()
                  actual = hashlib.sha256((base / target).read_bytes()).hexdigest()
                  assert expected == actual, f'ASSET MODIFICADO: {target}'
                  print(f'OK sin cambios: {target} ({actual[:12]}...)')
          PY

      # ------------------------------------------------------------------
      # JSON validos, sin nulls (GeckoLib 4.8 deserializa `parent` con
      # getAsString y un JsonNull lanza UnsupportedOperationException), las 20
      # animaciones presentes, capas solo sobre relic_react y geo coherente.
      # ------------------------------------------------------------------
      - name: Validate resources
        run: |
          python3 - <<'PY'
          import json, pathlib, struct

          res = pathlib.Path('relic-hologram/src/main/resources')
          for path in list(res.rglob('*.json')) + [res / 'pack.mcmeta']:
              json.loads(path.read_text(encoding='utf-8'))

          def nulls(value, where=''):
              if value is None:
                  yield where
              elif isinstance(value, dict):
                  for key, item in value.items():
                      yield from nulls(item, where + '/' + key)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from nulls(item, where + '/' + str(index))

          for path in list(res.rglob('*.json')) + [res / 'pack.mcmeta']:
              offenders = list(nulls(json.loads(path.read_text(encoding='utf-8'))))
              assert not offenders, (path, offenders[:5])

          base = res / 'assets/holocore'
          anims = json.loads((base / 'animations/relic_hologram.animation.json').read_text())
          manifest = json.loads(pathlib.Path('relic-hologram/tools/relic_manifest.json').read_text())

          names = {a['name'] for a in manifest['animations']}
          assert len(names) == 20, len(names)
          assert names <= set(anims['animations']), names - set(anims['animations'])
          loom = json.loads((base / 'animations/relic_hologram.animation.linear.json').read_text())
          assert set(anims['animations']) == set(loom['animations'])

          geo = json.loads((base / 'geo/relic_hologram_centered.geo.json').read_text())
          lite = json.loads((base / 'geo/relic_hologram_lite_centered.geo.json').read_text())
          full_desc = geo['minecraft:geometry'][0]['description']
          lite_desc = lite['minecraft:geometry'][0]['description']
          assert full_desc['identifier'] == 'geometry.relic_hologram_centered'
          assert lite_desc['identifier'] == 'geometry.relic_hologram_lite_centered'

          for doc in (geo, lite):
              for bone in doc['minecraft:geometry'][0]['bones']:
                  assert bone.get('name'), 'hueso sin nombre'
                  assert len(bone.get('pivot', [])) == 3, bone['name']
                  for cube in bone.get('cubes', []):
                      assert len(cube['origin']) == 3 and len(cube['size']) == 3, bone['name']
                      assert 'uv' in cube or 'uv' in bone, bone['name']
              assert doc['minecraft:geometry'][0]['description']['texture_width'] == 64
              assert doc['minecraft:geometry'][0]['description']['texture_height'] == 96

          full_bones = {b['name'] for b in geo['minecraft:geometry'][0]['bones']}
          lite_bones = {b['name'] for b in lite['minecraft:geometry'][0]['bones']}
          assert full_bones == lite_bones, full_bones ^ lite_bones
          assert {'relic_react', 'relic_root', 'core', 'ring_spin_1', 'flash'} <= full_bones

          for layer in ('animation.relic.layer_hit', 'animation.relic.layer_bump',
                        'animation.relic.layer_shake'):
              assert list(anims['animations'][layer]['bones']) == ['relic_react'], layer

          for texture in (base / 'textures/relic/relic_hologram.png',
                          base / 'textures/relic/relic_hologram_glowing.png'):
              width, height = struct.unpack('>II', texture.read_bytes()[16:24])
              assert (width, height) == (64, 96), (texture, width, height)
          icon = base / 'textures/item/holographic_core.png'
          assert struct.unpack('>II', icon.read_bytes()[16:24]) == (16, 16)
          print('Recursos OK: 20 animaciones, 98 huesos, 977/751 cubos, texturas 64x96.')
          PY

      # ------------------------------------------------------------------
      # Deriva silenciosa de documentacion: cada clave de la config tiene que
      # estar en la tabla del README, y la textura del aura tiene que tener el
      # tamano que espera el codigo.
      # ------------------------------------------------------------------
      - name: Validate docs and config coherence
        run: |
          python3 - <<'PY'
          import pathlib, re, struct

          root = pathlib.Path('relic-hologram')
          source = (root / 'src/main/java/com/santipdr/holocore/config/RelicConfig.java').read_text()
          readme = (root / 'README.md').read_text()

          keys, section = [], ''
          for line in source.splitlines():
              push = re.search(r'\.push\("([A-Za-z]+)"\)', line)
              if push:
                  section = push.group(1)
              if re.search(r'\.pop\(\)', line):
                  section = ''
              define = re.search(r'\.define(?:Enum|InRange)?\("([A-Za-z0-9_]+)"', line)
              if define:
                  name = define.group(1)
                  keys.append(f'{section}.{name}' if section else name)

          assert keys, 'no se encontro ninguna clave en RelicConfig'
          # Vale tanto `seccion.clave` como la clave suelta: la tabla del README
          # agrupa las dos claves de glitch en una sola fila.
          missing = [k for k in keys
                     if f'`{k}`' not in readme and f'`{k.split(".")[-1]}`' not in readme]
          assert not missing, f'claves de config sin documentar en README.md: {missing}'

          for name in ('relic_aura.png', 'relic_ring.png'):
              data = (root / 'src/main/resources/assets/holocore/textures/relic' / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name} no es un PNG'
              width, height, depth, color_type = (*struct.unpack('>II', data[16:24]), data[24], data[25])
              assert (width, height, depth, color_type) == (64, 64, 8, 6), (name, width, height, depth, color_type)

          # Dos secciones "## Brillo y shaders" convivieron hasta 1.0.16: la segunda
          # era la de antes de 1.0.12 y seguia diciendo "dos pases" y "~11 700
          # quads". Un encabezado repetido es la senal mas barata de ese desague.
          secciones = re.findall(r'^## (.+)$', readme, re.M)
          repetidas = sorted({x for x in secciones if secciones.count(x) > 1})
          assert not repetidas, f'README.md con secciones repetidas: {repetidas}'

          print(f'Docs OK: {len(keys)} claves de config documentadas; aura y anillo 64x64 RGBA;'
                f' {len(secciones)} secciones de README sin repetir.')
          PY

      # ------------------------------------------------------------------
      # Shader propio: ficheros en assets/minecraft/shaders/core (ahi los busca
      # ShaderInstance) y coherencia del JSON con el formato de vertice.
      # ------------------------------------------------------------------
      - name: Validate shader resources
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          base = pathlib.Path('relic-hologram/src/main/resources/assets/minecraft/shaders/core')
          for ext in ('.json', '.vsh', '.fsh'):
              assert (base / f'holocore_relic_glow{ext}').is_file(), f'falta holocore_relic_glow{ext}'

          doc = json.loads((base / 'holocore_relic_glow.json').read_text())
          assert doc['vertex'] == 'holocore_relic_glow', doc['vertex']
          assert doc['fragment'] == 'holocore_relic_glow', doc['fragment']
          blend = doc['blend']
          assert (blend['func'], blend['srcrgb'], blend['dstrgb']) == ('add', 'srcalpha', 'one'), blend

          uniforms = {u['name']: u for u in doc['uniforms']}
          for name in ('ModelViewMat', 'ProjMat', 'ColorModulator', 'HoloTime', 'HoloGlitch', 'HoloTint'):
              assert name in uniforms, name
          for uniform in uniforms.values():
              assert len(uniform['values']) == uniform['count'], uniform['name']

          feed = {'Position', 'Color', 'UV0', 'UV1', 'UV2', 'Normal'}
          assert set(doc['attributes']) <= feed, set(doc['attributes']) - feed
          assert [s['name'] for s in doc['samplers']] == ['Sampler0'], doc['samplers']

          for src in ('holocore_relic_glow.vsh', 'holocore_relic_glow.fsh'):
              text = (base / src).read_text()
              assert text.lstrip().startswith('#version 150'), src
              assert 'void main()' in text, src
          # UV2 es ivec2 en las shaders de entidad: declararlo vec2 rompe el enlace.
          vsh = (base / 'holocore_relic_glow.vsh').read_text()
          fsh = (base / 'holocore_relic_glow.fsh').read_text()
          assert 'in vec2 UV2' not in vsh
          # El barrido y la rejilla van en espacio de vista: con UV0 salian cuatro
          # bandas por cara en vez de una que recorre la reliquia (1.0.28).
          assert 'out float viewY' in vsh and 'viewY = viewPos.y' in vsh, \
              'el vertex shader no pasa la altura en espacio de vista'
          assert 'viewY * 0.9' in fsh, 'el barrido no usa el espacio de vista'
          # Dos bordes por multiplicacion en vez de dos pow: mas barato y mas limpio.
          assert 'rimTight' in fsh and 'pow(' not in fsh, \
              'el fragment shader volvio a usar pow para los dos bordes'
          # El glitch se paga solo cuando hay evento: rama sobre el uniform.
          assert 'HoloGlitch > 0.01' in fsh, 'el glitch del shader no esta condicionado'
          assert 'HoloTint.rgb' in fsh, 'el tinte por estado no llega al borde del shader'

          # El apendice A del documento tiene que ser copia literal de estos
          # ficheros: es la unica forma de que el GLSL explicado no se quede
          # atras cuando se toca el de verdad (paso en 1.0.7).
          md = pathlib.Path('relic-hologram/docs/BRILLO-Y-SHADERS.md').read_text(encoding='utf-8')
          appendix = md[md.index('## Apéndice A'):]
          blocks = re.findall(r'```(json|glsl)\n(.*?)```', appendix, re.S)
          assert [lang for lang, _ in blocks[:3]] == ['json', 'glsl', 'glsl'], [b[0] for b in blocks]
          assert json.loads(blocks[0][1]) == doc, 'el JSON del apendice no coincide: corre python3 tools/sync_shader_doc.py'
          for (_, text), name in zip(blocks[1:3], ('holocore_relic_glow.vsh', 'holocore_relic_glow.fsh')):
              esperado = (base / name).read_text(encoding='utf-8').strip('\n')
              assert text.strip('\n') == esperado, f'el bloque GLSL de {name} no coincide: corre python3 tools/sync_shader_doc.py'
          print('Shader OK: aditivo, uniforms, atributos y apendice sincronizado.')
          PY

      # El aura es aditiva y sobre nieve se quemaba a blanco. Este paso compone
      # las dos pasadas con los numeros del codigo y falla si se blanquea.
      - name: Validate aura math
        working-directory: relic-hologram
        run: python3 tools/check_aura_math.py

      # Un texto nuevo en un idioma y no en el otro sale como clave cruda en el
      # chat. Es barato comprobarlo aqui.
      - name: Validate lang parity
        run: |
          python3 - <<'PY'
          import json, pathlib

          base = pathlib.Path('relic-hologram/src/main/resources/assets/holocore/lang')
          idiomas = {p.stem: json.loads(p.read_text(encoding='utf-8')) for p in base.glob('*.json')}
          assert 'en_us' in idiomas, sorted(idiomas)
          referencia = set(idiomas['en_us'])
          for nombre, claves in idiomas.items():
              faltan = referencia - set(claves)
              sobran = set(claves) - referencia
              assert not faltan, f'{nombre} sin traducir: {sorted(faltan)[:5]}'
              assert not sobran, f'{nombre} con claves que en_us no tiene: {sorted(sobran)[:5]}'
          print(f'Idiomas OK: {sorted(idiomas)} con {len(referencia)} claves cada uno.')
          PY

      # String.format sin Locale coge el idioma del sistema: con el juego en
      # espanol, "%.2f" da 6,00 y esos numeros se copian al toml, donde la coma
      # rompe el valor. Ya paso en /relic info hasta 1.0.24.
      - name: Validate number formatting and reset
        run: |
          python3 - <<'PY'
          import pathlib, re

          malas, total = [], 0
          for ruta in sorted(pathlib.Path('relic-hologram/src/main/java').rglob('*.java')):
              for numero, linea in enumerate(ruta.read_text(encoding='utf-8').splitlines(), 1):
                  if 'String.format(' not in linea:
                      continue
                  total += 1
                  if 'Locale.' not in linea:
                      malas.append(f'{ruta}:{numero}')
          assert not malas, (
              'String.format sin Locale explicito (en espanol daria "6,00"): ' + ', '.join(malas))

          comandos = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java'
          ).read_text(encoding='utf-8')
          assert 'String.format(Locale.ROOT, "%.2f", RelicConfig.OFFSET_X.get())' in comandos, (
              'la primera linea de /relic info vuelve a usar el locale del sistema')
          # El aviso "sin guardar" tiene que ir dentro del if: si vuelve a marcarse
          # siempre, /relic reset deja 24 cambios fantasma.
          assert re.search(r'if \(tweak\.restoreDefault\(\)\) \{\s*'
                           r'markUnsaved\(tweak\.key\(\)\);\s*cambios\+\+;', comandos), (
              '/relic reset cuenta y marca como sin guardar claves que no cambian')
          print(f'Formato OK: {total} String.format, todos con Locale explicito;'
                ' /relic info con punto decimal y /relic reset contando solo cambios reales.')
          PY

      # /relic reset <clave> es el deshacer de un ajuste suelto, y el asterisco de
      # /relic set es la unica forma de saber que claves se van a perder al cerrar.
      # Las dos cosas son faciles de perder en un refactor, asi que se comprueban.
      - name: Validate reset variants and unsaved marks
        run: |
          python3 - <<'PY'
          import pathlib

          comandos = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java'
          ).read_text(encoding='utf-8')

          assert 'private static int resetOne(' in comandos, (
              'falta /relic reset <clave>: no existe resetOne()')
          assert 'resetOne(ctx.getSource()' in comandos, (
              '/relic reset no tiene la variante con clave')
          cuerpo = comandos.split('private static int resetOne(')[1].split('private static')[0]
          assert 'restoreDefault()' in cuerpo, (
              '/relic reset <clave> no vuelve al defecto')
          assert 'markUnsaved' in cuerpo, (
              '/relic reset <clave> no marca la clave como sin guardar')

          cuerpo_lista = comandos.split('private static int setList(')[1].split('private static')[0]
          assert 'UNSAVED.contains(' in cuerpo_lista, (
              '/relic set no marca con * las claves sin guardar')

          readme = pathlib.Path('relic-hologram/README.md').read_text(encoding='utf-8')
          assert '/relic reset <clave>' in readme, (
              'el README no documenta /relic reset <clave>')
          print('Reset OK: variante por clave con marca de sin guardar, asterisco en /relic set'
                ' y ambos en el README.')
          PY

      # Los estados de brillo (herido, tormenta, resonancia) y los VFX nuevos son
      # justo lo que un refactor se lleva por delante sin que falle nada: el aura
      # se queda de un color y nadie sabe por que.
      - name: Validate moods and vfx
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          base = pathlib.Path('relic-hologram/src/main/java/com/santipdr/holocore/client')
          animatable = (base / 'RelicAnimatable.java').read_text(encoding='utf-8')
          glow = (base / 'RelicGlowState.java').read_text(encoding='utf-8')
          aura = (base / 'RelicAura.java').read_text(encoding='utf-8')
          comandos = (base / 'RelicClientCommands.java').read_text(encoding='utf-8')
          geo = (base / 'RelicGeoRenderer.java').read_text(encoding='utf-8')
          curio = (base / 'RelicCurioRenderer.java').read_text(encoding='utf-8')
          eventos = (base / 'RelicClientEvents.java').read_text(encoding='utf-8')

          enum = animatable.split('enum Mood {', 1)[1].split('}', 1)[0]
          moods = re.findall(r'^\s*([A-Z][A-Z_]*)\s*,?$', enum, re.M)
          esperados = ['NEUTRAL', 'RESONANT', 'STORM', 'WOUNDED', 'DARK', 'RAIN', 'NIGHT',
                       'SUBMERGED', 'PORTAL']
          assert moods == esperados, moods
          assert 'public Mood mood()' in animatable, 'falta el accessor de Mood'
          assert 'isThundering()' in animatable, 'la tormenta no alimenta ningun estado'
          assert 'WOUNDED_HEALTH' in animatable and 'getMaxHealth()' in animatable, \
              'la vida del portador no alimenta ningun estado'
          # La oscuridad exige cielo tapado: a cielo abierto de noche no es una cueva,
          # es el estado NIGHT (si no, NIGHT no se alcanzaria nunca).
          assert 'DARK_SKY' in animatable and 'LightLayer.SKY' in animatable, \
              'la oscuridad no mira la luz del cielo'
          assert 'isNight()' in animatable, 'la noche despejada no se detecta'
          assert 'isEyeInFluid(FluidTags.WATER)' in animatable, 'el agua no es un estado'
          assert 'import net.minecraft.tags.FluidTags;' in animatable, \
              'falta el import de FluidTags para el estado sumergido'
          # El portal se escanea cacheado y con posicion reutilizable: 486 bloques
          # por tick y portador no lo paga nadie, y crear un BlockPos por bloque
          # escaneado seria asignar objetos en el camino de tick.
          assert 'Blocks.NETHER_PORTAL' in animatable, 'el portal del Nether no es un estado'
          assert 'Blocks.END_PORTAL' in animatable and 'Blocks.END_GATEWAY' in animatable, \
              'faltan el portal del End y la puerta de salida'
          assert 'new BlockPos.MutableBlockPos()' in animatable, \
              'el escaneo de portal asigna una posicion por bloque'
          assert 'PORTAL_SCAN_TICKS' in animatable and 'PORTAL_RADIUS' in animatable, \
              'el escaneo de portal no esta cacheado'
          assert 'if (portalNear(player)) {' in animatable, \
              'el escaneo de portal existe pero no alimenta ningun estado'
          assert 'case NIGHT ->' in animatable, 'el estado de noche no tiene velocidad'
          assert 'anotherBearerNear(' in animatable, 'no hay deteccion de otro portador cerca'
          assert 'RelicServer.findRelic(other).isPresent()' in animatable, \
              'la resonancia no consulta la reliquia del otro jugador'

          assert 'RelicAnimatable.Mood mood)' in glow, \
              'RelicGlowState.update no acepta el estado de brillo'
          assert 'switch (mood)' in glow, 'los estados de brillo no cambian el color'

          assert 'private static void drawSparks(' in aura, 'faltan las chispas en orbita'
          assert 'billboardAt(' in aura, 'las chispas no pueden dibujarse fuera del centro'
          assert 'echoSize' in aura, 'el anillo no tiene eco en los eventos'
          assert 'sparksEnabled()' in aura, 'las chispas no tienen interruptor'
          assert 'Quality.FULL' in aura, 'las chispas no miran la calidad'
          assert 'float fade, RelicAnimatable.Mood mood,' in aura, \
              'las chispas no reciben el estado de brillo'
          assert 'boolean storm = mood == RelicAnimatable.Mood.STORM' in aura, \
              'las chispas perdieron el azul de la tormenta'
          assert 'boolean night = mood == RelicAnimatable.Mood.NIGHT' in aura, \
              'la noche despejada no cambia las chispas'
          # Bajo el agua las chispas se cambian por burbujas que suben.
          assert 'private static void drawBubbles(' in aura, 'el agua no tiene burbujas'
          assert 'drawBubbles(bufferSource, frame, time, glow, amount, motion)' in aura, \
              'las burbujas no se dibujan nunca'
          assert 'private static float fract(' in aura, 'las burbujas no tienen ciclo'
          assert 'BUBBLE_COUNT' in aura and 'BUBBLE_SPEED' in aura, \
              'faltan las constantes de las burbujas'
          assert 'boolean portal = mood == RelicAnimatable.Mood.PORTAL' in aura, \
              'el portal no cambia las chispas'
          # La lluvia tiene su propio VFX: gotas cayendo, al reves que las burbujas.
          assert 'private static void drawDrops(' in aura, 'la lluvia no tiene gotas'
          assert 'drawDrops(bufferSource, frame, time, glow, amount, motion)' in aura, \
              'las gotas no se dibujan nunca'
          assert 'DROP_COUNT' in aura and 'DROP_SPEED' in aura, \
              'faltan las constantes de las gotas'

          assert 'message.holocore.mood' in comandos, '/relic info no dice el estado de brillo'
          assert 'Commands.literal("mood")' in comandos, 'falta /relic mood'
          assert 'forceMood(null)' in comandos, '/relic mood no se puede volver a automatico'
          # La ronda (tecla M y /relic mood next) recorre el enum entero.
          assert 'public static Mood cycleForcedMood()' in animatable, \
              'no hay ronda de estados de brillo'
          assert 'int siguiente = forced == null ? 0 : forced.ordinal() + 1;' in animatable, \
              'la ronda no avanza por el enum'
          assert 'RelicAnimatable.cycleForcedMood()' in comandos, \
              '/relic mood next no usa la misma ronda que la tecla M'
          assert 'Commands.literal("next")' in comandos, 'falta /relic mood next'
          # Ronda temporizada: avanza sola cada N segundos y se para con 0.
          assert 'public static void cycleEvery(int seconds)' in animatable, \
              'no se puede poner una ronda de estados'
          assert 'public static boolean tickForcedCycle()' in animatable, \
              'la ronda no avanza'
          # El cuerpo tiene que avanzar de verdad (no basta con que exista el metodo).
          cuerpo_ronda = animatable.split('public static boolean tickForcedCycle()', 1)[1] \
              .split('public static Mood forcedMood()', 1)[0]
          assert 'if (++cycleTicks < cycleSeconds * 20)' in cuerpo_ronda, \
              'la ronda no cuenta los ticks'
          assert 'cycleForcedMood();' in cuerpo_ronda, 'la ronda no cambia de estado'
          assert 'return true;' in cuerpo_ronda, 'la ronda no avisa cuando pasa de estado'
          assert 'RelicAnimatable.tickForcedCycle()' in eventos, \
              'nadie avanza la ronda en el tick del cliente'
          assert 'Commands.literal("cycle")' in comandos, 'falta /relic mood cycle'
          assert 'IntegerArgumentType.integer(0, 60)' in comandos, \
              '/relic mood cycle no acepta los segundos (ni el 0 para parar)'
          assert 'cycleEvery(segundos)' in comandos, \
              '/relic mood cycle no arranca la ronda del animatable'
          assert 'Commands.literal("list")' in comandos, 'falta /relic mood list'
          assert 'message.holocore.mood_list' in comandos, 'la lista de estados no se anuncia'
          # Las sugerencias del comando salen de Mood.values(): escritas a mano se
          # quedaron sin night ni submerged durante dos versiones.
          assert 'MOOD_NAMES = moodNames()' in comandos, \
              'las sugerencias de /relic mood no se generan del enum'
          assert 'MOOD_NAMES = {' not in comandos, \
              'las sugerencias de /relic mood vuelven a estar escritas a mano'
          assert 'forceMood(null)' in eventos, \
              'el estado forzado con /relic mood sobrevive a salir del mundo'

          # El estado de brillo tambien cambia la velocidad del bucle de animacion,
          # no solo el color: es lo que pidio "mejorar la animacion".
          assert 'setAnimationSpeed(' in animatable, 'el estado de brillo no toca la animacion'
          bloque_mood = animatable.split('if (nextMood != this.mood) {', 1)[1]\
              .split('this.mood = nextMood;', 1)[0]
          assert 'request(RelicAnimations.GLITCH)' in bloque_mood, \
              'el cambio de estado de brillo no dispara ninguna animacion'
          assert 'MOOD_GLITCH_TICKS' in bloque_mood, \
              'el glitch del cambio de estado no tiene espera (tiritaria al caminar)'
          assert 'speedFor(' in animatable, 'no hay velocidades por estado'
          assert 'if (speed != this.animSpeed)' in animatable, \
              'la velocidad se fija en cada tick (setAnimationSpeed crea un lambda)'

          # El tinte del shader se mueve con el estado: lluvia lo baja, oscuridad lo sube.
          assert 'safeGetUniform("HoloTint")' in geo, 'el pase GLSL no manda el tinte por estado'
          # Cada switch sobre Mood tiene que cubrir los siete estados. javac lo
          # exige, pero descubrirlo cuesta un build entero (en 1.0.32 pasó dos
          # veces: NIGHT sin tinte de shader y sin energia de flotado). Los switch
          # con `default` son sentencias y no se tocan.
          def cuerpo_switch(texto, desde):
              hondo = 0
              for i in range(desde, len(texto)):
                  if texto[i] == '{':
                      hondo += 1
                  elif texto[i] == '}':
                      hondo -= 1
                      if hondo == 0:
                          return texto[desde:i]
              return texto[desde:]

          for fuente in sorted(base.glob('*.java')):
              texto = fuente.read_text(encoding='utf-8')
              for coincidencia in re.finditer(r'switch \([^)]*mood\(?\)?\) \{', texto):
                  cuerpo = cuerpo_switch(texto, coincidencia.end() - 1)
                  if 'default' in cuerpo:
                      continue
                  for mood in moods:
                      assert f'case {mood} ->' in cuerpo, \
                          f'{fuente.name}: switch sobre Mood sin el estado {mood}'

          # Cada Mood tiene su nombre en los dos idiomas: un enum nuevo sin texto
          # saldria como clave cruda en el chat.
          for idioma in ('en_us', 'es_es'):
              lang = json.loads(pathlib.Path(
                  f'relic-hologram/src/main/resources/assets/holocore/lang/{idioma}.json'
              ).read_text(encoding='utf-8'))
              assert 'key.holocore.mood' in lang, f'{idioma} sin el nombre de la tecla M'
              assert 'message.holocore.mood_cycle' in lang, f'{idioma} sin el aviso de la ronda'
              assert 'message.holocore.mood_cycle_stop' in lang, \
                  f'{idioma} sin el aviso de parar la ronda'
              assert 'message.holocore.mood_list' in lang, f'{idioma} sin la lista de estados'
              for mood in ('wounded', 'storm', 'resonant', 'dark', 'rain',
                           'neutral', 'night', 'submerged', 'portal'):
                  clave = f'message.holocore.state.{mood}'
                  assert clave in lang, f'{idioma} sin {clave}'

          assert 'safeGetUniform("HoloGlitch")' in geo, 'el pase GLSL no manda el glitch'

          # Movimiento propio: flotar y asentarse en los eventos, aplicado antes del
          # modelo y del aura (si se aplicara solo al modelo, el aura se quedaria
          # clavada mientras el nucleo se mueve).
          # Energia de movimiento: correr/nadar/agacharse modula el aura. Es un eje
          # distinto del estado de brillo, y tiene que llegar a las dos vistas.
          assert 'public float motion()' in animatable, 'la energia de movimiento no sale del tick'
          assert 'updateMotion(player)' in animatable, 'la energia de movimiento no se actualiza'
          assert 'isSprinting()' in animatable and 'isSwimming()' in animatable, \
              'correr o nadar no alimentan la energia'
          assert 'isCrouching()' in animatable, 'agacharse no frena la energia'
          assert 'RelicAnimatable.Mood mood, float motion)' in aura, \
              'el aura no recibe la energia de movimiento'
          assert '(1.0F + 0.70F * motion)' in aura, 'el anillo no late mas rapido al correr'
          assert '(1.0F + 0.45F * motion)' in aura, 'las chispas no barren mas rapido al correr'
          assert '(1.0F + 0.50F * motion)' in aura, 'las burbujas no suben mas rapido al nadar'
          assert 'energy *= 1.0F + 0.60F * motion;' in aura, \
              'el vaiven no crece al correr'
          # Las dos vistas tienen que pasarla al aura (no solo al movimiento propio).
          assert 'animatable.mood(), animatable.motion());' in curio, \
              'el hombro no pasa la energia de movimiento al aura'
          assert '1.0F, animatable.mood(), animatable.motion());' in eventos, \
              'la vista previa no pasa la energia de movimiento al aura'
          assert 'static void applyAliveMotion(' in aura, 'la reliquia no tiene movimiento propio'
          assert 'RelicAura.applyAliveMotion(' in curio, 'el hombro no usa el movimiento propio'
          assert 'RelicAura.applyAliveMotion(' in eventos, 'la vista previa no usa el movimiento propio'
          assert 'rotateY(' in aura, 'el ladeo crea un cuaternion por frame'
          assert 'mulPose(Axis' not in aura, 'el ladeo vuelve a crear objetos por frame'
          assert 'poseStack.scale(1.0F + 0.05F * squeeze' in aura, \
              'el achatado del evento no esta aplicado'

          # Teclas: G despierta/dorme y P pulsa. La segunda tiene que estar
          # registrada y consumida, o el jugador la configura y no pasa nada.
          teclas = (base / 'RelicKeys.java').read_text(encoding='utf-8')
          assert 'KeyMapping PULSE' in teclas, 'falta la tecla del pulso'
          # Sonido: solo la reliquia propia, con sonidos de vanilla y apagable.
          sonidos = (base / 'RelicSounds.java').read_text(encoding='utf-8')
          assert 'playLocalSound(' in sonidos, 'la reliquia no suena'
          assert '!player.getUUID().equals(wearer)' in sonidos, \
              'sonarian tambien las reliquias de otros jugadores'
          assert 'SoundEvents.AMETHYST_BLOCK_CHIME' in sonidos \
              and 'SoundEvents.AMETHYST_BLOCK_RESONATE' in sonidos, \
              'los sonidos no son de vanilla (el mod no trae assets de audio)'
          assert 'RelicConfig.EVENT_SOUND.get()' in sonidos \
              and 'RelicConfig.SOUND_VOLUME.get()' in sonidos, \
              'el sonido no se puede apagar ni bajar'
          for llamada in ('RelicSounds.pulse(this.wearer)', 'RelicSounds.awake(this.wearer)', \
                          'RelicSounds.sleep(this.wearer)'):
              assert llamada in animatable, f'el sonido no esta conectado: {llamada}'
          assert 'KeyMapping MOOD' in teclas, 'falta la tecla de los estados de brillo'
          assert 'event.register(RelicKeys.MOOD)' in eventos, 'la tecla M no se registra'
          assert 'RelicKeys.MOOD.consumeClick()' in eventos, 'la tecla M no se consume'
          assert 'displayClientMessage(aviso, true)' in eventos, \
              'el aviso de la tecla M no va a la barra de accion'
          assert 'event.register(RelicKeys.PULSE)' in eventos, 'la tecla del pulso no se registra'
          assert 'RelicKeys.PULSE.consumeClick()' in eventos, 'la tecla del pulso no se consume'
          for idioma in ('en_us', 'es_es'):
              lang = json.loads(pathlib.Path(
                  f'relic-hologram/src/main/resources/assets/holocore/lang/{idioma}.json'
              ).read_text(encoding='utf-8'))
              assert 'key.holocore.pulse' in lang, f'{idioma} sin key.holocore.pulse'
          print('Estados y VFX OK: herido/tormenta/resonancia con su texto, chispas, eco del'
                ' anillo y glitch en el shader.')
          PY

      # ------------------------------------------------------------------
      # RelicAnimations.java se genera desde el manifiesto: si alguien edito a
      # mano un nombre de animacion, aqui se ve.
      # ------------------------------------------------------------------
      - name: Check generated animation constants
        working-directory: relic-hologram
        run: python3 tools/gen_relic_constants.py --check

      # Los nombres de animacion tienen que salir de RelicAnimations. En 1.0.10
      # triggerLayer("layer_hit") pasaba un nombre que no existe en el JSON y el
      # controlador de capas nunca reproducia nada.
      # Las constantes de RelicAnimations tienen que ser exactamente las claves del
      # JSON de animaciones. Un nombre de mas (o de menos) se queda en silencio
      # hasta que GeckoLib no encuentra la animacion y el hueso no se mueve.
      - name: Validate animation names against JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          java = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/common/RelicAnimations.java'
          ).read_text(encoding='utf-8')
          declaradas = set(re.findall(r'public static final String \w+ = "(animation\.relic\.[^"]+)";', java))

          json_path = pathlib.Path(
              'relic-hologram/src/main/resources/assets/holocore/animations/relic_hologram.animation.json'
          )
          reales = set(json.loads(json_path.read_text(encoding='utf-8'))['animations'])

          assert declaradas, 'no se encontro ninguna constante de animacion en RelicAnimations.java'
          faltan = sorted(declaradas - reales)
          sobran = sorted(reales - declaradas)
          assert not faltan, f'constantes que no existen en el JSON: {faltan}'
          assert not sobran, f'animaciones del JSON sin constante: {sobran}'
          print(f'Animaciones OK: {len(reales)} claves del JSON = {len(declaradas)} constantes de Java.')
          PY

      - name: Validate animation name literals
        run: |
          python3 - <<'PY'
          import pathlib, re

          malos = []
          for f in pathlib.Path('relic-hologram/src/main/java').rglob('*.java'):
              if f.name == 'RelicAnimations.java':
                  continue
              texto = f.read_text(encoding='utf-8')
              for m in re.finditer(r'(triggerLayer|request)\(\s*"([^"]+)"', texto):
                  malos.append(f'{f.name}: {m.group(0)}')
          assert not malos, 'usar RelicAnimations.* en vez de literales -> ' + '; '.join(malos)
          print('Nombres de animacion: todos via RelicAnimations.')
          PY

      # Un comando nuevo sin fila en el README es un comando que no existe para
      # nadie: /relic stats nacio en 1.0.18 y esto lo deja escrito.
      - name: Validate documented commands
        run: |
          python3 - <<'PY'
          import pathlib, re

          java = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java'
          ).read_text(encoding='utf-8')
          codigo = re.sub(r'/\*.*?\*/', '', java, flags=re.S)
          codigo = re.sub(r'//[^\n]*', '', codigo)
          literales = sorted(set(re.findall(r'Commands\.literal\("([a-z]+)"\)', codigo)))
          assert 'relic' in literales, f'sin raiz /relic: {literales}'
          subcomandos = [n for n in literales if n != 'relic']

          # Dos sitios donde se documentan los comandos: el README y la
          # descripcion que sale en la lista de mods del juego.
          sitios = {
              'README.md': pathlib.Path('relic-hologram/README.md').read_text(encoding='utf-8'),
              'mods.toml': pathlib.Path(
                  'relic-hologram/src/main/resources/META-INF/mods.toml').read_text(encoding='utf-8'),
          }
          for nombre, texto in sitios.items():
              filas = [linea for linea in texto.splitlines() if '/relic' in linea]
              faltan = [n for n in subcomandos
                        if not any(re.search(r'\b' + n + r'\b', fila) for fila in filas)]
              assert not faltan, f'comandos sin documentar en {nombre}: {faltan}'
          print(f'Comandos OK: {len(subcomandos)} documentados en README.md y mods.toml'
                f' -> {", ".join(subcomandos)}')
          PY

      # La columna "Defecto" del README se creia a si misma: nadie comparaba esos
      # numeros con RelicConfig. Aqui se comparan clave a clave.
      - name: Validate documented defaults
        run: |
          python3 - <<'PY'
          import pathlib, re

          def codigo(ruta):
              texto = pathlib.Path(ruta).read_text(encoding='utf-8')
              texto = re.sub(r'/\*.*?\*/', '', texto, flags=re.S)
              return re.sub(r'//[^\n]*', '', texto)

          config = codigo('relic-hologram/src/main/java/com/santipdr/holocore/config/RelicConfig.java')
          readme = pathlib.Path('relic-hologram/README.md').read_text(encoding='utf-8')

          # --- valores por defecto de la config ---
          seccion, defectos = '', {}
          for linea in config.splitlines():
              push = re.search(r'\.push\("(\w+)"\)', linea)
              if push:
                  seccion = push.group(1)
                  continue
              if re.search(r'\.pop\(\)', linea):
                  seccion = ''
                  continue
              rango = re.search(r'\.defineInRange\("(\w+)",\s*(-?[\d.]+)D?,', linea)
              if rango:
                  defectos[f'{seccion}.{rango.group(1)}'] = rango.group(2)
                  continue
              bandera = re.search(r'\.define\("(\w+)",\s*(true|false)\)', linea)
              if bandera:
                  defectos[f'{seccion}.{bandera.group(1)}'] = bandera.group(2)
                  continue
              eleccion = re.search(r'\.defineEnum\("(\w+)",\s*[\w.]+\.(\w+)\)', linea)
              if eleccion:
                  defectos[f'{seccion}.{eleccion.group(1)}'] = eleccion.group(2)
          assert len(defectos) == 26, f'esperaba 26 defectos, hay {len(defectos)}'

          # --- tabla de configuracion del README (solo esa seccion) ---
          inicio = readme.index('## Configuración')
          fin = readme.index('\n## ', inicio + 5)
          tabla = readme[inicio:fin]

          leidos = {}
          for linea in tabla.splitlines():
              if not linea.startswith('| `'):
                  continue
              celdas = [c.strip() for c in linea.strip().strip('|').split('|')]
              if len(celdas) < 3:
                  continue
              claves = re.findall(r'`([^`]+)`', celdas[0])
              valores = re.findall(r'`([^`]+)`', celdas[1])
              if not claves or len(claves) != len(valores):
                  continue
              # La fila de los glitch comparte celda: la segunda clave va sin seccion.
              for clave, valor in zip(claves, valores):
                  completo = clave if '.' in clave else f'visuals.{clave}'
                  leidos[completo] = valor

          faltan = sorted(set(defectos) - set(leidos))
          sobran = sorted(set(leidos) - set(defectos))
          assert not faltan, f'claves de la config que la tabla del README no lista: {faltan}'
          assert not sobran, f'la tabla del README lista claves que no existen: {sobran}'

          for clave, esperado in sorted(defectos.items()):
              valor = leidos[clave]
              if re.fullmatch(r'-?[\d.]+', valor) and re.fullmatch(r'-?[\d.]+', esperado):
                  iguales = abs(float(valor) - float(esperado)) < 1e-9
              else:
                  iguales = valor.lower() == esperado.lower()
              assert iguales, f'{clave}: el README dice {valor}, RelicConfig dice {esperado}'

          print(f'Defectos OK: {len(defectos)} claves con el mismo valor en el README y en RelicConfig.')
          PY

      # /relic set es una segunda copia de la tabla de config (claves, tipos y
      # rangos). Una copia sin comprobar es una mentira a plazos: aqui se compara
      # con RelicConfig y falla en cuanto se separan.
      - name: Validate config tweaks
        run: |
          python3 - <<'PY'
          import pathlib, re

          def codigo(ruta):
              texto = pathlib.Path(ruta).read_text(encoding='utf-8')
              texto = re.sub(r'/\*.*?\*/', '', texto, flags=re.S)
              return re.sub(r'//[^\n]*', '', texto)

          config = codigo('relic-hologram/src/main/java/com/santipdr/holocore/config/RelicConfig.java')
          comandos = codigo('relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java')

          # --- config: campo -> clave, tipo y rango ---
          campo_de = {}
          for m in re.finditer(r'(\w+)\s*=\s*b\.comment\(', config):
              golpe = re.search(r'\.(define\w*)\("(\w+)"', config[m.end():m.end() + 800])
              assert golpe, f'no se encontro el define de {m.group(1)}'
              campo_de[m.group(1)] = golpe.group(2)

          seccion, declaradas = '', {}
          for linea in config.splitlines():
              push = re.search(r'\.push\("(\w+)"\)', linea)
              if push:
                  seccion = push.group(1)
                  continue
              if re.search(r'\.pop\(\)', linea):
                  seccion = ''
                  continue
              rango = re.search(
                  r'\.defineInRange\("(\w+)",\s*(-?[\d.]+)D?,\s*(-?[\d.]+)D?,\s*(-?[\d.]+)D?\)', linea)
              if rango:
                  clave, defecto, minimo, maximo = rango.groups()
                  # 'D' pegado al numero = literal double; ojo, la clave
                  # maxRenderDistance tambien lleva una D en el nombre.
                  entero = not re.search(r'[\d.]D\s*[,)]', linea)
                  declaradas[f'{seccion}.{clave}'] = ('whole' if entero else 'number',
                                                      float(minimo), float(maximo))
                  continue
              bandera = re.search(r'\.define\("(\w+)",\s*(?:true|false)\)', linea)
              if bandera:
                  declaradas[f'{seccion}.{bandera.group(1)}'] = ('flag', 0.0, 0.0)
                  continue
              if re.search(r'\.defineEnum\(', linea):
                  clave = re.search(r'\.defineEnum\("(\w+)"', linea).group(1)
                  declaradas[f'{seccion}.{clave}'] = ('enum', 0.0, 0.0)

          assert len(declaradas) == 26, f'esperaba 26 claves en RelicConfig, hay {len(declaradas)}'

          # --- comando: Tweak.<tipo>("clave", RelicConfig.CAMPO, [min, max,] defecto) ---
          tabla, defecto_tabla = {}, {}
          for linea in comandos.splitlines():
              m = re.search(r'Tweak\.(number|whole)\("([\w.]+)",\s*RelicConfig\.(\w+)'
                              r',\s*(-?[\d.]+)D?,\s*(-?[\d.]+)D?,\s*(-?[\d.]+)D?\)', linea)
              if m:
                  tipo, clave, campo, minimo, maximo, defecto = m.groups()
                  tabla[clave] = (tipo, campo, float(minimo), float(maximo))
                  defecto_tabla[clave] = float(defecto)
                  continue
              m = re.search(r'Tweak\.flag\("([\w.]+)",\s*RelicConfig\.(\w+),\s*(true|false)\)', linea)
              if m:
                  clave, campo, defecto = m.groups()
                  tabla[clave] = ('flag', campo, 0.0, 0.0)
                  defecto_tabla[clave] = defecto

          assert tabla, 'no se encontro ninguna clave en /relic set'

          # shoulder y quality tienen su propio comando y validan el texto.
          exentas = {k for k, v in declaradas.items() if v[0] == 'enum'}
          faltan = sorted(set(declaradas) - exentas - set(tabla))
          sobran = sorted(set(tabla) - set(declaradas))
          assert not faltan, f'claves de config sin /relic set: {faltan}'
          assert not sobran, f'/relic set con claves que no existen en la config: {sobran}'

          for clave, (tipo, campo, minimo, maximo) in sorted(tabla.items()):
              esperado = declaradas[clave]
              assert tipo == esperado[0], f'{clave}: tipo {tipo} pero la config es {esperado[0]}'
              assert campo_de.get(campo) == clave.split('.')[1], \
                  f'{clave}: apunta a RelicConfig.{campo}, que es {campo_de.get(campo)}'
              assert (minimo, maximo) == (esperado[1], esperado[2]), \
                  f'{clave}: rango {minimo}..{maximo} pero la config dice {esperado[1]}..{esperado[2]}'

          # Defectos de la config, para comparar con la tercera copia (la tabla).
          seccion, defectos = '', {}
          for linea in config.splitlines():
              push = re.search(r'\.push\("(\w+)"\)', linea)
              if push:
                  seccion = push.group(1)
                  continue
              if re.search(r'\.pop\(\)', linea):
                  seccion = ''
                  continue
              rango = re.search(r'\.defineInRange\("(\w+)",\s*(-?[\d.]+)D?,', linea)
              if rango:
                  defectos[f'{seccion}.{rango.group(1)}'] = float(rango.group(2))
                  continue
              bandera = re.search(r'\.define\("(\w+)",\s*(true|false)\)', linea)
              if bandera:
                  defectos[f'{seccion}.{bandera.group(1)}'] = bandera.group(2)

          for clave, defecto in sorted(defecto_tabla.items()):
              esperado = defectos.get(clave)
              assert esperado is not None, f'{clave} no tiene defecto en RelicConfig'
              if isinstance(defecto, str):
                  iguales = defecto == esperado
              else:
                  iguales = abs(defecto - float(esperado)) < 1e-9
              assert iguales, f'{clave}: /relic reset volveria a {defecto}, la config dice {esperado}'

          # /relic set acepta el nombre corto (auraIntensity). Si dos claves
          # compartieran nombre corto, esa forma dejaria de funcionar en silencio.
          cortos = [clave.split('.')[-1] for clave in tabla]
          repetidos = sorted({c for c in cortos if cortos.count(c) > 1})
          assert not repetidos, f'nombres cortos ambiguos en /relic set: {repetidos}'

          print(f'Config tweaks OK: {len(tabla)} claves ajustables con rango y defecto iguales a la config,'
                f' {len(exentas)} con comando propio,'
                f' tipos y rangos iguales a RelicConfig.')
          PY

      # 1.0.19 saco la actualizacion del estado del renderer: en primera persona
      # no hay renderer y la reliquia se quedaba congelada. Esto fija el cableado
      # (tick del cliente + marca de dibujado) para que no vuelva atras.
      - name: Validate local relic tick
        run: |
          python3 - <<'PY'
          import pathlib, re

          base = pathlib.Path('relic-hologram/src/main/java/com/santipdr/holocore/client')

          def codigo(nombre):
              texto = (base / nombre).read_text(encoding='utf-8')
              texto = re.sub(r'/\*.*?\*/', '', texto, flags=re.S)
              return re.sub(r'//[^\n]*', '', texto)

          eventos, curio, visuales = (codigo('RelicClientEvents.java'),
                                      codigo('RelicCurioRenderer.java'),
                                      codigo('RelicVisuals.java'))

          assert 'tickLocalRelic(minecraft)' in eventos, 'el tick del cliente no actualiza la reliquia local'
          assert 'animatable.update(player, ClientRelicStates.get(player.getUUID())' in eventos, \
              'el tick local tiene que actualizar con el estado del servidor'
          assert '1.0F, visible)' in eventos, \
              'el tick local tiene que pasar el flag de visibilidad'
          assert 'markRendered(' in curio, 'el renderer tiene que marcar el portador como dibujado'
          assert 'lastUpdateTick()' in visuales, 'el prune tiene que medir ticks sin actualizar, no sin dibujar'

          # /relic preview: sin hook, sin dibujo, o sin volcar el lote (que es lo
          # que hace que no se vea nada) la vista previa se quedaria muda.
          assert 'onRenderStage(RenderLevelStageEvent' in eventos, 'falta el hook de render de la vista previa'
          assert 'renderHologram(poseStack' in eventos, 'la vista previa no dibuja el modelo'
          assert 'RelicAura.render(poseStack' in eventos, 'la vista previa no dibuja el aura'
          assert 'endBatch()' in eventos, 'la vista previa no vuelca el lote'
          assert 'preview = false' in eventos, 'la vista previa tiene que apagarse al salir del mundo'
          # En espectador el tick salia antes de nada: la preview se quedaba
          # dibujando una reliquia fantasma (markRendered la mantiene viva).
          assert eventos.count('preview = false') >= 2, \
              'la vista previa tiene que apagarse tambien al pasar a espectador y al quedarse sin reliquia'
          rama_espectador = eventos.split('isSpectator()', 1)[1].split('return;', 1)[0]
          assert 'preview = false' in rama_espectador, \
              'la rama de espectador del tick local no apaga la vista previa'

          # La vista previa tiene que ir descentrada: en el centro tapaba la
          # mirilla y lo que hubiera detras, que es lo que se quiere mirar.
          pose_preview = eventos.split('onRenderStage(RenderLevelStageEvent', 1)[1]
          assert 'getLeftVector()' in pose_preview and 'getUpVector()' in pose_preview, \
              'la vista previa vuelve a dibujarse en el centro de la pantalla (tapa la mirilla)'

          # /relic info tiene que decir que la vista previa esta puesta.
          comandos = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicClientCommands.java'
          ).read_text(encoding='utf-8')
          assert 'previewEnabled()' in comandos and 'preview_info' in comandos, \
              '/relic info no avisa de que la vista previa esta activa'

          print('Tick local OK: estado vivo fuera de pantalla, prune por actualizacion y preview cableada.'
                ' Preview que se apaga en espectador y se anuncia en /relic info.')
          PY

      # 1.0.16 quitaba tres de las cuatro evaluaciones de animacion por frame. Es
      # una mejora invisible: si alguien vuelve a llamar a defaultRender en los
      # pases extra, no rompe nada y nadie se entera hasta que baja el FPS. Esto
      # la fija: un defaultRender (el que anima), ningun actuallyRender suelto y
      # tres renderExtra (que van por reRender sobre la pose ya posada).
      - name: Validate single animation evaluation
        run: |
          python3 - <<'PY'
          import pathlib, re

          fuente = pathlib.Path(
              'relic-hologram/src/main/java/com/santipdr/holocore/client/RelicGeoRenderer.java'
          ).read_text(encoding='utf-8')
          codigo = re.sub(r'/\*.*?\*/', '', fuente, flags=re.S)
          codigo = re.sub(r'//[^\n]*', '', codigo)

          # \b para que preRender( no cuente como reRender(.
          def veces(llamada):
              return len(re.findall(r'\b' + re.escape(llamada) + r'\(', codigo))

          assert veces('defaultRender') == 1, f'defaultRender: {veces("defaultRender")} (debe ser 1)'
          assert veces('actuallyRender') == 0, 'no llamar a actuallyRender directamente'
          assert veces('reRender') == 1, f'reRender: {veces("reRender")} (debe ser 1, dentro de renderExtra)'
          # La declaracion lleva BakedGeoModel delante; las llamadas empiezan por model.
          extra = len(re.findall(r'renderExtra\(\s*model', codigo))
          assert extra == 3, f'renderExtra(model...): {extra} (deben ser 3)'
          print('Animacion OK: 1 defaultRender + 3 renderExtra (= 1 sola evaluacion por frame).')
          PY

      # 1.0.17: el aura y el estado interpolado no reservan memoria por frame.
      # Antes eran ~35 objetos por portador y frame. Un `new` nuevo en estos dos
      # ficheros (fuera de constantes de clase) devuelve la basura al recolector.
      - name: Validate render path allocations
        run: |
          python3 - <<'PY'
          import pathlib, re

          base = pathlib.Path('relic-hologram/src/main/java/com/santipdr/holocore/client')
          malos = []
          for nombre in ('RelicAura.java', 'RelicGlowState.java'):
              fuente = (base / nombre).read_text(encoding='utf-8')
              codigo = re.sub(r'/\*.*?\*/', '', fuente, flags=re.S)
              codigo = re.sub(r'//[^\n]*', '', codigo)
              for numero, linea in enumerate(codigo.splitlines(), 1):
                  if ' new ' not in linea:
                      continue
                  # Solo se permiten objetos creados al cargar la clase.
                  if 'private static final' in linea or 'new ResourceLocation(' in linea:
                      continue
                  malos.append(f'{nombre}:{numero}: {linea.strip()}')
          assert not malos, 'asignacion en el camino de render -> ' + '; '.join(malos)
          # En la banda de desvanecido los dos pases que suman luz no se ven y
          # cuestan dos recorridos de 977 cubos: se saltan (1.0.28).
          geo = (base / 'RelicGeoRenderer.java').read_text(encoding='utf-8')
          assert 'boolean fading = fade < 0.55F' in geo, \
              'no se calcula la banda de desvanecido del modelo'
          assert 'haloEnabled() && !fading' in geo and 'glowShader != null && !fading' in geo, \
              'el halo o el pase GLSL vuelven a dibujarse enteros en la banda de desvanecido'
          print('Render path OK: aura y estado sin asignaciones por frame;'
                ' halo y GLSL se saltan en la banda de desvanecido.')
          PY

      - name: Build
        working-directory: relic-hologram
        run: |
          set -uo pipefail
          # Un fallo de red al bajar dependencias (Modrinth, maven de Curios) no
          # debe tenirse de rojo: se reintenta UNA vez. Un error de javac falla
          # las dos veces y lo reemite el paso siguiente como anotacion.
          if gradle build --stacktrace --no-daemon; then
            exit 0
          fi
          echo "::warning title=build::primer intento fallido, reintentando en 20 s"
          sleep 20
          gradle build --stacktrace --no-daemon

      # Solo se ejecuta si algo fallo. El log de Actions no es legible desde
      # fuera (el CDN esta bloqueado), asi que los errores de javac se reemiten
      # como anotaciones del check, que si se pueden consultar por API.
      - name: Surface build errors
        if: failure()
        working-directory: relic-hologram
        run: |
          set +e
          OUT="$(gradle build --no-daemon --stacktrace 2>&1)"
          echo "$OUT" | tail -80
          SECTION="$(echo "$OUT" | sed -n '/What went wrong/,/^\* Try/p' | head -9)"
          [ -z "$SECTION" ] && SECTION="$(echo "$OUT" | grep -E 'error:|\.java:[0-9]+|Caused by|FAILED|Could not' | head -9)"
          echo "$SECTION" | while IFS= read -r line; do
            echo "::error title=build::${line//'%'/'%25'}"
          done
          exit 0

      - name: Show jar
        working-directory: relic-hologram
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/holocore-$VER.jar"
          test -f "$JAR"
          SHA="$(sha256sum "$JAR" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$JAR")"
          echo "JAR: $JAR"
          echo "sha256: $SHA"
          echo "bytes: $SIZE"
          {
            echo "### Holographic Core $VER"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| jar | \`holocore-$VER.jar\` |"
            echo "| bytes | $SIZE |"
            echo "| sha256 | \`$SHA\` |"
            echo ""
            echo "Instalacion (PowerShell), mismo patron que el resto de mods:"
            echo '```powershell'
            echo "\$d='D:\\Minecraft\\SKLauncher\\sklauncher-data-v4\\instances\\test-1\\mods'"
            echo "\$n='holocore-$VER.jar'"
            echo "\$s=$SIZE"
            echo "\$h='$SHA'"
            echo "\$u=\"https://github.com/\${env:GITHUB_REPOSITORY}/releases/download/v$VER/\$n\""
            echo 'Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile "$env:TEMP\$n"'
            echo 'if ((Get-Item "$env:TEMP\$n").Length -ne $s) { "TAMAÑO MAL" } else { (Get-FileHash "$env:TEMP\$n" -Algorithm SHA256).Hash }'
            echo 'Remove-Item "$d\holocore-*.jar" -Force -ErrorAction SilentlyContinue'
            echo 'Move-Item -Force "$env:TEMP\$n" $d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect jar contents
        working-directory: relic-hologram
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/holocore-$VER.jar"
          unzip -l "$JAR" | grep -E "META-INF/mods.toml|holocore/geo/|holocore/animations/|holocore/textures/relic/|holocore/lang/|curios/tags|recipes/|holographic_core.json|holographic_core.png|shaders/core/holocore_relic_glow"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: holocore-jar
          path: relic-hologram/build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        # Palabra clave EXCLUSIVA de este mod: build.yml (capatest) tambien
        # escucha [publicar], y usar la misma disparaba la release del otro mod.
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-holocore]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publicar == true)
        working-directory: relic-hologram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/holocore-$VER.jar"
          test -f "$JAR"
          SHA="$(sha256sum "$JAR" | cut -d' ' -f1)"
          TAG="v$VER"
          NOTES="$(mktemp)"
          # Las notas salen del CHANGELOG de esa version y no de un texto fijo:
          # asi la release cuenta lo que trae ESTE jar.
          python3 - "$VER" "$SHA" > "$NOTES" <<'PY'
          import os, pathlib, re, sys

          version, sha = sys.argv[1], sys.argv[2]
          repo = os.environ.get('GITHUB_REPOSITORY', 'Santi-PdR/modelos')
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')

          print('Reliquia cosmetica **Holographic Core** para Forge 1.20.1.')
          print()
          print('Requiere **GeckoLib 4.8.1+** y **Curios API 5.14.1+** (obligatorios).')
          print()

          match = re.search(rf'^## {re.escape(version)} .*?(?=^## |\Z)', changelog, re.M | re.S)
          print(match.group(0).strip() if match else '(sin entrada en CHANGELOG.md)')
          print()
          print(f'SHA-256 del jar: `{sha}`')
          print()
          print('```powershell')
          print(f"$u='https://github.com/{repo}/releases/download/v{version}/holocore-{version}.jar'")
          print('Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile "$env:TEMP\holocore.jar"')
          print('(Get-FileHash "$env:TEMP\holocore.jar" -Algorithm SHA256).Hash')
          print('```')
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            # Tambien las notas: una release que ya existia se queda contando la
            # version anterior para siempre.
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$JAR" \
              --title "Holographic Core $TAG" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          echo "Publicado $TAG (sha256:$SHA)"

  # --------------------------------------------------------------------
  # Arranque real del cliente en CI, sin GPU (xvfb + llvmpipe).
  # Comprueba que el mod carga y que Curios/GeckoLib se registran. No
  # sustituye a la prueba visual en el juego.
  # --------------------------------------------------------------------
  client-smoke:
    name: runClient (xvfb, sin GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Launch client (xvfb) and check mod loading
        working-directory: relic-hologram
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          set +e
          command -v xvfb-run || sudo apt-get install -y xvfb
          # En CI no hay tarjeta de sonido: el cliente apaga el audio y sigue.
          # Un cliente sano NO termina solo, asi que timeout (124) = exito.
          timeout 480 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1
          RC=$?
          echo "exit=$RC"
          grep -n "Holographic Core (holocore) cargado" client.log | head -3 || true
          echo '--- ultimas lineas ---'
          tail -40 client.log

          FAIL=0
          if [ "$RC" -ne 124 ] && [ "$RC" -ne 0 ]; then
            echo "::error::runClient termino con codigo $RC (se esperaba 124 = seguia vivo)."
            FAIL=1
          fi
          if ! grep -q "Holographic Core (holocore) cargado" client.log; then
            echo "::error::El mod no registro su arranque (el constructor no se ejecuto)."
            FAIL=1
          fi
          # El shader se compila en la recarga de recursos del arranque: si el
          # GLSL es invalido o el listener no esta registrado, no hay marca.
          if ! grep -q "Shader del aura compilado" client.log; then
            echo "::error::El shader del aura no compilo (GLSL invalido o reload listener sin registrar)."
            FAIL=1
          fi
          for pattern in "Mod loading error has occurred" "Crash report saved to" \
                         "Unable to find model" "Error loading model file" "Failed to create display"; do
            if grep -q "$pattern" client.log; then
              echo "::error::encontrado en el log: $pattern"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            # Las lineas del shader como anotaciones: el log de Actions no se
            # puede leer desde fuera, las anotaciones si.
            grep -aiE "holocore_relic_glow|Shader del aura|No se pudo compilar|ChainedJsonException|GLSL|shader" client.log \
              | tail -15 | while IFS= read -r line; do
                  echo "::error title=shader::${line//'%'/'%25'}"
                done || true
            {
              echo "### Diagnostico runClient"
              echo ''
              echo '```'
              grep -nE "Exception|Caused by|ERROR|FATAL|Crash|Failed|holocore" client.log | tail -60 || true
              echo '--- tail ---'
              tail -100 client.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cliente arrancado y mod cargado sin errores."
