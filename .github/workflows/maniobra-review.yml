name: Revisar las capturas de la maniobra Forge

on: push

jobs:
  review:
    if: github.ref_name == 'arena/5a9fa51b-modelos' && contains(github.event.head_commit.message, '[revisar-maniobra]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CAPTURE_RUN: 44949607859
      CAPTURE_SOURCE: 042ec1f3a106af8e986438e3bdf3bd3802a130b5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar las tomas y reconstruir el vínculo con el JAR
        run: |
          set -euo pipefail
          git diff --exit-code "$CAPTURE_SOURCE" HEAD -- src/main src/fxSmoke build.gradle settings.gradle gradle.properties
          gh run view "$CAPTURE_RUN" --json headSha,status,jobs > "$RUNNER_TEMP/forge-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'forge-run.json').read_text())
          assert r['headSha'] == os.environ['CAPTURE_SOURCE'] and r['status'] == 'completed'
          ok = {s['name'] for j in r['jobs'] for s in j['steps'] if s['conclusion'] == 'success'}
          assert {'Build', 'Verify jar is reproducible', 'Probar giro y frenada agachada en Forge (opcional)',
                  'Subir capturas y malla de la maniobra en mundo'} <= ok, ok
          PY
          gh run download "$CAPTURE_RUN" -n capatest-jar -D "$RUNNER_TEMP/compiled"
          (cd "$RUNNER_TEMP/compiled" && sha256sum -c SHA256SUMS.txt)
          cmp "$RUNNER_TEMP/compiled/capatest-1.67.28.jar" entregables/v1.67.28/capatest-1.67.28.jar
          gh run download "$CAPTURE_RUN" -n capatest-maniobra-forge -D "$RUNNER_TEMP/maniobra"
          for slot in pecho curios; do
            f="$RUNNER_TEMP/maniobra/maniobra-$slot.tsv"
            awk -F '\t' -v slot="$slot" 'NR==2 {a=$1} END {printf "::notice title=Tramo grabado::%s: %d cuadros, t=%s a %s.\n",slot,NR-1,a,$1}' "$f"
          done

      - name: Medir la maniobra registrada
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy Pillow
          OPENBLAS_NUM_THREADS=1 python3 tools/verify_forge_combined.py "$RUNNER_TEMP/maniobra" 2>&1 | while IFS= read -r line; do
            case "$line" in
              *AssertionError:*|*Error:*) printf '::error title=Maniobra en Forge::%s\n' "${line//%/%25}" ;;
              pecho:*|curios:*) printf '::notice title=Maniobra en Forge::%s\n' "${line//%/%25}" ;;
              *) printf '%s\n' "$line" ;;
            esac
          done

      - name: Adjuntar la lámina y las trazas revisadas
        run: |
          set -euo pipefail
          dir=docs/releases/v1.67.28/maniobra
          mkdir -p "$dir"
          install -m 0644 "$RUNNER_TEMP/maniobra"/maniobra-{pecho.tsv,curios.tsv,forge.tsv,forge.jpg} "$dir/"
          printf 'https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$CAPTURE_RUN" > "$dir/prueba.txt"
          printf 'https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$dir/revision.txt"
          git add "$dir"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Adjuntar la maniobra verificada sin modificar el JAR entregado [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
