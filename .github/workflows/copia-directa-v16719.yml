name: Copiar el JAR verificado de encastre v1.67.19

on:
  push:
    branches: [arena/5a9fa51b-modelos]
    paths: [.github/workflows/copia-directa-v16719.yml]

concurrency:
  group: copia-encastre-v16719-${{ github.ref }}
  cancel-in-progress: false

jobs:
  copiar:
    if: github.repository == 'Santi-PdR/modelos' && contains(github.event.head_commit.message, '[capa-v16719-directo]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN: '44842478920'
      SOURCE_SHA: '00a8319e9740393889e29f5fa1a55bca75882bf4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Confirmar que el JAR y las tomas proceden de un único run aprobado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" -- src tools preview build.gradle gradle.properties
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '[.head_sha,.head_branch,.conclusion]|@tsv' > "$RUNNER_TEMP/source.tsv"
          printf '%s\t%s\tsuccess\n' "$SOURCE_SHA" "$GITHUB_REF_NAME" | cmp - "$RUNNER_TEMP/source.tsv"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          job, = json.loads((Path(os.environ['RUNNER_TEMP'])/'jobs.json').read_text())['jobs']
          outcomes = {s['name']:s['conclusion'] for s in job['steps']}
          for name in ('Build', 'Verify jar is reproducible', 'Verify jar contents (model resources)',
                       'Compare the packaged art with v1.67.14', 'Test worn-state and cosmetic profiles',
                       'Probar FX y equipo en Forge (opcional)', 'Comprobar órbita, mirada y placas sobre las mangas en Forge',
                       'Lámina con Steve y Alex, pecho y Curios', 'Medir ciclos y transiciones reales al caminar en F5',
                       'Verificar el icono original en la hotbar de Forge', 'Subir capturas de la prueba en mundo'):
              assert outcomes.get(name) == 'success', (name,outcomes.get(name))
          PY
      - name: Descargar el JAR reproducible
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Santi-PdR/modelos
          run-id: '44842478920'
          name: capatest-jar
          path: ${{ runner.temp }}/capa-verified
      - name: Descargar capturas y trazas del mismo run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Santi-PdR/modelos
          run-id: '44842478920'
          name: capatest-fx-en-mundo
          path: ${{ runner.temp }}/capa-shots
      - name: Descargar las vistas idénticas de la prueba v1.67.18
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Santi-PdR/modelos
          run-id: '44833876875'
          name: capatest-fx-en-mundo
          path: ${{ runner.temp }}/capa-before
      - name: Adjuntar solo el JAR comprobado y su lámina a la rama de trabajo
        run: |
          set -euo pipefail
          branch=arena/5a9fa51b-modelos
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git branch --show-current)" = "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jar=capatest-1.67.18.jar
          files="$RUNNER_TEMP/capa-verified"
          (cd "$files" && sha256sum -c SHA256SUMS.txt)
          printf '0a837554c29c517b50a0f4155acfa25e84d0e73656dc9bfabc06cb0bb97bbfb5  %s\n' "$jar" | cmp - "$files/SHA256SUMS.txt"
          test "$(sha256sum "$files/$jar" | cut -d' ' -f1)  $jar" = "$(cat "$files/SHA256SUMS.txt")"
          python3 -m pip install --quiet numpy Pillow
          python3 tools/verify_cape_placement.py --assets-only --jar "$files/$jar"
          python3 tools/verify_forge_placement.py "$RUNNER_TEMP/capa-shots"
          out="entregables/v1.67.19/$jar"
          test ! -e "$out"
          install -D -m 0644 "$files/$jar" "$out"
          install -D -m 0644 "$files/SHA256SUMS.txt" docs/releases/v1.67.19/JAR.sha256
          install -D -m 0644 "$RUNNER_TEMP/capa-shots/colocacion-original-forge.jpg" docs/capa_v16719_colocacion_forge.jpg
          python3 - "$RUNNER_TEMP/capa-before" "$RUNNER_TEMP/capa-shots" docs/capa_v16719_encastre_alex.jpg <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import sys
          before, after, target = map(Path, sys.argv[1:])
          views = ('izquierda', 'diagonal', 'arriba')
          cw, ch = 320, 243
          image = Image.new('RGB', (cw*3, 55+(ch+39)*2), '#15101a')
          pen = ImageDraw.Draw(image)
          pen.text((14, 10), 'ALEX / CURIOS - MISMA CAMARA EN FORGE 1.20.1', fill='#ffe4f0')
          for col,label in enumerate(('PERFIL', 'TRES CUARTOS', 'CENITAL')):
              pen.text((col*cw+14, 33),label,fill='#efc5da')
          for row, (root,title) in enumerate(((before,'v1.67.18 / ANTES'), (after,'v1.67.19 / ENCASTRE NUEVO'))):
              y = 57+row*(ch+39)
              pen.text((14,y),title,fill='#ffe4f0')
              for col,view in enumerate(views):
                  with Image.open(root/f'posicion-alex-curios-{view}.png') as raw:
                      w,h=raw.size
                      # Crop both builds by the same fractions, preserving aspect and
                      # exposing the shoulder, top of the torso and start of the cloth.
                      top, bottom = (.11,.86) if view=='arriba' else (.04,.66)
                      h0,h1=round(h*top),round(h*bottom)
                      width=min(w,round((h1-h0)*(cw-12)/ch))
                      cropped=raw.convert('RGB').crop(((w-width)//2,h0,(w-width)//2+width,h1))
                      cropped.thumbnail((cw-12,ch),Image.Resampling.LANCZOS)
                      image.paste(cropped,(col*cw+(cw-cropped.width)//2,y+20))
          image.save(target,quality=93,optimize=True)
          PY
          git add -f -- "$out" docs/releases/v1.67.19/JAR.sha256 docs/capa_v16719_colocacion_forge.jpg docs/capa_v16719_encastre_alex.jpg
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Adjuntar el JAR v1.67.19 verificado y la lámina de encastre en Forge [skip ci]'
          git push origin "$branch"
