name: Comprobar las capturas y el JAR de prueba v1.67.16

on:
  push:
    branches: [arena/5a9fa51b-modelos]
    paths: [.github/workflows/copia-directa-v16716.yml]

jobs:
  copia:
    if: github.repository == 'Santi-PdR/modelos' && contains(github.event.head_commit.message, '[comprobar-capturas-v16716]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN: '44808610373'
      SOURCE_SHA: 495275a65aac91771289301e0d375e5eac835ece
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Confirmar el origen de la compilación y las tomas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" -- src build.gradle gradle.properties
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > "$RUNNER_TEMP/forge-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          job, = json.loads((Path(os.environ['RUNNER_TEMP'])/'forge-jobs.json').read_text())['jobs']
          outcomes = {s['name']: s['conclusion'] for s in job['steps']}
          for name in ('Build', 'Verify jar is reproducible', 'Verify jar contents (model resources)',
                       'Compare the packaged art with v1.67.14', 'Test worn-state and cosmetic profiles',
                       'Probar FX y equipo en Forge (opcional)', 'Comprobar el asiento original y las dos placas en Forge',
                       'Lámina con Steve y Alex, pecho y Curios', 'Verificar el icono original en la hotbar de Forge',
                       'Subir capturas de la prueba en mundo'):
              assert outcomes[name] == 'success', (name, outcomes[name])
          assert [name for name, result in outcomes.items() if result == 'failure'] == [
              'Medir ciclos y transiciones reales al caminar en F5']
          PY
      - name: Recuperar el JAR reproducible
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Santi-PdR/modelos
          run-id: '44808610373'
          name: capatest-jar
          path: ${{ runner.temp }}/capa-verified
      - name: Recuperar las tomas y trazas del mismo run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Santi-PdR/modelos
          run-id: '44808610373'
          name: capatest-fx-en-mundo
          path: ${{ runner.temp }}/capa-shots
      - name: Validar la marcha y la colocación sin pedir tomas históricas
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy Pillow
          shots="$RUNNER_TEMP/capa-shots"
          test ! -e "$shots/cenital-sin-manto.png"
          python3 tools/verify_forge_walk.py "$shots" --motion-only
          python3 tools/verify_forge_placement.py "$shots"
          PYTHONPATH=tools python3 -c 'from pathlib import Path; import sys; from verify_forge_mount import hotbar; hotbar(Path(sys.argv[1]))' "$shots"
          python3 tools/verify_cape_placement.py --assets-only --jar "$RUNNER_TEMP/capa-verified/capatest-1.67.16.jar"
      - name: Adjuntar sólo el JAR comprobado y la lámina a la rama de trabajo
        run: |
          set -euo pipefail
          branch=arena/5a9fa51b-modelos
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git branch --show-current)" = "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jar=capatest-1.67.16.jar
          files="$RUNNER_TEMP/capa-verified"
          hash=9f9e4cedbdc3e16e9cc7648e92e527377a923ddaa21d042de2c8edf0d344f950
          test "$(cat "$files/SHA256SUMS.txt")" = "$hash  $jar"
          (cd "$files" && sha256sum -c SHA256SUMS.txt)
          out="entregables/v1.67.16/$jar"
          test ! -e "$out"
          install -D -m 0644 "$files/$jar" "$out"
          install -D -m 0644 "$files/SHA256SUMS.txt" docs/releases/v1.67.16/JAR.sha256
          install -D -m 0644 "$RUNNER_TEMP/capa-shots/colocacion-original-forge.jpg" docs/capa_v16716_colocacion_forge.jpg
          git add -f -- "$out" docs/releases/v1.67.16/JAR.sha256 docs/capa_v16716_colocacion_forge.jpg
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Adjuntar el JAR original v1.67.16 probado en Forge y sus capturas [skip ci]'
          git push origin "$branch"
