name: Preparar descarga del JAR v1.67.10 aprobado

on:
  push:
    paths:
      - '.github/workflows/stage-verified-v16710.yml'

jobs:
  stage:
    if: github.ref == 'refs/heads/arena/5a9fa51b-modelos' && contains(github.event.head_commit.message, '[promover-v16710]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      checks: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '44607403078'
      VERIFIED_SHA: bae830471eb223ebe5669a3464fe1d110522401d
      JAR_SHA: 40c66e71e62ad0fe593ef8a2887fd9b1bdd1bc533d34053d4c2861e7b24e4ec3
    steps:
      - uses: actions/checkout@v4
      - name: Certificar el origen del JAR
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$VERIFIED_SHA"
          git diff --exit-code "$VERIFIED_SHA" "$GITHUB_SHA" -- src build.gradle settings.gradle gradle.properties docs/CAPA_v1.67.10.bbmodel docs/capa_v1170_visor.html
          gh run view "$VERIFIED_RUN" --json status,conclusion,headSha,headBranch,jobs > "$RUNNER_TEMP/verified.json"
          jq -e --arg sha "$VERIFIED_SHA" '
            .status == "completed" and .conclusion == "success" and .headSha == $sha and
            .headBranch == "arena/5a9fa51b-modelos" and
            ([.jobs[].steps[] | select(.name | test("^(Build$|Verify jar is reproducible|Probar FX y equipo|Verificar el desplazamiento visible|Verificar la unión y el icono)"))]
             | length == 5 and all(.conclusion == "success"))
          ' "$RUNNER_TEMP/verified.json"
          job=$(jq -er '.jobs[0].databaseId' "$RUNNER_TEMP/verified.json")
          gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations?per_page=100" > "$RUNNER_TEMP/proof.json"
          jq -e --arg checksum "$JAR_SHA  capatest-1.67.10.jar" \
            'any(.[]; .title == "SHA-256 del JAR Forge verificado" and .message == $checksum)' "$RUNNER_TEMP/proof.json"
      - name: Recuperar el artefacto original de la prueba
        uses: actions/download-artifact@v4
        with:
          name: capatest-jar
          path: release-input
          github-token: ${{ github.token }}
          run-id: ${{ env.VERIFIED_RUN }}
      - name: Verificar el binario y preparar el borrador, sin publicar
        run: |
          set -euo pipefail
          jar=release-input/capatest-1.67.10.jar
          bb=docs/CAPA_v1.67.10.bbmodel
          sums="$RUNNER_TEMP/SHA256SUMS.txt"
          printf '%s  %s\n' "$JAR_SHA" "$jar" | sha256sum -c -
          printf '%s  %s\n' "$JAR_SHA" "${jar##*/}" > "$sums"
          sha256sum "$bb" | sed 's|  docs/|  |' >> "$sums"
          assets=("$jar" "$bb" "$sums" docs/capa_v1170_visor.html docs/capa_v16710_inclinacion_forge.png)
          gh release create v1.67.10 "${assets[@]}" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title 'Mantle of the Blight Star v1.67.10' \
            --notes "JAR idéntico al artefacto aprobado de Forge del run $VERIFIED_RUN."
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"v1.67.10\" and .draft and .target_commitish == \"$GITHUB_SHA\")" > "$RUNNER_TEMP/draft.json"
          for asset in "${assets[@]}"; do
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
            jq -e --arg name "${asset##*/}" --arg sha "sha256:$digest" \
              'any(.assets[]; .name == $name and .digest == $sha and .state == "uploaded")' "$RUNNER_TEMP/draft.json"
          done
