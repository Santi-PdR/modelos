plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Opt-in integration probes. Neither the probe code nor Curios ships in the JAR.
def fxSmokeRun = providers.gradleProperty('capeFxSmoke').isPresent()
def historicFit = fxSmokeRun && providers.gradleProperty('capeHistory').isPresent()
if (fxSmokeRun) {
    sourceSets.main.java.srcDir 'src/fxSmoke/java'
    sourceSets.main.resources.srcDir 'src/fxSmoke/resources'
}
if (historicFit) {
    // Prepared by tools/prepare_historical_fit.py from the pinned release.
    sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/cape-history/java')
    sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/cape-history/resources')
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // GeckoLib ships SRG mixin refs. Remap them only in the named dev client.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            if (historicFit) property 'cape.history', 'true'
            if (fxSmokeRun) {
                workingDirectory project.layout.buildDirectory.dir('fx-smoke-run').get().asFile
            }
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    // Curios API: dependencia BLANDA (sólo compile-time), el jar no se incluye.
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // GeckoLib 4.8.1 para Forge 1.20.1 (Modrinth Maven)
    implementation fg.deobf("maven.modrinth:8BmcQJ2H:${geckolib_modrinth_version}")
    // Curios 5.14.1 para Forge 1.20.1. compileOnly => el mod funciona sin Curios;
    // las clases de compat se cargan por reflexión sólo si el mod está presente.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if (fxSmokeRun) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// v1.27.1: JAR REPRODUCIBLE. Sin esto, dos builds del MISMO codigo
// producen .jar distintos (el ZIP guarda la fecha de modificacion de
// cada entrada), asi que el SHA-256 del .jar publicado cambia en cada
// republicacion y no sirve para verificar nada. Con estas dos opciones
// el .jar es byte-identico entre builds: el digest publicado es el mismo
// que puede recomputar cualquiera.
//
// Se aplica a TODAS las tareas de archivo (no solo a `jar`), porque
// ForgeGradle remapea el .jar en `reobfJar`, que es la que escribe
// realmente build/libs/*.jar.
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    exclude 'com/capatest/client/CapeFxSmoke*.class', 'com/capatest/client/CapeLookSweep*.class',
            'com/capatest/client/CapeWalkProbe*.class', 'com/capatest/client/CapeFixedMountProbe*.class', 'com/capatest/client/CapePlateProbe*.class',
            'com/capatest/client/CapeHistoric*.class', 'assets/capatest/**/fixture_v1280*', 'assets/capatest/geo/test/*'
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
